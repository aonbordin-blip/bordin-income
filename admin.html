<script>
    // ตรวจสอบสิทธิ์ก่อนแสดงผลหน้าเว็บ
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9;
            --secondary: #00c6ff;
            --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.85);
            --success: #2ecc71;
            --warning: #ffa800;
            --danger: #ff7675;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: #333; 
            padding-bottom: 50px; 
        }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; 
            padding: 40px 20px 50px; 
            text-align: center;
            border-radius: 0 0 40px 40px; 
            box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2);
        }

        .container { 
            max-width: 1000px; 
            margin: -30px auto 0; 
            padding: 0 15px; 
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            margin: 25px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: transform 0.2s;
        }

        .card:hover { transform: translateY(-3px); }

        .btn-action {
            border: none; padding: 8px 15px; border-radius: 12px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            transition: 0.3s; color: #fff; flex: 1; text-align: center;
        }
        .btn-edit { background: var(--primary); }
        .btn-approve { background: var(--success); }
        .btn-reject { background: var(--danger); }
        .btn-manage { background: #f39c12; }

        .status-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        /* Modal Styles */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #fff; margin: 5% auto; padding: 25px;
            border-radius: 25px; width: 90%; max-width: 600px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            max-height: 80vh; overflow-y: auto;
        }
        .close {
            color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer;
        }
        .close:hover { color: var(--danger); }

        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary); font-size: 14px; }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px;
            box-sizing: border-box; margin-bottom: 15px; font-family: inherit;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0; font-size: 26px;">ระบบจัดการผู้ดูแล (Admin)</h1>
        <p style="margin:5px 0 0; opacity: 0.9;">✓Record Income - จัดการข้อมูลบุคลากร</p>
    </div>

    <div class="container">
        <div style="background: var(--glass); padding: 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 20px; text-align: center;">
            <label style="font-weight:bold; color:var(--primary); margin-right: 10px;">เลือกวันที่ดูรายการลา:</label>
            <input type="date" id="filterDate" onchange="renderDailyLeaves()" style="padding: 10px; border-radius: 10px; border: 1px solid #ccc;">
            <button onclick="document.getElementById('filterDate').value = ''; renderDailyLeaves();" style="padding: 10px 15px; border-radius: 10px; border: none; background: #eee; cursor:pointer;">ดูทั้งหมด</button>
        </div>

        <div class="section-title">📅 รายการแจ้งลาหยุด</div>
        <div id="leaveDailySection" class="grid-container"></div>

        <div class="section-title">👥 ข้อมูลพนักงานทั้งหมด</div>
        <div id="staffSection" class="grid-container"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('editModal')">&times;</span>
            <h2 style="color: var(--primary); text-align: center; margin-top:0;">จัดการข้อมูลพนักงาน</h2>
            
            <div class="input-group">
                <input type="hidden" id="editEmpId">
                <label>ชื่อ-นามสกุล</label>
                <input type="text" id="editName">
                <label>เบอร์โทรศัพท์</label>
                <input type="tel" id="editPhone">
                <label>ตำแหน่ง</label>
                <input type="text" id="editPos">
                <label>แผนก</label>
                <input type="text" id="editDept">
                
                <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 20px;">ตั้งค่าโควตาการลา (วัน/ปี)</h3>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label>ลาป่วย</label>
                        <input type="number" id="q_sick" value="30">
                    </div>
                    <div style="flex:1;">
                        <label>ลากิจ</label>
                        <input type="number" id="q_personal" value="6">
                    </div>
                    <div style="flex:1;">
                        <label>พักร้อน</label>
                        <input type="number" id="q_vacation" value="10">
                    </div>
                </div>
            </div>

            <button onclick="updateStaffInfo()" style="width: 100%; padding: 15px; background: var(--success); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top:10px;">💾 บันทึกข้อมูลพนักงาน</button>
        </div>
    </div>

    <div id="leaveEditModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('leaveEditModal')">&times;</span>
            <h2 style="color: var(--primary); text-align: center; margin-top:0;">จัดการรายการลา</h2>
            
            <div style="background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #eee;">
                <input type="hidden" id="editLeaveId">
                <div class="input-group">
                    <label>ประเภทการลา</label>
                    <input type="text" id="editLeaveType" readonly style="background:#e9ecef;">
                    
                    <label>สาเหตุการลา</label>
                    <textarea id="editLeaveReason" rows="2" readonly style="background:#e9ecef; resize:none;"></textarea>

                    <label>ปรับสถานะการอนุมัติ</label>
                    <select id="editLeaveStatus" style="font-weight:bold;">
                        <option value="รอการอนุมัติ">⏳ รอการอนุมัติ</option>
                        <option value="อนุมัติ">✅ อนุมัติ</option>
                        <option value="ไม่อนุมัติ">❌ ไม่อนุมัติ</option>
                        <option value="ยกเลิก">🗑️ ยกเลิกรายการ</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="saveLeaveEdit()" class="btn-action btn-approve" style="padding:12px;">💾 บันทึกสถานะ</button>
                    <button onclick="deleteLeaveFromPopup()" class="btn-action btn-reject" style="padding:12px; background:var(--danger);">🗑️ ลบข้อมูล</button>
                </div>
            </div>

            <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">📊 สถิติ & ประวัติการลาของพนักงาน</h3>
            <div id="modalLeaveStats" style="display:flex; gap:10px; margin-bottom: 15px;"></div>
            <div id="modalLeaveHistory" style="max-height: 250px; overflow-y: auto; padding-right:5px;"></div>
        </div>
    </div>

<script>
    let currentStaffObj = {};

    function formatTimestamp(timestamp) {
        if(!timestamp) return '-';
        const d = new Date(parseInt(timestamp));
        return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // --- ส่วนที่ 1: จัดการข้อมูลพนักงาน ---
    function renderStaffSection() {
        const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};
        const container = document.getElementById("staffSection");
        
        if (!staff.employeeId) {
            container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 20px;">ไม่พบข้อมูลพนักงานในระบบ</div>`;
            return;
        }

        // ดึงโควตา
        const sick = staff.q_sick || 30;
        const personal = staff.q_personal || 6;
        const vacation = staff.q_vacation || 10;

        container.innerHTML = `
            <div class="card">
                <div style="display:flex; align-items:center; gap: 15px; margin-bottom: 15px;">
                    <img src="${staff.photo || 'https://via.placeholder.com/60'}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid var(--primary);">
                    <div>
                        <div style="font-weight:bold; font-size:16px; color:var(--primary);">${staff.fullName || 'ไม่มีชื่อ'}</div>
                        <div style="font-size:13px; color:#666;">รหัส: ${staff.employeeId || '-'} | ${staff.department || '-'}</div>
                    </div>
                </div>
                <div style="font-size: 14px; color: #444; margin-bottom: 5px;">
                    📞 เบอร์โทร: <strong>${staff.phone || '-'}</strong>
                </div>
                <div style="font-size: 14px; color: #444; margin-bottom: 15px;">
                    💼 ตำแหน่ง: ${staff.position || '-'}
                </div>
                <div style="font-size: 12px; background:#f0f2f5; padding:8px; border-radius:8px; margin-bottom:15px; color:#555;">
                    <strong>โควตา:</strong> ป่วย ${sick} | กิจ ${personal} | พักร้อน ${vacation}
                </div>
                <button class="btn-action btn-edit" style="width:100%; padding:10px;" onclick="openEditModal()">✏️ จัดการข้อมูล & โควตา</button>
            </div>
        `;
    }

    // --- ส่วนที่ 2: รายการแจ้งลาหยุด (หน้าหลัก) ---
    function renderDailyLeaves() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const container = document.getElementById("leaveDailySection");
        const filterDate = document.getElementById("filterDate").value;

        // กรองตามวันที่เลือก หรือแสดงทั้งหมด
        let filtered = requests;
        if (filterDate) {
            const [y, m, d] = filterDate.split('-');
            const thaiDate = `${parseInt(d)}/${parseInt(m)}/${parseInt(y)+543}`;
            filtered = requests.filter(r => r.date === thaiDate);
        }

        // เรียงลำดับจากล่าสุดไปเก่าสุด
        filtered.sort((a, b) => b.id - a.id);

        if (filtered.length === 0) {
            container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 20px;">ไม่มีรายการแจ้งลาในวันที่เลือก</div>`;
            return;
        }

        container.innerHTML = filtered.map(req => {
            let statusClass = req.status === 'อนุมัติ' ? 'status-approved' : (req.status === 'ไม่อนุมัติ' ? 'status-rejected' : 'status-pending');
            
            return `
            <div class="card" style="border-left: 5px solid ${req.status === 'อนุมัติ' ? 'var(--success)' : (req.status==='ไม่อนุมัติ'?'var(--danger)':'var(--warning)')}">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                    <div style="font-weight:bold; color:var(--primary);">${req.name}</div>
                    <span class="status-badge ${statusClass}">${req.status}</span>
                </div>
                <div style="font-size:14px; color:#555; margin-bottom:5px;">
                    ประเภท: <strong>${req.type}</strong> (${req.days} วัน)
                </div>
                <div style="font-size:12px; color:#777; margin-bottom:5px;">
                    📅 ลาวันที่: ${req.startDate} ถึง ${req.endDate}
                </div>
                <div style="font-size:11px; color:#999; margin-bottom:15px; border-top: 1px dashed #eee; padding-top: 5px;">
                    🕒 วันที่ทำรายการ: ${formatTimestamp(req.id)}
                </div>
                
                <button class="btn-action btn-manage" style="width:100%;" onclick="openLeaveEditPopup(${req.id}, '${req.empId}')">⚙️ จัดการรายการนี้</button>
            </div>
            `;
        }).join('');
    }

    // --- ส่วนที่ 3: จัดการ Popup ข้อมูลการลา ---
    function openLeaveEditPopup(reqId, empId) {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const req = requests.find(r => r.id === reqId);
        
        if(req) {
            document.getElementById("editLeaveId").value = req.id;
            document.getElementById("editLeaveType").value = req.type;
            // โหลดสาเหตุการลามาแสดง
            document.getElementById("editLeaveReason").value = req.reason || 'ไม่มีการระบุสาเหตุ';
            document.getElementById("editLeaveStatus").value = req.status;
            
            renderModalStatsAndHistory(empId);
            document.getElementById("leaveEditModal").style.display = "block";
        }
    }

    function renderModalStatsAndHistory(empId) {
        const profile = JSON.parse(localStorage.getItem("employee_profile")) || {};
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const myLeaves = requests.filter(r => r.empId === empId);

        // คำนวณสถิติ
        const sickUsed = myLeaves.filter(r => r.type === 'ลาป่วย' && r.status === 'อนุมัติ').reduce((sum, r) => sum + parseFloat(r.days||0), 0);
        const perUsed = myLeaves.filter(r => r.type === 'ลากิจ' && r.status === 'อนุมัติ').reduce((sum, r) => sum + parseFloat(r.days||0), 0);
        const vacUsed = myLeaves.filter(r => r.type === 'ลาพักร้อน' && r.status === 'อนุมัติ').reduce((sum, r) => sum + parseFloat(r.days||0), 0);

        const qSick = profile.q_sick || 30;
        const qPer = profile.q_personal || 6;
        const qVac = profile.q_vacation || 10;

        document.getElementById("modalLeaveStats").innerHTML = `
            <div style="flex:1; background:#e8f4f8; padding:10px; border-radius:10px; text-align:center; font-size:12px;">
                <strong>ป่วย</strong><br>ใช้ ${sickUsed}/${qSick}
            </div>
            <div style="flex:1; background:#fff3cd; padding:10px; border-radius:10px; text-align:center; font-size:12px;">
                <strong>กิจ</strong><br>ใช้ ${perUsed}/${qPer}
            </div>
            <div style="flex:1; background:#d4edda; padding:10px; border-radius:10px; text-align:center; font-size:12px;">
                <strong>พักร้อน</strong><br>ใช้ ${vacUsed}/${qVac}
            </div>
        `;

        // ประวัติการลาเรียงจากใหม่ไปเก่า (เพิ่มวันที่ทำรายการ)
        const historyDiv = document.getElementById("modalLeaveHistory");
        if(myLeaves.length > 0) {
            myLeaves.sort((a,b) => b.id - a.id);
            historyDiv.innerHTML = myLeaves.map(l => {
                let sColor = l.status === 'อนุมัติ' ? 'color:var(--success);' : (l.status === 'ไม่อนุมัติ' ? 'color:var(--danger);' : 'color:var(--warning);');
                return `
                <div style="background:#f8f9fa; padding:10px 15px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border: 1px solid #eaeaea;">
                    <div>
                        <strong style="color:var(--primary);">${l.type}</strong> (${l.days} วัน)<br>
                        <span style="font-size:12px; color:#555;">📅 ลาวันที่: ${l.startDate} ถึง ${l.endDate}</span><br>
                        <span style="font-size:11px; color:#999;">🕒 ทำรายการ: ${formatTimestamp(l.id)}</span>
                    </div>
                    <div style="font-weight:bold; font-size:13px; ${sColor}">${l.status}</div>
                </div>
                `;
            }).join('');
        } else {
            historyDiv.innerHTML = `<div style="text-align:center; color:#999; padding:10px;">ไม่พบประวัติการลา</div>`;
        }
    }

    // --- ฟังก์ชันบันทึกและจัดการทั่วไป ---
    function saveLeaveEdit() {
        const id = parseInt(document.getElementById("editLeaveId").value);
        const newStatus = document.getElementById("editLeaveStatus").value;
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        
        const index = requests.findIndex(r => r.id === id);
        if(index !== -1) {
            requests[index].status = newStatus;
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            alert("✅ บันทึกสถานะเรียบร้อยแล้ว");
            closeModal('leaveEditModal');
            renderDailyLeaves();
        }
    }

    function deleteLeaveFromPopup() {
        if(confirm("⚠️ ยืนยันการลบรายการลานี้ออกจากระบบ?")) {
            const id = parseInt(document.getElementById("editLeaveId").value);
            let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
            requests = requests.filter(r => r.id !== id);
            
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            closeModal('leaveEditModal');
            renderDailyLeaves();
        }
    }

    // --- ฟังก์ชันเปิด Popup และดึงข้อมูลมาแสดง ---
function openEditModal() {
    const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

    // --- ข้อมูลส่วนตัว ---
    document.getElementById("editEmpId").value = staff.employeeId || '';
    document.getElementById("editName").value = staff.fullName || '';
    document.getElementById("editIdCard").value = staff.idCard || '';
    document.getElementById("editPhone").value = staff.phone || '';
    document.getElementById("editPos").value = staff.position || '';
    document.getElementById("editDept").value = staff.department || '';

    // --- ข้อมูลที่อยู่ ---
    document.getElementById("editAddrNo").value = staff.addr_no || '';
    document.getElementById("editAddrMoo").value = staff.addr_moo || '';
    document.getElementById("editAddrSub").value = staff.addr_subdistrict || '';
    document.getElementById("editAddrDist").value = staff.addr_district || '';
    document.getElementById("editAddrProv").value = staff.addr_province || '';
    document.getElementById("editAddrZip").value = staff.addr_zipcode || '';

    // --- โควตาการลา ---
    document.getElementById("q_sick").value = staff.q_sick || 30;
    document.getElementById("q_personal").value = staff.q_personal || 6;
    document.getElementById("q_vacation").value = staff.q_vacation || 10;

    document.getElementById("editModal").style.display = "block";
}


    // --- ฟังก์ชันบันทึกข้อมูลกลับไปยัง localStorage ---
function updateStaffInfo() {
    // ดึงก้อนข้อมูลเดิมมาเผื่อไว้ (เช่น รูปภาพจะได้ไม่หาย)
    const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

    // รับค่าจาก Input ใน Popup มาอัปเดต
    staff.employeeId = document.getElementById("editEmpId").value;
    staff.fullName = document.getElementById("editName").value;
    staff.idCard = document.getElementById("editIdCard").value;
    staff.phone = document.getElementById("editPhone").value;
    staff.position = document.getElementById("editPos").value;
    staff.department = document.getElementById("editDept").value;

    staff.addr_no = document.getElementById("editAddrNo").value;
    staff.addr_moo = document.getElementById("editAddrMoo").value;
    staff.addr_subdistrict = document.getElementById("editAddrSub").value;
    staff.addr_district = document.getElementById("editAddrDist").value;
    staff.addr_province = document.getElementById("editAddrProv").value;
    staff.addr_zipcode = document.getElementById("editAddrZip").value;

    staff.q_sick = document.getElementById("q_sick").value;
    staff.q_personal = document.getElementById("q_personal").value;
    staff.q_vacation = document.getElementById("q_vacation").value;

    // บันทึกลง localStorage
    localStorage.setItem("employee_profile", JSON.stringify(staff));
    
    alert("✅ อัปเดตข้อมูลพนักงานทั้งหมดเรียบร้อยแล้ว");
    closeModal('editModal');
    
    // รีเฟรชส่วนการแสดงผลหน้า Admin
    if (typeof renderStaffSection === "function") renderStaffSection();
}

    function closeModal(mId) { document.getElementById(mId).style.display = "none"; }

    window.onclick = function(event) {
        if (event.target == document.getElementById("editModal")) closeModal('editModal');
        if (event.target == document.getElementById("leaveEditModal")) closeModal('leaveEditModal');
    }

    window.onload = () => {
        document.getElementById('filterDate').value = new Date().toLocaleDateString('en-CA'); 
        renderStaffSection();
        renderDailyLeaves();
    };
</script>
</body>
</html>
