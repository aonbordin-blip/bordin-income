<script>
    // ตรวจสอบสิทธิ์ก่อนแสดงผลหน้าเว็บ
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9; --secondary: #00c6ff; --bg: #F8F9FD;
            --success: #2ecc71; --danger: #ff7675; --warning: #f1c40f;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; padding: 40px 20px 60px; text-align: center;
            border-radius: 0 0 40px 40px;
        }

        .container { max-width: 1000px; margin: -40px auto 0; padding: 0 15px; }
        
        .section-card {
            background: #fff; border-radius: 25px; padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px;
        }

        .search-box {
            width: 100%; padding: 14px 20px; border-radius: 15px; border: 1px solid #ddd;
            box-sizing: border-box; font-size: 14px; margin-bottom: 20px; outline: none;
        }

        .leave-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .leave-card { background: #fff; border-radius: 20px; padding: 20px; border: 1px solid #eee; position: relative; }
        
        .badge { padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #fff4de; color: #ffa800; }
        .badge-approved { background: #c9f7f5; color: #1bc5bd; }
        .badge-rejected { background: #ffe2e5; color: #f64e60; }

        .btn { border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-edit { background: #f0edff; color: var(--primary); }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-reject { background: #ffe2e5; color: var(--danger); }
        .btn-delete { background: #ffe2e5; color: var(--danger); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .modal-content { background: #fff; margin: 2% auto; padding: 30px; width: 90%; max-width: 700px; border-radius: 30px; max-height: 90vh; overflow-y: auto; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #888; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; background: #fafafa; font-size: 14px; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin: 0; font-size: 26px;">Admin Management</h1>
</div>

<div class="container">
    <div class="section-card">
        <div style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px;">👥 จัดการข้อมูลพนักงาน</div>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ค้นหาชื่อพนักงาน หรือตำแหน่ง..." onkeyup="renderTable()">
        <div style="overflow-x: auto;">
            <table>
                <tbody id="staffTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="section-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <div style="font-size: 18px; font-weight: 800; color: var(--primary);">📅 รายการแจ้งลา (วันนี้/ย้อนหลัง)</div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 12px; font-weight: bold; color: #666;">วันที่ทำรายการ:</span>
                <input type="date" id="filterDate" onchange="renderLeaveRequests()" style="padding: 8px; border-radius: 10px; border: 1px solid #ddd; font-size: 12px;">
            </div>
        </div>
        <div id="leaveRequestGrid" class="leave-grid"></div>
    </div>
</div>

<div id="leaveEditModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0; color: var(--primary);">📝 แก้ไขรายการแจ้งลา</h2>
            <span onclick="closeLeaveModal()" style="cursor:pointer; font-size: 24px; color: #ccc;">&times;</span>
        </div>
        
        <input type="hidden" id="currentLeaveId">
        <div class="form-grid">
            <div class="form-group">
                <label>ประเภทการลา</label>
                <select id="editLeaveType">
                    <option value="ลาป่วย">ลาป่วย</option>
                    <option value="ลากิจ">ลากิจ</option>
                    <option value="ลาพักร้อน">ลาพักร้อน</option>
                </select>
            </div>
            <div class="form-group"><label>จำนวนวัน</label><input type="number" id="editLeaveDays"></div>
            <div class="form-group"><label>เริ่มวันที่</label><input type="date" id="editLeaveStart"></div>
            <div class="form-group"><label>ถึงวันที่</label><input type="date" id="editLeaveEnd"></div>
        </div>
        <div class="form-group"><label>เหตุผลการลา</label><textarea id="editLeaveReason" rows="3"></textarea></div>
        <div class="form-group">
            <label>สถานะการลา</label>
            <select id="editLeaveStatus">
                <option value="รอการอนุมัติ">รอการอนุมัติ</option>
                <option value="อนุมัติ">อนุมัติ</option>
                <option value="ไม่อนุมัติ">ไม่อนุมัติ</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn" style="background: var(--primary); color: #fff; flex: 2; padding: 15px;" onclick="saveLeaveEdit()">💾 บันทึกการแก้ไข</button>
            <button class="btn btn-delete" style="flex: 1; padding: 15px;" onclick="deleteLeaveRecordFromPopup()">🗑️ ลบรายการ</button>
        </div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0; color: var(--primary);">👤 ข้อมูลพนักงานและโควตา</h2>
            <span onclick="closeModal()" style="cursor:pointer; font-size: 24px; color: #ccc;">&times;</span>
        </div>
        <div class="form-grid">
            <div class="form-group"><label>รหัสพนักงาน</label><input type="text" id="editEmpId"></div>
            <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="editName"></div>
            <div class="form-group"><label>ตำแหน่ง</label><input type="text" id="editPos"></div>
            <div class="form-group"><label>แผนก</label><input type="text" id="editDept"></div>
            <div class="form-group"><label>เบอร์โทรศัพท์</label><input type="text" id="editPhone"></div>
        </div>
        <h4 style="color: var(--primary); margin: 15px 0 5px;">🏠 ข้อมูลที่อยู่</h4>
        <div class="form-grid">
            <div class="form-group"><label>บ้านเลขที่/หมู่</label><input type="text" id="editAddrNo"></div>
            <div class="form-group"><label>จังหวัด</label><input type="text" id="editAddrProv"></div>
        </div>
        <h4 style="color: var(--primary); margin: 15px 0 5px;">📊 จัดการโควตา</h4>
        <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="form-group"><label>ป่วย</label><input type="number" id="q_sick"></div>
            <div class="form-group"><label>กิจ</label><input type="number" id="q_personal"></div>
            <div class="form-group"><label>พักร้อน</label><input type="number" id="q_vacation"></div>
        </div>
        <button class="btn" style="background: var(--primary); color: #fff; width: 100%; padding: 15px; margin-top: 10px;" onclick="updateStaffInfo()">💾 บันทึกข้อมูลพนักงาน</button>
    </div>
</div>

<script>
    let staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

    // ฟังก์ชันช่วยจัดรูปแบบวันที่ให้อยู่ในรูป YYYY-MM-DD เพื่อเปรียบเทียบกับ input date
    function getTodayDateString() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    // ตั้งค่าเริ่มต้นของตัวกรองเป็น "วันนี้"
    document.getElementById("filterDate").value = getTodayDateString();

    function renderTable() {
        const tableBody = document.getElementById("staffTableBody");
        const searchText = document.getElementById("searchInput").value.toLowerCase();
        tableBody.innerHTML = '';
        if(!staff.fullName) return;
        if(staff.fullName.toLowerCase().includes(searchText)) {
            tableBody.innerHTML = `
                <tr>
                    <td><strong>${staff.fullName}</strong><br><small>${staff.position}</small></td>
                    <td><button class="btn btn-edit" onclick="openEditModal()">⚙️ จัดการข้อมูล/โควตา</button></td>
                </tr>
            `;
        }
    }

    function renderLeaveRequests() {
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const filterDate = document.getElementById("filterDate").value; // YYYY-MM-DD
        const grid = document.getElementById("leaveRequestGrid");
        
        // กรองตามวันที่ทำรายการ (ต้องแน่ใจว่าตอนบันทึก req.date เก็บเป็น YYYY-MM-DD หรือแปลงเปรียบเทียบ)
        let displayRequests = requests.filter(req => {
            // สมมติว่า req.date คือวันที่ทำรายการ ถ้าไม่มีให้ใช้ startDate แทน หรือตามที่ระบบเก็บ
            return req.date === filterDate || req.startDate === filterDate;
        });

        if(displayRequests.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#999;">ไม่พบรายการของวันที่ ${filterDate}</div>`;
            return;
        }

        grid.innerHTML = displayRequests.slice().reverse().map(req => `
            <div class="leave-card">
                <span class="badge ${req.status === 'รอการอนุมัติ' ? 'badge-pending' : (req.status === 'อนุมัติ' ? 'badge-approved' : 'badge-rejected')}">${req.status}</span>
                <div style="font-weight:800; font-size:16px; margin-top:10px; color:var(--primary);">${req.name}</div>
                <div style="font-size:13px; margin: 5px 0;"><strong>${req.type}</strong> (${req.days || '0'} วัน)</div>
                <div style="font-size:11px; color:#666;">ช่วงวันที่: ${req.startDate} ถึง ${req.endDate}</div>
                <div style="margin-top:15px;">
                    <button class="btn btn-edit" style="width:100%" onclick="openLeaveEditModal(${req.id})">🔍 ดูรายละเอียด / แก้ไข</button>
                </div>
            </div>
        `).join('');
    }

    // ฟังก์ชัน Popup แก้ไขการลา
    function openLeaveEditModal(leaveId) {
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const req = requests.find(r => r.id === leaveId);
        if(req) {
            document.getElementById("currentLeaveId").value = req.id;
            document.getElementById("editLeaveType").value = req.type;
            document.getElementById("editLeaveDays").value = req.days;
            document.getElementById("editLeaveStart").value = req.startDate;
            document.getElementById("editLeaveEnd").value = req.endDate;
            document.getElementById("editLeaveReason").value = req.reason || '';
            document.getElementById("editLeaveStatus").value = req.status;
            document.getElementById("leaveEditModal").style.display = "block";
        }
    }

    function saveLeaveEdit() {
        const id = parseInt(document.getElementById("currentLeaveId").value);
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const idx = requests.findIndex(r => r.id === id);
        
        if(idx !== -1) {
            requests[idx].type = document.getElementById("editLeaveType").value;
            requests[idx].days = document.getElementById("editLeaveDays").value;
            requests[idx].startDate = document.getElementById("editLeaveStart").value;
            requests[idx].endDate = document.getElementById("editLeaveEnd").value;
            requests[idx].reason = document.getElementById("editLeaveReason").value;
            requests[idx].status = document.getElementById("editLeaveStatus").value;

            localStorage.setItem("leave_requests", JSON.stringify(requests));
            alert("✅ บันทึกการแก้ไขเรียบร้อยแล้ว");
            closeLeaveModal();
            renderLeaveRequests();
        }
    }

    function deleteLeaveRecordFromPopup() {
        if(confirm("ยืนยันการลบรายการลานี้ถาวร?")) {
            const id = parseInt(document.getElementById("currentLeaveId").value);
            let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
            requests = requests.filter(r => r.id !== id);
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            closeLeaveModal();
            renderLeaveRequests();
        }
    }

    function closeLeaveModal() { document.getElementById("leaveEditModal").style.display = "none"; }
    function closeModal() { document.getElementById("editModal").style.display = "none"; }
    function openEditModal() {
        document.getElementById("editModal").style.display = "block";
        document.getElementById("editEmpId").value = staff.employeeId || '';
        document.getElementById("editName").value = staff.fullName || '';
        document.getElementById("editPos").value = staff.position || '';
        document.getElementById("editDept").value = staff.department || '';
        document.getElementById("editPhone").value = staff.phone || '';
        document.getElementById("editAddrNo").value = staff.addr_no || '';
        document.getElementById("editAddrProv").value = staff.addr_province || '';
        document.getElementById("q_sick").value = staff.q_sick || 30;
        document.getElementById("q_personal").value = staff.q_personal || 6;
        document.getElementById("q_vacation").value = staff.q_vacation || 10;
    }

    function updateStaffInfo() {
        staff.fullName = document.getElementById("editName").value;
        staff.position = document.getElementById("editPos").value;
        staff.q_sick = document.getElementById("q_sick").value;
        staff.q_personal = document.getElementById("q_personal").value;
        staff.q_vacation = document.getElementById("q_vacation").value;
        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("✅ อัปเดตข้อมูลพนักงานและโควตาเรียบร้อย");
        closeModal();
        renderTable();
    }

    window.onload = () => { 
        renderTable(); 
        renderLeaveRequests(); 
    };
</script>
</body>
</html>
