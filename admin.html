<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9;
            --secondary: #00c6ff;
            --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: #333;
        }

        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; 
            padding: 40px 20px; 
            text-align: center;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2);
        }

        .header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
        .header p { opacity: 0.9; font-size: 14px; margin-top: 5px; }

        /* Search Section - Glassmorphism Design */
        .search-container {
            margin: -30px 20px 20px 20px;
            padding: 25px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .search-grid { grid-template-columns: 1fr 1fr 1fr; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(106, 90, 249, 0.2);
            background: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(106, 90, 249, 0.1);
        }

        /* Table Design */
        .card { 
            background: #fff; 
            margin: 20px; 
            padding: 20px; 
            border-radius: 24px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .table-container { overflow-x: auto; border-radius: 15px; }

        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        
        th { 
            background: #f8f9fa; 
            padding: 15px; 
            font-size: 13px; 
            color: #888; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td { 
            padding: 15px; 
            border-bottom: 1px solid #f1f1f1; 
            text-align: center;
            font-size: 15px;
        }

        .emp-info { text-align: left; }
        .emp-name { font-weight: bold; color: #333; }
        .emp-meta { font-size: 11px; color: #999; margin-top: 3px; }

        .btn-edit { 
            background: #fff; color: #f39c12; border: 1.5px solid #f39c12;
            padding: 6px 15px; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: all 0.2s;
        }
        .btn-edit:hover { background: #f39c12; color: #fff; }

        .btn-delete { 
            background: #fff; color: #e74c3c; border: 1.5px solid #e74c3c;
            padding: 6px 15px; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #e74c3c; color: #fff; }

        .status-pill {
            background: rgba(106, 90, 249, 0.1);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Management Panel</h1>
    <p>สืบค้นและจัดการข้อมูลพนักงานเชิงลึก</p>
</div>

<div class="search-container">
    <div class="search-grid">
        <div class="input-group">
            <label>🔎 ค้นหาด้วย รหัส/เลขบัตร/ชื่อ</label>
            <input type="text" id="mainSearch" placeholder="ระบุข้อมูลที่ต้องการค้นหา..." onkeyup="loadAdminData()">
        </div>
        <div class="input-group">
            <label>📅 เลือกเดือนที่บันทึก</label>
            <input type="month" id="adminMonthFilter" onchange="loadAdminData()">
        </div>
        <div class="input-group">
            <label>🏢 กรองตามแผนก</label>
            <input type="text" id="deptFilter" placeholder="ระบุแผนก..." onkeyup="loadAdminData()">
        </div>
    </div>
</div>

<div class="card">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left;">ข้อมูลพนักงาน</th>
                    <th>วันที่บันทึก</th>
                    <th>รายได้สุทธิ</th>
                    <th>สถานะ</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // ดึงข้อมูลรายได้ทั้งหมด
    let incomeData = JSON.parse(localStorage.getItem("income")) || [];
    // ดึงข้อมูลโปรไฟล์ (เพื่อเอาเลขบัตรและรหัสพนักงานมาเปรียบเทียบ)
    let staffProfile = JSON.parse(localStorage.getItem("employee_profile")) || {};

    function loadAdminData() {
        const tableBody = document.getElementById("adminTableBody");
        const searchTerm = document.getElementById("mainSearch").value.toLowerCase();
        const monthTerm = document.getElementById("adminMonthFilter").value;
        const deptTerm = document.getElementById("deptFilter").value.toLowerCase();
        
        tableBody.innerHTML = "";
        
        // ในระบบจริง ข้อมูล incomeData ควรมีฟิลด์ staffId หรือ idCard พ่วงมาด้วยทุก Record
        // ตัวอย่างการจำลองการค้นหาแบบครอบคลุม:
        incomeData.forEach((item, index) => {
            // เช็คเงื่อนไขการค้นหา (ชื่อพนักงาน, รหัสพนักงาน, หรือเลขบัตร)
            const matchesSearch = 
                (staffProfile.fullName && staffProfile.fullName.toLowerCase().includes(searchTerm)) ||
                (staffProfile.employeeId && staffProfile.employeeId.toLowerCase().includes(searchTerm)) ||
                (staffProfile.idCard && staffProfile.idCard.includes(searchTerm));
            
            const matchesMonth = !monthTerm || item.date.startsWith(monthTerm);
            const matchesDept = !deptTerm || (staffProfile.department && staffProfile.department.toLowerCase().includes(deptTerm));

            if (matchesSearch && matchesMonth && matchesDept) {
                // คำนวณรายได้สุทธิ (ใช้สูตรเดิมจากหน้าหลัก)
                let soc = Math.min(750, Math.ceil(((item.salary||0) + (item.shiftPay||0) + (item.gmp||0)) * 0.05));
                let net = (item.salary||0)+(item.shiftPay||0)+(item.ot||0)+(item.gmp||0)+(item.att||0)+(item.bonus||0)+(item.extra||0)-soc-(item.other||0);

                let row = `<tr>
                    <td class="emp-info">
                        <div class="emp-name">${staffProfile.fullName || 'ไม่ระบุชื่อ'}</div>
                        <div class="emp-meta">ID: ${staffProfile.employeeId || '-'} | ID Card: ${staffProfile.idCard || '-'}</div>
                    </td>
                    <td>${item.date}</td>
                    <td><strong style="color: #2ecc71;">฿${net.toLocaleString()}</strong></td>
                    <td><span class="status-pill">${staffProfile.department || 'ทั่วไป'}</span></td>
                    <td>
                        <button class="btn-edit" onclick="editData(${index})">แก้ไข</button>
                        <button class="btn-delete" onclick="deleteData(${index})">ลบ</button>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            }
        });

        if(tableBody.innerHTML === "") {
            tableBody.innerHTML = `<tr><td colspan="5" style="padding: 40px; color: #999;">ไม่พบข้อมูลที่ค้นหา</td></tr>`;
        }
    }

    function editData(index) {
        // สามารถต่อยอดไปเปิด Modal เพื่อแก้ไขข้อมูลได้
        alert("กำลังเปิดหน้าแก้ไขรายการวันที่: " + incomeData[index].date);
    }

    function deleteData(index) {
        if(confirm("ยืนยันการลบรายการนี้?")) {
            incomeData.splice(index, 1);
            localStorage.setItem("income", JSON.stringify(incomeData));
            loadAdminData();
        }
    }

    window.onload = loadAdminData;
</script>
</body>
</html>
