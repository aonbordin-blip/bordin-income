<script>
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9;
            --secondary: #00c6ff;
            --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.85);
            --success: #2ecc71;
            --danger: #ff7675;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; padding: 40px 20px; text-align: center;
            border-radius: 0 0 35px 35px; box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }

        .search-container {
            margin: -25px 0 20px; padding: 15px;
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 20px; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }

        .search-box {
            width: 100%; padding: 12px 15px; border-radius: 15px;
            border: 1px solid rgba(106, 90, 249, 0.2); outline: none; box-sizing: border-box;
        }

        .card {
            background: #fff; border-radius: 25px; padding: 20px;
            margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.03);
        }

        .section-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        /* Leave Card Style */
        .leave-item {
            background: #f9f9ff; border-radius: 18px; padding: 15px;
            margin-bottom: 12px; border: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }

        .badge { padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .status-pending { background: #fff4de; color: #ffa800; }
        .status-approved { background: #c9f7f5; color: #1bc5bd; }
        .status-rejected { background: #ffe2e5; color: #f64e60; }

        .btn { border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .btn-edit { background: #f0edff; color: var(--primary); }
        .btn-save { background: var(--primary); color: #fff; width: 100%; padding: 15px; }
        .btn-delete { background: #ffe2e5; color: var(--danger); }

        /* Modal Style */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .modal-content { background: #fff; margin: 5% auto; padding: 25px; width: 90%; max-width: 500px; border-radius: 30px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; background: #fcfcfc; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 24px; letter-spacing: 1px;">Admin Dashboard</h1>
    <p style="font-size: 12px; opacity: 0.8;">จัดการข้อมูลและตรวจสอบการลา</p>
</div>

<div class="container">
    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ค้นหาชื่อพนักงาน..." onkeyup="renderTable()">
    </div>

    <div class="card">
        <div class="section-title">👥 รายชื่อพนักงาน</div>
        <div id="staffList"></div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div class="section-title" style="margin:0;">📅 รายการแจ้งลา</div>
            <input type="date" id="filterDate" onchange="renderLeaveRequests()" style="width: auto; padding: 5px 10px; font-size: 12px; border-radius: 10px;">
        </div>
        <div id="leaveRequests"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
            <h3 style="margin:0; color: var(--primary);">⚙️ จัดการข้อมูลพนักงาน</h3>
            <span onclick="closeModal('editModal')" style="cursor:pointer; font-size: 20px;">&times;</span>
        </div>
        <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="editName"></div>
        <div class="form-group"><label>ตำแหน่ง</label><input type="text" id="editPos"></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>ป่วย</label><input type="number" id="q_sick"></div>
            <div class="form-group"><label>กิจ</label><input type="number" id="q_personal"></div>
            <div class="form-group"><label>พักร้อน</label><input type="number" id="q_vacation"></div>
        </div>
        <button class="btn btn-save" onclick="updateStaffInfo()">💾 บันทึกข้อมูล</button>
    </div>
</div>

<div id="leaveEditModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
            <h3 style="margin:0; color: var(--primary);">📝 แก้ไขรายการแจ้งลา</h3>
            <span onclick="closeModal('leaveEditModal')" style="cursor:pointer; font-size: 20px;">&times;</span>
        </div>
        <input type="hidden" id="editLeaveId">
        <div class="form-group">
            <label>ประเภทการลา</label>
            <select id="editLeaveType">
                <option value="ลาป่วย">ลาป่วย</option>
                <option value="ลากิจ">ลากิจ</option>
                <option value="ลาพักร้อน">ลาพักร้อน</option>
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>เริ่มวันที่</label><input type="date" id="editLeaveStart"></div>
            <div class="form-group"><label>ถึงวันที่</label><input type="date" id="editLeaveEnd"></div>
        </div>
        <div class="form-group"><label>จำนวนวัน</label><input type="number" id="editLeaveDays"></div>
        <div class="form-group">
            <label>สถานะ</label>
            <select id="editLeaveStatus">
                <option value="รอการอนุมัติ">รอการอนุมัติ</option>
                <option value="อนุมัติ">อนุมัติ</option>
                <option value="ไม่อนุมัติ">ไม่อนุมัติ</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-save" style="flex:2;" onclick="saveLeaveEdit()">💾 บันทึกการแก้ไข</button>
            <button class="btn btn-delete" style="flex:1;" onclick="deleteLeaveFromPopup()">🗑️ ลบ</button>
        </div>
    </div>
</div>

<script>
    let staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

    // ฟังก์ชันตั้งค่าวันที่ปัจจุบัน
    function setTodayFilter() {
        const now = new Date();
        const today = now.toLocaleDateString('en-CA'); // YYYY-MM-DD
        document.getElementById('filterDate').value = today;
    }

    function renderTable() {
        const list = document.getElementById("staffList");
        const search = document.getElementById("searchInput").value.toLowerCase();
        list.innerHTML = '';
        if(!staff.fullName) return;
        if(staff.fullName.toLowerCase().includes(search)) {
            list.innerHTML = `
                <div class="leave-item">
                    <div><strong>${staff.fullName}</strong><br><small>${staff.position}</small></div>
                    <button class="btn btn-edit" onclick="openEditModal()">⚙️ ตั้งค่า</button>
                </div>
            `;
        }
    }

    function renderLeaveRequests() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const filterDate = document.getElementById("filterDate").value; 
        const container = document.getElementById("leaveRequests");
        
        // กรองตามวันที่ทำรายการ (Transaction Date)
        const filtered = requests.filter(r => {
            // แปลงรูปแบบวันที่ในระบบ (dd/mm/yyyy หรือ Thai format) ให้ตรงกับ input date ถ้าจำเป็น
            // ในที่นี้สมมติระบบเก็บ r.date เป็น YYYY-MM-DD หรือทำการเปรียบเทียบเบื้องต้น
            return r.date === new Date(filterDate).toLocaleDateString('th-TH');
        });

        if(filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:#999; font-size:12px;">ไม่มีรายการของวันที่เลือก</div>`;
            return;
        }

        container.innerHTML = filtered.slice().reverse().map(req => `
            <div class="leave-item" style="flex-direction: column; align-items: flex-start;">
                <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:8px;">
                    <span class="badge ${req.status === 'รอการอนุมัติ' ? 'status-pending' : (req.status === 'อนุมัติ' ? 'status-approved' : 'status-rejected')}">${req.status}</span>
                    <small style="color:#999;">${req.date}</small>
                </div>
                <div style="font-weight:bold; color:var(--primary);">${req.name}</div>
                <div style="font-size:13px;">${req.type} (${req.days} วัน)</div>
                <div style="font-size:11px; color:#777; margin-bottom:10px;">${req.startDate} ถึง ${req.endDate}</div>
                <button class="btn btn-edit" style="width:100%;" onclick="openLeaveEditModal(${req.id})">🔍 จัดการรายการนี้</button>
            </div>
        `).join('');
    }

    // --- ฟังก์ชันจัดการ Leave Popup ---
    function openLeaveEditModal(id) {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const req = requests.find(r => r.id === id);
        if(req) {
            document.getElementById("editLeaveId").value = req.id;
            document.getElementById("editLeaveType").value = req.type;
            document.getElementById("editLeaveStart").value = req.startDate;
            document.getElementById("editLeaveEnd").value = req.endDate;
            document.getElementById("editLeaveDays").value = req.days;
            document.getElementById("editLeaveStatus").value = req.status;
            document.getElementById("leaveEditModal").style.display = "block";
        }
    }

    function saveLeaveEdit() {
        const id = parseInt(document.getElementById("editLeaveId").value);
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const idx = requests.findIndex(r => r.id === id);
        if(idx !== -1) {
            requests[idx].type = document.getElementById("editLeaveType").value;
            requests[idx].startDate = document.getElementById("editLeaveStart").value;
            requests[idx].endDate = document.getElementById("editLeaveEnd").value;
            requests[idx].days = document.getElementById("editLeaveDays").value;
            requests[idx].status = document.getElementById("editLeaveStatus").value;
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            alert("บันทึกการแก้ไขแล้ว");
            closeModal('leaveEditModal');
            renderLeaveRequests();
        }
    }

    function deleteLeaveFromPopup() {
        if(confirm("ยืนยันการลบรายการนี้?")) {
            const id = parseInt(document.getElementById("editLeaveId").value);
            let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
            requests = requests.filter(r => r.id !== id);
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            closeModal('leaveEditModal');
            renderLeaveRequests();
        }
    }

    // --- ฟังก์ชันเดิม ---
    function openEditModal() {
        document.getElementById("editName").value = staff.fullName || '';
        document.getElementById("editPos").value = staff.position || '';
        document.getElementById("q_sick").value = staff.q_sick || 30;
        document.getElementById("q_personal").value = staff.q_personal || 6;
        document.getElementById("q_vacation").value = staff.q_vacation || 10;
        document.getElementById("editModal").style.display = "block";
    }

    function updateStaffInfo() {
        staff.fullName = document.getElementById("editName").value;
        staff.position = document.getElementById("editPos").value;
        staff.q_sick = document.getElementById("q_sick").value;
        staff.q_personal = document.getElementById("q_personal").value;
        staff.q_vacation = document.getElementById("q_vacation").value;
        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("อัปเดตข้อมูลสำเร็จ");
        closeModal('editModal');
        renderTable();
    }

    function closeModal(mId) { document.getElementById(mId).style.display = "none"; }

    window.onload = () => {
        setTodayFilter();
        renderTable();
        renderLeaveRequests();
    };
</script>
</body>
</html>
