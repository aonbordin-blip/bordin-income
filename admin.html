<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    
    <style>
        /* --- CSS เดิมของคุณทั้งหมด 100% --- */
        :root {
            --primary: #6a5af9; --secondary: #00c6ff; --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.85); --success: #2ecc71;
            --warning: #ffa800; --danger: #ff7675; --shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #333; padding-bottom: 50px; }
        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; padding: 40px 20px 50px; text-align: center; border-radius: 0 0 40px 40px; box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2); }
        .container { max-width: 1000px; margin: -30px auto 0; padding: 0 15px; }
        .section-title { font-size: 20px; font-weight: bold; color: var(--primary); margin: 25px 0 15px; display: flex; align-items: center; gap: 10px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--glass); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, 0.4); transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .btn-action { border: none; padding: 8px 15px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; color: #fff; flex: 1; text-align: center; }
        .btn-edit { background: var(--primary); }
        .btn-approve { background: var(--success); }
        .btn-reject { background: var(--danger); }
        .btn-manage { background: #f39c12; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .modal-content { background: #fff; margin: 5% auto; padding: 25px; border-radius: 25px; width: 90%; max-width: 600px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); max-height: 85vh; overflow-y: auto; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary); font-size: 14px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; margin-bottom: 15px; }
        .stat-box { background: #fff; padding: 15px 10px; border-radius: 20px; text-align: center; border: 1px solid #f0f0f0; }
        .stat-label { font-size: 11px; font-weight: 800; margin-bottom: 8px; }
        .stat-used { font-size: 20px; font-weight: 800; }
        .stat-rem { font-size: 11px; padding: 4px; border-radius: 10px; font-weight: bold; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0; font-size: 26px;">ระบบจัดการผู้ดูแล (Admin)</h1>
        <p style="margin:5px 0 0; opacity: 0.9;">✓Record Income - จัดการข้อมูลบุคลากร</p>
    </div>

    <div class="container">
        <div style="background: var(--glass); padding: 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 15px;">
            <label style="font-weight:bold; color:var(--primary); font-size: 16px;">เลือกวันที่ดูรายการลา:</label>
            <input type="date" id="filterDate" onchange="renderDailyLeaves()" style="padding: 10px 15px; border-radius: 12px; border: 1px solid #ccc; font-family: inherit;">
            <button onclick="document.getElementById('filterDate').value = ''; renderDailyLeaves();" style="padding: 10px 20px; border-radius: 12px; border: none; background: #eee; cursor:pointer; font-weight: bold;">ดูทั้งหมด</button>
        </div>

        <div class="section-title">📅 รายการแจ้งลาหยุด</div>
        <div id="leaveDailySection" class="grid-container"></div>

        <div class="section-title">👥 ข้อมูลพนักงานทั้งหมด</div>
        <div style="margin-bottom: 20px;">
            <input type="text" id="searchStaffInput" placeholder="🔍 ค้นหาด้วย รหัสพนักงาน หรือ เลขบัตรประชาชน..." onkeyup="renderStaffSection()" 
                   style="width: 100%; padding: 12px 20px; border-radius: 15px; border: 1px solid #ddd; outline: none; box-shadow: var(--shadow); background: #fff;">
        </div>
        
        <div id="staffSection" class="grid-container"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('editModal')">&times;</span>
            <h2 style="color: var(--primary); text-align: center; margin-top:0;">จัดการข้อมูลพนักงาน</h2>
            <div class="input-group">
                <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 16px; color: #555;">👤 ข้อมูลทั่วไป</h3>
                <input type="hidden" id="editEmpKey"> <div style="display:flex; gap:10px;"><div style="flex:1;"><label>รหัสพนักงาน</label><input type="text" id="editEmpId"></div><div style="flex:2;"><label>ชื่อ-นามสกุล</label><input type="text" id="editName"></div></div>
                <label>เลขประจำตัวประชาชน</label><input type="text" id="editIdCard">
                <div style="display:flex; gap:10px;"><div style="flex:1;"><label>เบอร์โทรศัพท์</label><input type="tel" id="editPhone"></div><div style="flex:1;"><label>ตำแหน่ง</label><input type="text" id="editPos"></div></div>
                <label>แผนก</label><input type="text" id="editDept">
                
                <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 20px; font-size: 16px; color: #555;">📅 ตั้งค่าโควตาการลา (วัน/ปี)</h3>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                    <div style="background: #e8f4f8; padding: 12px; border-radius: 18px; text-align: center;"><label style="color: #2980b9; font-size: 12px; font-weight: bold;">🤒 ป่วย</label><input type="number" id="q_sick" style="width: 100%; border: none; background: transparent; text-align: center; font-size: 20px; font-weight: 800; color: #2980b9;"></div>
                    <div style="background: #fff3cd; padding: 12px; border-radius: 18px; text-align: center;"><label style="color: #856404; font-size: 12px; font-weight: bold;">💼 กิจ</label><input type="number" id="q_personal" style="width: 100%; border: none; background: transparent; text-align: center; font-size: 20px; font-weight: 800; color: #856404;"></div>
                    <div style="background: #d4edda; padding: 12px; border-radius: 18px; text-align: center;"><label style="color: #155724; font-size: 12px; font-weight: bold;">🏖️ พักร้อน</label><input type="number" id="q_vacation" style="width: 100%; border: none; background: transparent; text-align: center; font-size: 20px; font-weight: 800; color: #155724;"></div>
                </div>
            </div>
            <button onclick="updateStaffInfo()" style="width: 100%; padding: 15px; background: var(--success); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top:20px;">💾 บันทึกข้อมูลพนักงานลง Firebase</button>
            <button onclick="deleteEmployee()" style="width: 100%; padding: 15px; background: var(--danger); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top:10px;">🗑️ ลบข้อมูลพนักงาน</button>
        </div>
    </div>

    <div id="leaveEditModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('leaveEditModal')">&times;</span>
            <h2 style="color: var(--primary); text-align: center; margin-top:0;">จัดการรายการลา</h2>
            <div style="background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #eee;">
                <input type="hidden" id="editLeaveId">
                <div class="input-group">
                    <label>ประเภทการลา</label><input type="text" id="editLeaveType" readonly style="background:#e9ecef;">
                    <label>สาเหตุการลา</label><textarea id="editLeaveReason" rows="2" readonly style="background:#e9ecef; resize:none;"></textarea>
                    <label>ปรับสถานะการอนุมัติ</label>
                    <select id="editLeaveStatus" style="font-weight:bold;">
                        <option value="รอการอนุมัติ">⏳ รอการอนุมัติ</option>
                        <option value="อนุมัติ">✅ อนุมัติ</option>
                        <option value="ไม่อนุมัติ">❌ ไม่อนุมัติ</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="saveLeaveEdit()" class="btn-action btn-approve" style="padding:12px;">💾 บันทึกสถานะ</button>
                    <button onclick="deleteLeaveFromPopup()" class="btn-action btn-reject" style="padding:12px;">🗑️ ลบข้อมูล</button>
                </div>
            </div>
            <div id="modalLeaveHistory"></div>
        </div>
    </div>

<script>
// --- 1. Firebase Config (ตัวเดิมของคุณ) ---
const firebaseConfig = {
  apiKey: "AIzaSyDEzU0P1EWgJgABEw3sJL54N5dq4dlVHJQ",
  authDomain: "hr-system-f9acc.firebaseapp.com",
  databaseURL: "https://hr-system-f9acc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hr-system-f9acc",
  storageBucket: "hr-system-f9acc.firebasestorage.app",
  messagingSenderId: "793271973867",
  appId: "1:793271973867:web:38bd510257d9d2bf500bae"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ตัวแปรเก็บข้อมูลชั่วคราวเพื่อให้ฟังก์ชันเดิมทำงานได้
let allStaff = {};
let allLeaves = {};

function formatTimestamp(timestamp) {
    if(!timestamp) return '-';
    const d = new Date(parseInt(timestamp));
    return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// --- 2. ฟังก์ชัน Render (เปลี่ยนจาก localStorage เป็น Firebase) ---

function renderStaffSection() {
    db.ref('users').on('value', snap => {
        allStaff = snap.val() || {};
        const container = document.getElementById("staffSection");
        const searchTerm = document.getElementById("searchStaffInput").value.trim().toLowerCase();
        container.innerHTML = "";

        Object.keys(allStaff).forEach(key => {
            const staff = allStaff[key];
            const isMatch = !searchTerm || staff.employeeId.includes(searchTerm) || staff.idCard.includes(searchTerm) || staff.fullName.toLowerCase().includes(searchTerm);
            
            if (isMatch) {
                container.innerHTML += `
                <div class="card">
                    <div style="display:flex; align-items:center; gap: 15px; margin-bottom: 15px;">
                        <img src="${staff.photo || 'https://via.placeholder.com/60'}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid var(--primary);">
                        <div>
                            <div style="font-weight:bold; font-size:16px; color:var(--primary);">${staff.fullName || 'ไม่มีชื่อ'}</div>
                            <div style="font-size:13px; color:#666;">รหัส: ${staff.employeeId} | ${staff.department || '-'}</div>
                        </div>
                    </div>
                    <div style="font-size: 14px; margin-bottom: 5px;">📞 เบอร์โทร: <strong>${staff.phone || '-'}</strong></div>
                    <div style="font-size: 12px; background:#f0f2f5; padding:8px; border-radius:8px; margin-bottom:15px;">
                        <strong>โควตาคงเหลือ:</strong> ป่วย ${staff.q_sick||30} | กิจ ${staff.q_personal||6} | พักร้อน ${staff.q_vacation||10}
                    </div>
                    <button class="btn-action btn-edit" style="width:100%;" onclick="openEditModal('${key}')">✏️ จัดการข้อมูล & โควตา</button>
                </div>`;
            }
        });
    });
}

function renderDailyLeaves() {
    db.ref('leaves').on('value', snap => {
        allLeaves = snap.val() || {};
        const container = document.getElementById("leaveDailySection");
        const filterDate = document.getElementById("filterDate").value;
        container.innerHTML = "";

        Object.keys(allLeaves).reverse().forEach(key => {
            const req = allLeaves[key];
            let isDateMatch = true;
            if (filterDate) {
                const [y, m, d] = filterDate.split('-');
                const thaiDate = `${parseInt(d)}/${parseInt(m)}/${parseInt(y)+543}`;
                isDateMatch = (req.date === thaiDate);
            }

            if (isDateMatch) {
                let statusClass = req.status === 'อนุมัติ' ? 'status-approved' : (req.status === 'ไม่อนุมัติ' ? 'status-rejected' : 'status-pending');
                container.innerHTML += `
                <div class="card" style="border-left: 5px solid ${req.status === 'อนุมัติ' ? 'var(--success)' : (req.status==='ไม่อนุมัติ'?'var(--danger)':'var(--warning)')}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                        <div style="font-weight:bold; color:var(--primary);">${req.name}</div>
                        <span class="status-badge ${statusClass}">${req.status}</span>
                    </div>
                    <div style="font-size:14px; color:#555; margin-bottom:5px;">ประเภท: <strong>${req.type}</strong> (${req.days} วัน)</div>
                    <div style="font-size:12px; color:#777; margin-bottom:15px;">📅 ลาวันที่: ${req.startDate} ถึง ${req.endDate}</div>
                    <button class="btn-action btn-manage" style="width:100%;" onclick="openLeaveEditPopup('${key}', '${req.empId}')">⚙️ จัดการรายการนี้</button>
                </div>`;
            }
        });
    });
}

// --- 3. ฟังก์ชันจัดการข้อมูล (Save/Edit/Delete ลง Firebase) ---

function openEditModal(key) {
    const staff = allStaff[key];
    document.getElementById("editEmpKey").value = key;
    document.getElementById("editEmpId").value = staff.employeeId || '';
    document.getElementById("editName").value = staff.fullName || '';
    document.getElementById("editIdCard").value = staff.idCard || '';
    document.getElementById("editPhone").value = staff.phone || '';
    document.getElementById("editPos").value = staff.position || '';
    document.getElementById("editDept").value = staff.department || '';
    document.getElementById("q_sick").value = staff.q_sick || 30;
    document.getElementById("q_personal").value = staff.q_personal || 6;
    document.getElementById("q_vacation").value = staff.q_vacation || 10;
    document.getElementById("editModal").style.display = "block";
}

function updateStaffInfo() {
    const key = document.getElementById("editEmpKey").value;
    const updates = {
        employeeId: document.getElementById("editEmpId").value,
        fullName: document.getElementById("editName").value,
        idCard: document.getElementById("editIdCard").value,
        phone: document.getElementById("editPhone").value,
        position: document.getElementById("editPos").value,
        department: document.getElementById("editDept").value,
        q_sick: document.getElementById("q_sick").value,
        q_personal: document.getElementById("q_personal").value,
        q_vacation: document.getElementById("q_vacation").value
    };
    db.ref('users/' + updates.employeeId).update(updates).then(() => {
        alert("✅ อัปเดตข้อมูลพนักงานในระบบกลางเรียบร้อย");
        closeModal('editModal');
    });
}

function saveLeaveEdit() {
    const key = document.getElementById("editLeaveId").value;
    const newStatus = document.getElementById("editLeaveStatus").value;
    db.ref('leaves/' + key).update({ status: newStatus }).then(() => {
        alert("✅ บันทึกสถานะเรียบร้อยแล้ว");
        closeModal('leaveEditModal');
    });
}

function deleteEmployee() {
    const key = document.getElementById("editEmpKey").value;
    if (confirm("⚠️ ต้องการลบพนักงานคนนี้ออกจากระบบใช่หรือไม่?")) {
        db.ref('users/' + key).remove().then(() => {
            alert("ลบข้อมูลเรียบร้อย");
            closeModal('editModal');
        });
    }
}

function openLeaveEditPopup(key, empId) {
    const req = allLeaves[key];
    document.getElementById("editLeaveId").value = key;
    document.getElementById("editLeaveType").value = req.type;
    document.getElementById("editLeaveReason").value = req.reason || 'ไม่มีเหตุผล';
    document.getElementById("editLeaveStatus").value = req.status;
    document.getElementById("leaveEditModal").style.display = "block";
}

function closeModal(mId) { document.getElementById(mId).style.display = "none"; }
window.onload = () => { renderStaffSection(); renderDailyLeaves(); };
</script>
</body>
</html>
