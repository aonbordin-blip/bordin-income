<script>
const firebaseConfig = {
  apiKey: "AIzaSyDEzU0P1EWgJgABEw3sJL54N5dq4dlVHJQ",
  authDomain: "hr-system-f9acc.firebaseapp.com",
  databaseURL: "https://hr-system-f9acc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hr-system-f9acc",
  storageBucket: "hr-system-f9acc.firebasestorage.app",
  messagingSenderId: "793271973867",
  appId: "1:793271973867:web:38bd510257d9d2bf500bae"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allStaff = {};
let allLeaves = {};

function sendAdminLineNotification(leaveData, newStatus) {
    const gasAppUrl = "https://script.google.com/macros/s/AKfycby0kL00jnepsZfujU93PHLtAwU9_1vLr0PdLqUjU5dP81G-tSeetBA93iVtc4_xLkn6ag/exec"; 
    const slipId = leaveData.slipId || leaveData.id || Math.floor(Math.random() * 90000) + 10000;
    
    const payload = {
        action: "send_line_update",
        leaveData: {
            slipId: slipId,
            name: leaveData.name,
            empId: leaveData.empId,
            type: leaveData.type,
            days: leaveData.days,
            startDate: leaveData.startDate,
            endDate: leaveData.endDate,
            reason: leaveData.reason || "ไม่ได้ระบุสาเหตุ",
            team: leaveData.team || "ทั่วไป" 
        },
        newStatus: newStatus
    };

    fetch(gasAppUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
    }).then(() => console.log('ส่ง Line สำเร็จ')).catch(err => console.error('LINE Error:', err));
}

function saveLeaveEdit() {
    const key = document.getElementById("editLeaveId").value;
    const newStatus = document.getElementById("editLeaveStatus").value;
    const leaveData = allLeaves[key];

    const staffInfo = Object.values(allStaff).find(s => s.employeeId === leaveData.empId) || {};
    leaveData.team = leaveData.team || staffInfo.department || "ทั่วไป";

    db.ref('leaves/' + key).update({ status: newStatus }).then(() => {
        if(leaveData) {
            sendAdminLineNotification(leaveData, newStatus);
        }
        alert("✅ บันทึกสถานะและส่งแจ้งเตือนเข้า LINE เรียบร้อยแล้ว");
        closeModal('leaveEditModal');
    });
}

function formatTimestamp(timestamp) {
    if(!timestamp) return '-';
    const d = new Date(parseInt(timestamp));
    return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function calculateEmpStats(empId) {
    const staff = Object.values(allStaff).find(s => s.employeeId === empId) || {};
    const leaves = Object.values(allLeaves).filter(l => l.empId === empId);
    
    const sickUsed = leaves.filter(l => l.type === 'ลาป่วย' && l.status === 'อนุมัติ').reduce((sum, l) => sum + parseFloat(l.days||0), 0);
    const perUsed = leaves.filter(l => l.type === 'ลากิจ' && l.status === 'อนุมัติ').reduce((sum, l) => sum + parseFloat(l.days||0), 0);
    const vacUsed = leaves.filter(l => l.type === 'ลาพักร้อน' && l.status === 'อนุมัติ').reduce((sum, l) => sum + parseFloat(l.days||0), 0);
    
    return { 
        sickUsed, perUsed, vacUsed, 
        q_sick: staff.q_sick || 30, q_personal: staff.q_personal || 6, q_vacation: staff.q_vacation || 10,
        leaves: leaves.sort((a,b) => b.id - a.id)
    };
}

function renderStaffSection() {
    db.ref('users').on('value', snap => {
        allStaff = snap.val() || {};
        const container = document.getElementById("staffSection");
        const searchTerm = document.getElementById("searchStaffInput").value.trim().toLowerCase();
        container.innerHTML = "";

        Object.keys(allStaff).forEach(key => {
            const staff = allStaff[key];
            const isMatch = !searchTerm || staff.employeeId.includes(searchTerm) || (staff.idCard||'').includes(searchTerm) || (staff.fullName||'').toLowerCase().includes(searchTerm);
            
            if (isMatch) {
                container.innerHTML += `
                <div class="card">
                    <div style="display:flex; align-items:center; gap: 15px; margin-bottom: 15px;">
                        <img src="${staff.photo || 'https://via.placeholder.com/60'}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid var(--primary);">
                        <div>
                            <div style="font-weight:bold; font-size:16px; color:var(--primary);">${staff.fullName || 'ไม่มีชื่อ'}</div>
                            <div style="font-size:13px; color:#666;">รหัส: ${staff.employeeId} | ${staff.department || '-'}</div>
                        </div>
                    </div>
                    <div style="font-size: 14px; margin-bottom: 5px;">📞 เบอร์โทร: <strong>${staff.phone || '-'}</strong></div>
                    <div style="font-size: 12px; background:#f0f2f5; padding:8px; border-radius:8px; margin-bottom:15px;">
                        <strong>โควตาคงเหลือ:</strong> ป่วย ${staff.q_sick||30} | กิจ ${staff.q_personal||6} | พักร้อน ${staff.q_vacation||10}
                    </div>
                    <button class="btn-action btn-edit" style="width:100%;" onclick="openEditModal('${key}')">✏️ จัดการข้อมูล & โควตา</button>
                </div>`;
            }
        });
    });
}

function renderDailyLeaves() {
    db.ref('leaves').on('value', snap => {
        allLeaves = snap.val() || {};
        const container = document.getElementById("leaveDailySection");
        const filterDate = document.getElementById("filterDate").value; 
        container.innerHTML = "";
        let hasData = false;

        Object.keys(allLeaves).reverse().forEach(key => {
            const req = allLeaves[key];
            let isDateMatch = true;
            
            if (filterDate) {
                const ts = req.id ? parseInt(req.id) : parseInt(key);
                if (!isNaN(ts) && ts > 0) {
                    const d = new Date(ts);
                    const reqDateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                    isDateMatch = (reqDateStr === filterDate);
                } else {
                    isDateMatch = false;
                }
            }

            if (isDateMatch) {
                hasData = true;
                let statusClass = req.status === 'อนุมัติ' ? 'status-approved' : (req.status === 'ไม่อนุมัติ' ? 'status-rejected' : 'status-pending');
                container.innerHTML += `
                <div class="card" style="border-left: 5px solid ${req.status === 'อนุมัติ' ? 'var(--success)' : (req.status==='ไม่อนุมัติ'?'var(--danger)':'var(--warning)')}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                        <div style="font-weight:bold; color:var(--primary);">${req.name}</div>
                        <span class="status-badge ${statusClass}">${req.status}</span>
                    </div>
                    <div style="font-size:14px; color:#555; margin-bottom:5px;">ประเภท: <strong>${req.type}</strong> (${req.days} วัน)</div>
                    <div style="font-size:12px; color:#777; margin-bottom:5px;">📅 ลาวันที่: ${req.startDate} ถึง ${req.endDate}</div>
                    
                    <div style="font-size:11px; color:#aaa; margin-bottom:15px;">🕒 ทำรายการ: ${formatTimestamp(req.id || key)}</div>
                    
                    <button class="btn-action btn-manage" style="width:100%;" onclick="openLeaveEditPopup('${key}', '${req.empId}')">⚙️ จัดการรายการนี้</button>
                </div>`;
            }
        });

        if (!hasData) {
            container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #999; padding: 20px;">ไม่มีรายการทำเรื่องลาในวันที่เลือก</div>`;
        }
    });
}

function openEditModal(key) {
    const staff = allStaff[key];
    const stats = calculateEmpStats(staff.employeeId);
    
    document.getElementById("editEmpKey").value = key;
    document.getElementById("editEmpId").value = staff.employeeId || '';
    document.getElementById("editName").value = staff.fullName || '';
    document.getElementById("editIdCard").value = staff.idCard || '';
    document.getElementById("editPhone").value = staff.phone || '';
    document.getElementById("editPos").value = staff.position || '';
    document.getElementById("editDept").value = staff.department || '';
    document.getElementById("editStartDateWork").value = staff.startDateWork || '';
    document.getElementById("editAddrNo").value = staff.addr_no || '';
    document.getElementById("editAddrMoo").value = staff.addr_moo || '';
    document.getElementById("editAddrSub").value = staff.addr_subdistrict || '';
    document.getElementById("editAddrDist").value = staff.addr_district || '';
    document.getElementById("editAddrProv").value = staff.addr_province || '';
    document.getElementById("q_sick").value = staff.q_sick || 30;
    document.getElementById("q_personal").value = staff.q_personal || 6;
    document.getElementById("q_vacation").value = staff.q_vacation || 10;
    
    document.getElementById("empStatsGrid").innerHTML = `
        <div style="background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 12px; text-align: center;"><div style="color: #0284c7; font-size: 11px; font-weight: bold;">🤒 ลาป่วย</div><div style="font-size: 18px; font-weight: 800; color: #0284c7; margin: 5px 0;"><span style="font-size:24px;">${stats.sickUsed}</span><span style="font-size:12px; color:#aaa;"> / ใช้</span></div><div style="background: #e0f2fe; color: #0284c7; font-size: 10px; padding: 3px; border-radius: 20px; font-weight: bold;">เหลือ ${stats.q_sick - stats.sickUsed}</div></div>
        <div style="background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 12px; text-align: center;"><div style="color: #b45309; font-size: 11px; font-weight: bold;">💼 ลากิจ</div><div style="font-size: 18px; font-weight: 800; color: #b45309; margin: 5px 0;"><span style="font-size:24px;">${stats.perUsed}</span><span style="font-size:12px; color:#aaa;"> / ใช้</span></div><div style="background: #fef3c7; color: #b45309; font-size: 10px; padding: 3px; border-radius: 20px; font-weight: bold;">เหลือ ${stats.q_personal - stats.perUsed}</div></div>
        <div style="background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 12px; text-align: center;"><div style="color: #166534; font-size: 11px; font-weight: bold;">🏖️ พักร้อน</div><div style="font-size: 18px; font-weight: 800; color: #166534; margin: 5px 0;"><span style="font-size:24px;">${stats.vacUsed}</span><span style="font-size:12px; color:#aaa;"> / ใช้</span></div><div style="background: #dcfce3; color: #166534; font-size: 10px; padding: 3px; border-radius: 20px; font-weight: bold;">เหลือ ${stats.q_vacation - stats.vacUsed}</div></div>
    `;
    document.getElementById("editModal").style.display = "block";
}

function updateStaffInfo() {
    const key = document.getElementById("editEmpKey").value;
    const updates = {
        employeeId: document.getElementById("editEmpId").value,
        fullName: document.getElementById("editName").value,
        idCard: document.getElementById("editIdCard").value,
        phone: document.getElementById("editPhone").value,
        position: document.getElementById("editPos").value,
        department: document.getElementById("editDept").value,
        startDateWork: document.getElementById("editStartDateWork").value,
        addr_no: document.getElementById("editAddrNo").value,
        addr_moo: document.getElementById("editAddrMoo").value,
        addr_subdistrict: document.getElementById("editAddrSub").value,
        addr_district: document.getElementById("editAddrDist").value,
        addr_province: document.getElementById("editAddrProv").value,
        q_sick: document.getElementById("q_sick").value,
        q_personal: document.getElementById("q_personal").value,

function openLeaveEditPopup(key, empId) {
    const req = allLeaves[key];
    const stats = calculateEmpStats(empId);
    
    const staff = Object.values(allStaff).find(s => s.employeeId === empId) || {};
    document.getElementById("leaveEmpName").innerText = req.name || staff.fullName || "ไม่ระบุชื่อ";
    document.getElementById("leaveEmpId").innerText = empId || "-";
    document.getElementById("leaveEmpPos").innerText = staff.position || "-";
    document.getElementById("leaveEmpDept").innerText = staff.department || "-";
    document.getElementById("leaveEmpPic").src = staff.photo || "https://via.placeholder.com/60";

    document.getElementById("editLeaveId").value = key;
    document.getElementById("editLeaveEmpId").value = empId;
    document.getElementById("editLeaveType").value = req.type;
    document.getElementById("editLeaveReason").value = req.reason || 'ไม่มีเหตุผล';
    document.getElementById("editLeaveStatus").value = req.status;
    
    const statusSelect = document.getElementById("editLeaveStatus");
    if(req.status === 'อนุมัติ') statusSelect.style.color = '#155724';
    else if(req.status === 'ไม่อนุมัติ') statusSelect.style.color = '#721c24';
    else statusSelect.style.color = '#856404';

    statusSelect.onchange = function() {
        if(this.value === 'อนุมัติ') this.style.color = '#155724';
        else if(this.value === 'ไม่อนุมัติ') this.style.color = '#721c24';
        else statusSelect.style.color = '#856404';
    };

    document.getElementById("leaveModalStatsGrid").innerHTML = `
        <div class="stat-box" style="background:#f0f9ff; color:#0369a1;"><div style="font-size:11px; font-weight:bold;">ป่วย</div><div style="font-size:12px; font-weight:500;">ใช้ ${stats.sickUsed}/${stats.q_sick}</div></div>
        <div class="stat-box" style="background:#fffbeb; color:#92400e;"><div style="font-size:11px; font-weight:bold;">กิจ</div><div style="font-size:12px; font-weight:500;">ใช้ ${stats.perUsed}/${stats.q_personal}</div></div>
        <div class="stat-box" style="background:#f0fdf4; color:#166534;"><div style="font-size:11px; font-weight:bold;">พักร้อน</div><div style="font-size:12px; font-weight:500;">ใช้ ${stats.vacUsed}/${stats.q_vacation}</div></div>
    `;

    let historyHtml = '';
    stats.leaves.forEach(l => {
        const statusColor = l.status === 'อนุมัติ' ? 'color:#155724;' : (l.status === 'ไม่อนุมัติ' ? 'color:#721c24;' : 'color:#856404;');
        const typeColor = l.type === 'ลาป่วย' ? 'color:#0284c7;' : (l.type === 'ลากิจ' ? 'color:#b45309;' : 'color:#166534;');
        const transDate = formatTimestamp(l.id);
        
        historyHtml += `
            <div class="history-card">
                <div>
                    <div style="font-weight:bold; font-size:14px; ${typeColor}">${l.type} <span style="color:#555; font-weight:normal;">(${l.days} วัน)</span></div>
                    <div style="font-size:11px; color:#888; margin-top:2px;">📅 ${l.startDate} ถึง ${l.endDate}</div>
                    <div style="font-size:10px; color:#aaa; margin-top:3px;">🕒 ทำรายการ: ${transDate}</div>
                </div>
                <div style="font-weight:bold; font-size:12px; ${statusColor}">${l.status}</div>
            </div>
        `;
    });
    document.getElementById("modalLeaveHistoryList").innerHTML = historyHtml;
    document.getElementById("leaveEditModal").style.display = "block";
}

function deleteLeaveFromPopup() {
    const key = document.getElementById("editLeaveId").value;
    if (confirm("⚠️ ต้องการลบรายการลานี้ออกจากระบบใช่หรือไม่?")) {

            closeModal('leaveEditModal');
        });
    }
}

function deleteEmployee() {
    const key = document.getElementById("editEmpKey").value;
    if (confirm("⚠️ คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลพนักงานคนนี้ออกจากระบบ?")) {

            alert("ลบข้อมูลพนักงานเรียบร้อย");
            closeModal('editModal');
        });
    }
}

function closeModal(mId) { document.getElementById(mId).style.display = "none"; }

window.onload = () => { 
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('filterDate').value = `${yyyy}-${mm}-${dd}`;
    renderStaffSection(); 
    renderDailyLeaves(); 
};
