<script>
    // ตรวจสอบสิทธิ์ก่อนแสดงผลหน้าเว็บ
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9;
            --secondary: #00c6ff;
            --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.85);
            --success: #2ecc71;
            --warning: #ffa800;
            --danger: #ff7675;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: #333; 
            padding-bottom: 50px; 
        }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; 
            padding: 40px 20px 50px; 
            text-align: center;
            border-radius: 0 0 40px 40px; 
            box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2);
        }

        .container { max-width: 800px; margin: -30px auto 0; padding: 0 15px; }

        .section-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h2, h3, h4 { margin-top: 0; color: #2d3436; }

        /* Table Style */
        .staff-info-box {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; padding: 15px; border-radius: 15px;
            margin-bottom: 10px; border-left: 5px solid var(--primary);
        }

        /* Modal Style */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #fff; margin: 5% auto; padding: 30px;
            width: 90%; max-width: 550px; border-radius: 24px;
            max-height: 85vh; overflow-y: auto;
        }

        input, select, textarea {
            width: 100%; padding: 12px; margin: 8px 0;
            border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box;
            font-size: 14px;
        }

        .btn {
            padding: 12px 20px; border: none; border-radius: 12px;
            cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; width: 100%; margin-top: 10px; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Leave Item */
        .leave-item {
            background: #fff; padding: 15px; border-radius: 15px;
            margin-bottom: 10px; border-left: 5px solid var(--warning);
            cursor: pointer; transition: 0.2s;
        }
        .leave-item:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        .status-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="header">
    <h1>ระบบจัดการหลังบ้าน</h1>
    <p>Admin Dashboard | สำหรับฝ่ายบุคคล</p>
    <button class="btn btn-danger" onclick="sessionStorage.clear(); location.href='login.html';">ออกจากระบบ</button>
</div>

<div class="container">
    <div class="section-card">
        <h3>👥 ข้อมูลพนักงานในระบบ</h3>
        <div id="staffSection">
            </div>
    </div>

    <div class="section-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>📅 รายการลา (วันนี้)</h3>
            <input type="date" id="filterDate" onchange="renderDailyLeaves()" style="width: auto; margin:0;">
        </div>
        <div id="dailyLeaves">
            </div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>⚙️ จัดการข้อมูลพนักงาน</h3>
        
        <label>ชื่อ-นามสกุล</label>
        <input type="text" id="editName" placeholder="ชื่อ-นามสกุล">

        <div class="grid-2">
            <div>
                <label>ตำแหน่ง</label>
                <input type="text" id="editPos" placeholder="ตำแหน่ง">
            </div>
            <div>
                <label>แผนก</label>
                <input type="text" id="editDept" placeholder="แผนก">
            </div>
        </div>

        <div class="grid-2">
            <div>
                <label>เบอร์โทรศัพท์</label>
                <input type="text" id="editPhone" placeholder="เบอร์โทรศัพท์">
            </div>
            <div>
                <label>รหัสพนักงาน</label>
                <input type="text" id="editEmpId" placeholder="รหัสพนักงาน">
            </div>
        </div>

        <hr>
        <h4>🏠 ข้อมูลที่อยู่</h4>
        <div class="grid-2">
            <input type="text" id="editAddrNo" placeholder="บ้านเลขที่">
            <input type="text" id="editAddrMoo" placeholder="หมู่ที่">
        </div>
        <div class="grid-2">
            <input type="text" id="editAddrSub" placeholder="ตำบล">
            <input type="text" id="editAddrDist" placeholder="อำเภอ">
        </div>
        <div class="grid-2">
            <input type="text" id="editAddrProv" placeholder="จังหวัด">
            <input type="text" id="editAddrZip" placeholder="รหัสไปรษณีย์">
        </div>

        <hr>
        <h4>📊 โควตาการลา (วัน)</h4>
        <div style="display: flex; gap: 10px; justify-content: space-around;">
            <div style="text-align: center;">ลาป่วย<br><input type="number" id="q_sick" style="width:60px;"></div>
            <div style="text-align: center;">ลากิจ<br><input type="number" id="q_personal" style="width:60px;"></div>
            <div style="text-align: center;">พักร้อน<br><input type="number" id="q_vacation" style="width:60px;"></div>
        </div>

        <button class="btn btn-success" onclick="updateStaffInfo()">💾 บันทึกข้อมูลทั้งหมด</button>
        <button class="btn btn-danger" style="width: 100%; margin-top: 5px;" onclick="closeModal('editModal')">ยกเลิก</button>
    </div>
</div>

<div id="leaveEditModal" class="modal">
    <div class="modal-content">
        <h3>📝 จัดการรายการลา</h3>
        <input type="hidden" id="editLeaveId">
        <p id="leaveDetailsText" style="background: #f8f9fa; padding: 15px; border-radius: 10px; font-size: 14px; line-height: 1.6;"></p>
        
        <label>สถานะการอนุมัติ</label>
        <select id="leaveStatus">
            <option value="รอการอนุมัติ">รอการอนุมัติ</option>
            <option value="อนุมัติ">อนุมัติ</option>
            <option value="ไม่อนุมัติ">ไม่อนุมัติ</option>
        </select>

        <button class="btn btn-success" onclick="saveLeaveStatus()">บันทึกสถานะ</button>
        <button class="btn btn-warning" style="width:100%; margin-top: 5px;" onclick="deleteLeaveFromPopup()">ลบรายการนี้</button>
        <button class="btn btn-danger" style="width:100%; margin-top: 5px;" onclick="closeModal('leaveEditModal')">ปิด</button>
    </div>
</div>

<script>
    // --- ฟังก์ชันแสดงรายชื่อพนักงาน ---
    function renderStaffSection() {
        const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};
        const container = document.getElementById("staffSection");
        
        if (staff.fullName) {
            container.innerHTML = `
                <div class="staff-info-box">
                    <div>
                        <strong>${staff.fullName}</strong><br>
                        <small style="color:#888;">ID: ${staff.employeeId || '-'} | ${staff.position || 'ระบุตำแหน่ง'}</small>
                    </div>
                    <button class="btn btn-primary" onclick="openEditModal()">จัดการข้อมูล</button>
                </div>
            `;
        } else {
            container.innerHTML = "<p style='text-align:center; color:#999;'>ยังไม่มีข้อมูลพนักงานในระบบ</p>";
        }
    }

    // --- ฟังก์ชันแสดงรายการลาประจำวัน ---
    function renderDailyLeaves() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const filterDate = document.getElementById('filterDate').value; 
        const container = document.getElementById("dailyLeaves");
        
        // กรองตามวันที่ที่เลือก (เทียบกับ startDate)
        const daily = requests.filter(r => r.startDate === filterDate);

        if (daily.length > 0) {
            container.innerHTML = daily.map(r => `
                <div class="leave-item" onclick="openLeaveEditModal(${r.id})">
                    <div style="display:flex; justify-content:space-between;">
                        <strong>${r.name}</strong>
                        <span class="status-badge ${getStatusClass(r.status)}">${r.status}</span>
                    </div>
                    <div style="font-size:12px; color:#666; margin-top:5px;">
                        ${r.type} (${r.days} วัน) | เหตุผล: ${r.reason || '-'}
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = "<p style='text-align:center; color:#999; padding:20px;'>ไม่มีรายการลาในวันนี้</p>";
        }
    }

    function getStatusClass(status) {
        if(status === 'อนุมัติ') return 'status-approved';
        if(status === 'ไม่อนุมัติ') return 'status-rejected';
        return 'status-pending';
    }

    // --- ระบบจัดการพนักงาน (แก้ไขล่าสุด) ---
    function openEditModal() {
        const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};
        
        // ข้อมูลส่วนตัว
        document.getElementById("editName").value = staff.fullName || '';
        document.getElementById("editPos").value = staff.position || '';
        document.getElementById("editDept").value = staff.department || '';
        document.getElementById("editPhone").value = staff.phone || '';
        document.getElementById("editEmpId").value = staff.employeeId || '';

        // ข้อมูลที่อยู่
        document.getElementById("editAddrNo").value = staff.addr_no || '';
        document.getElementById("editAddrMoo").value = staff.addr_moo || '';
        document.getElementById("editAddrSub").value = staff.addr_subdistrict || '';
        document.getElementById("editAddrDist").value = staff.addr_district || '';
        document.getElementById("editAddrProv").value = staff.addr_province || '';
        document.getElementById("editAddrZip").value = staff.addr_zipcode || '';

        // โควตาการลา
        document.getElementById("q_sick").value = staff.q_sick || 30;
        document.getElementById("q_personal").value = staff.q_personal || 6;
        document.getElementById("q_vacation").value = staff.q_vacation || 10;

        document.getElementById("editModal").style.display = "block";
    }

    function updateStaffInfo() {
        const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

        // เก็บค่าจาก Input ลงใน Object
        staff.fullName = document.getElementById("editName").value;
        staff.position = document.getElementById("editPos").value;
        staff.department = document.getElementById("editDept").value;
        staff.phone = document.getElementById("editPhone").value;
        staff.employeeId = document.getElementById("editEmpId").value;

        staff.addr_no = document.getElementById("editAddrNo").value;
        staff.addr_moo = document.getElementById("editAddrMoo").value;
        staff.addr_subdistrict = document.getElementById("editAddrSub").value;
        staff.addr_district = document.getElementById("editAddrDist").value;
        staff.addr_province = document.getElementById("editAddrProv").value;
        staff.addr_zipcode = document.getElementById("editAddrZip").value;

        staff.q_sick = document.getElementById("q_sick").value;
        staff.q_personal = document.getElementById("q_personal").value;
        staff.q_vacation = document.getElementById("q_vacation").value;

        // บันทึกลง localStorage
        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("✅ อัปเดตข้อมูลพนักงานและที่อยู่เรียบร้อยแล้ว");
        closeModal('editModal');
        renderStaffSection();
    }

    // --- ระบบจัดการรายการลา ---
    function openLeaveEditModal(id) {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const req = requests.find(r => r.id === id);
        if(!req) return;

        document.getElementById("editLeaveId").value = id;
        document.getElementById("leaveStatus").value = req.status;
        document.getElementById("leaveDetailsText").innerHTML = `
            <strong>ผู้ลา:</strong> ${req.name}<br>
            <strong>ประเภท:</strong> ${req.type}<br>
            <strong>วันที่:</strong> ${req.startDate} ถึง ${req.endDate}<br>
            <strong>จำนวน:</strong> ${req.days} วัน<br>
            <strong>เหตุผล:</strong> ${req.reason}
        `;
        document.getElementById("leaveEditModal").style.display = "block";
    }

    function saveLeaveStatus() {
        const id = parseInt(document.getElementById("editLeaveId").value);
        const status = document.getElementById("leaveStatus").value;
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        
        requests = requests.map(r => r.id === id ? {...r, status: status} : r);
        localStorage.setItem("leave_requests", JSON.stringify(requests));
        
        alert("✅ บันทึกสถานะเรียบร้อย");
        closeModal('leaveEditModal');
        renderDailyLeaves();
    }

    function deleteLeaveFromPopup() {
        if(confirm("⚠️ ยืนยันการลบรายการลานี้ออกจากระบบ?")) {
            const id = parseInt(document.getElementById("editLeaveId").value);
            let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
            requests = requests.filter(r => r.id !== id);
            
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            closeModal('leaveEditModal');
            renderDailyLeaves();
        }
    }

    function closeModal(mId) { document.getElementById(mId).style.display = "none"; }

    // ปิด Popup เมื่อคลิกพื้นที่ว่าง
    window.onclick = function(event) {
        if (event.target == document.getElementById("editModal")) closeModal('editModal');
        if (event.target == document.getElementById("leaveEditModal")) closeModal('leaveEditModal');
    }

    // ทำงานเมื่อโหลดหน้าเว็บ
    window.onload = () => {
        // ตั้งค่าตัวกรองเป็นวันปัจจุบัน (รูปแบบ YYYY-MM-DD สำหรับ Input Date)
        document.getElementById('filterDate').value = new Date().toLocaleDateString('en-CA'); 
        
        renderStaffSection();
        renderDailyLeaves();
    };
</script>
</body>
</html>
