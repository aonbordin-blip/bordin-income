<script>
    // ตรวจสอบสิทธิ์ก่อนแสดงผลหน้าเว็บ
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9; --secondary: #00c6ff; --bg: #F8F9FD;
            --success: #2ecc71; --danger: #ff7675; --warning: #f1c40f;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; padding: 40px 20px 60px; text-align: center;
            border-radius: 0 0 40px 40px;
        }

        .container { max-width: 1000px; margin: -40px auto 0; padding: 0 15px; }
        
        .section-card {
            background: #fff; border-radius: 25px; padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px;
        }

        /* Search Input */
        .search-box {
            width: 100%; padding: 14px 20px; border-radius: 15px; border: 1px solid #ddd;
            box-sizing: border-box; font-size: 14px; margin-bottom: 20px; outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }
        .search-box:focus { border-color: var(--primary); }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f0edff; color: var(--primary); padding: 12px; text-align: left; }
        td { padding: 15px 12px; border-bottom: 1px solid #f1f1f1; }
        
        .leave-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .leave-card { background: #fff; border-radius: 20px; padding: 20px; border: 1px solid #eee; position: relative; }
        
        .badge { padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #fff4de; color: #ffa800; }
        .badge-approved { background: #c9f7f5; color: #1bc5bd; }
        .badge-rejected { background: #ffe2e5; color: #f64e60; }

        .btn { border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-edit { background: #f0edff; color: var(--primary); }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-reject { background: #ffe2e5; color: var(--danger); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .modal-content { background: #fff; margin: 5% auto; padding: 30px; width: 90%; max-width: 650px; border-radius: 30px; max-height: 85vh; overflow-y: auto; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #888; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; background: #fafafa; }
        
        .stats-box { background: #f9f9f9; border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px dashed #ccc; }
        .stats-list { max-height: 150px; overflow-y: auto; font-size: 12px; }
        .stats-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin: 0; font-size: 26px;">Admin Management</h1>
</div>

<div class="container">
    <div class="section-card">
        <div style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px;">👥 จัดการข้อมูลพนักงาน</div>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ค้นหาชื่อพนักงาน หรือตำแหน่ง..." onkeyup="renderTable()">
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>พนักงาน</th><th>ตำแหน่ง/แผนก</th><th>ติดต่อ</th><th>จัดการ</th></tr>
                </thead>
                <tbody id="staffTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="section-card">
        <div style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px;">📅 รายการแจ้งลาหยุด</div>
        <div id="leaveRequestGrid" class="leave-grid"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0; color: var(--primary);">แก้ไขข้อมูลและประวัติการลา</h2>
            <span onclick="closeModal()" style="cursor:pointer; font-size: 24px; color: #ccc;">&times;</span>
        </div>
        
        <div class="stats-box">
            <h4 style="margin: 0 0 10px 0; color: var(--primary);">📈 สถิติ/ประวัติการลาที่ผ่านมา</h4>
            <div id="employeeStats" class="stats-list"></div>
        </div>

        <div class="form-grid">
            <div class="form-group"><label>รหัสพนักงาน</label><input type="text" id="editEmpId"></div>
            <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="editName"></div>
            <div class="form-group"><label>ตำแหน่ง</label><input type="text" id="editPos"></div>
            <div class="form-group"><label>แผนก</label><input type="text" id="editDept"></div>
            <div class="form-group"><label>เบอร์โทรศัพท์</label><input type="text" id="editPhone"></div>
        </div>

        <h4 style="color: var(--primary); margin: 20px 0 10px 0; border-top: 1px solid #eee; padding-top: 15px;">📍 ข้อมูลที่อยู่ (แยกชัดเจน)</h4>
        <div class="form-grid">
            <div class="form-group"><label>บ้านเลขที่/หมู่</label><input type="text" id="editAddrNo"></div>
            <div class="form-group"><label>ตำบล</label><input type="text" id="editAddrSub"></div>
            <div class="form-group"><label>อำเภอ</label><input type="text" id="editAddrDist"></div>
            <div class="form-group"><label>จังหวัด</label><input type="text" id="editAddrProv"></div>
        </div>

        <h4 style="color: var(--primary); margin: 20px 0 10px 0; border-top: 1px solid #eee; padding-top: 15px;">📊 จัดการโควตาการลา (วันคงเหลือ)</h4>
        <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="form-group"><label>ป่วย</label><input type="number" id="q_sick"></div>
            <div class="form-group"><label>กิจ</label><input type="number" id="q_personal"></div>
            <div class="form-group"><label>พักร้อน</label><input type="number" id="q_vacation"></div>
        </div>

        <button class="btn" style="background: var(--primary); color: #fff; width: 100%; padding: 15px; margin-top: 10px;" onclick="updateStaffInfo()">💾 บันทึกการเปลี่ยนแปลง</button>
    </div>
</div>

<script>
    let staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

    function renderTable() {
        const tableBody = document.getElementById("staffTableBody");
        const searchText = document.getElementById("searchInput").value.toLowerCase();
        
        tableBody.innerHTML = '';
        if(!staff.fullName) {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:#999;">ยังไม่มีข้อมูลพนักงาน</td></tr>`;
            return;
        }

        // ระบบค้นหา
        const matchName = staff.fullName.toLowerCase().includes(searchText);
        const matchPos = (staff.position || '').toLowerCase().includes(searchText);
        
        if(matchName || matchPos) {
            tableBody.innerHTML = `
                <tr>
                    <td>
                        <div style="font-weight:bold;">${staff.fullName}</div>
                        <div style="font-size:11px; color:#888;">ID: ${staff.employeeId || '-'}</div>
                    </td>
                    <td>
                        <div>${staff.position || '-'}</div>
                        <div style="font-size:11px; color:var(--primary);">${staff.department || '-'}</div>
                    </td>
                    <td>${staff.phone || '-'}</td>
                    <td><button class="btn btn-edit" onclick="openEditModal()">⚙️ จัดการ/สถิติ</button></td>
                </tr>
            `;
        } else {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:#999;">ไม่พบพนักงานที่ค้นหา</td></tr>`;
        }
    }

    function renderLeaveRequests() {
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const grid = document.getElementById("leaveRequestGrid");
        
        if(requests.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#999;">ไม่มีรายการลาที่รอการอนุมัติ</div>`;
            return;
        }

        grid.innerHTML = requests.map((req, index) => `
            <div class="leave-card">
                <span class="badge ${req.status === 'รอการอนุมัติ' ? 'badge-pending' : (req.status === 'อนุมัติ' ? 'badge-approved' : 'badge-rejected')}">
                    ${req.status}
                </span>
                <div style="font-weight:800; font-size:16px; margin-top:10px; color:var(--primary);">${req.name}</div>
                <div style="font-size:13px; margin: 8px 0;">ประเภท: <strong>${req.type}</strong> (${req.days || '-'} วัน)</div>
                <div style="font-size:12px; color:#555;">📅 ${req.startDate || '-'} ถึง ${req.endDate || '-'}</div>
                <div style="font-size:12px; color:#444; margin-top:8px; background:#f9f9f9; padding:8px; border-radius:8px;">
                    <strong>สาเหตุ:</strong> ${req.reason || 'ไม่ระบุ'}
                </div>
                
                ${req.status === 'รอการอนุมัติ' ? `
                    <div style="display:flex; gap:10px; margin-top:15px; border-top:1px solid #f5f5f5; padding-top:15px;">
                        <button class="btn btn-approve" style="flex:1;" onclick="handleLeave(${index}, 'อนุมัติ')">✔️ อนุมัติ</button>
                        <button class="btn btn-reject" style="flex:1;" onclick="handleLeave(${index}, 'ไม่อนุมัติ')">❌ ปฏิเสธ</button>
                    </div>
                ` : ''}
            </div>
        `).reverse().join(''); // reverse เพื่อให้อันใหม่ขึ้นก่อน
    }

    function handleLeave(index, status) {
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        // เนื่องจากเราแสดงผลแบบ reverse() ลำดับ index ใน requests ต้องคำนวณใหม่
        const realIndex = requests.length - 1 - index; 
        requests[realIndex].status = status;
        localStorage.setItem("leave_requests", JSON.stringify(requests));
        renderLeaveRequests();
    }

    function openEditModal() {
        document.getElementById("editModal").style.display = "block";
        document.getElementById("editEmpId").value = staff.employeeId || '';
        document.getElementById("editName").value = staff.fullName || '';
        document.getElementById("editPos").value = staff.position || '';
        document.getElementById("editDept").value = staff.department || '';
        document.getElementById("editPhone").value = staff.phone || '';
        
        // แยกฟิลด์ที่อยู่
        document.getElementById("editAddrNo").value = staff.addr_no || '';
        document.getElementById("editAddrSub").value = staff.addr_subdistrict || '';
        document.getElementById("editAddrDist").value = staff.addr_district || '';
        document.getElementById("editAddrProv").value = staff.addr_province || '';
        
        document.getElementById("q_sick").value = staff.q_sick || 30;
        document.getElementById("q_personal").value = staff.q_personal || 6;
        document.getElementById("q_vacation").value = staff.q_vacation || 10;

        // ดึงสถิติการลา
        const allLeaves = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const empLeaves = allLeaves.filter(l => l.empId === staff.employeeId);
        const statsDiv = document.getElementById("employeeStats");
        
        if(empLeaves.length > 0) {
            statsDiv.innerHTML = empLeaves.map(l => `
                <div class="stats-item">
                    <span>${l.type} (${l.days} วัน) - ${l.status}</span>
                    <span style="color:#888;">${l.startDate}</span>
                </div>
            `).join('');
        } else {
            statsDiv.innerHTML = `<div style="text-align:center; color:#999; padding:10px;">ไม่พบประวัติการลา</div>`;
        }
    }

    function closeModal() { document.getElementById("editModal").style.display = "none"; }

    function updateStaffInfo() {
        staff.employeeId = document.getElementById("editEmpId").value;
        staff.fullName = document.getElementById("editName").value;
        staff.position = document.getElementById("editPos").value;
        staff.department = document.getElementById("editDept").value;
        staff.phone = document.getElementById("editPhone").value;
        
        // บันทึกฟิลด์ที่อยู่ที่แยกไว้
        staff.addr_no = document.getElementById("editAddrNo").value;
        staff.addr_subdistrict = document.getElementById("editAddrSub").value;
        staff.addr_district = document.getElementById("editAddrDist").value;
        staff.addr_province = document.getElementById("editAddrProv").value;
        
        staff.q_sick = document.getElementById("q_sick").value;
        staff.q_personal = document.getElementById("q_personal").value;
        staff.q_vacation = document.getElementById("q_vacation").value;

        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("✅ อัปเดตข้อมูลและโควตาเรียบร้อยแล้ว");
        closeModal();
        renderTable();
    }

    window.onload = () => { renderTable(); renderLeaveRequests(); };
</script>
</body>
</html>
