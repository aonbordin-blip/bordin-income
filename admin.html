<script>
    // ตรวจสอบสิทธิ์ก่อนแสดงผลหน้าเว็บ
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9;
            --secondary: #00c6ff;
            --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.85);
            --success: #2ecc71;
            --danger: #ff7675;
            --warning: #f1c40f;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; padding: 40px 20px; text-align: center;
            border-radius: 0 0 35px 35px; box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2);
        }

        .search-container {
            margin: -25px 15px 15px; padding: 20px;
            background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #fff;
        }

        input[type="text"], input[type="number"] {
            width: 100%; padding: 12px; border-radius: 12px;
            border: 1px solid rgba(106, 90, 249, 0.1); box-sizing: border-box;
            margin-top: 5px; outline: none; font-size: 14px; background: #fcfcfc;
        }

        .card { background: #fff; margin: 15px; padding: 15px; border-radius: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.03); }
        
        .section-title { font-size: 16px; font-weight: bold; color: var(--primary); margin: 10px 0 15px 5px; display: flex; align-items: center; gap: 8px; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 8px; color: #aaa; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #f9f9f9; }
        td { padding: 15px 8px; border-bottom: 1px solid #f1f1f1; vertical-align: middle; }

        .emp-name { font-weight: bold; color: var(--primary); font-size: 14px; }
        .dept-badge { background: #f0edff; color: var(--primary); padding: 5px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        /* Modal Style */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
        }
        .modal-content {
            background: #fff; margin: 5% auto; padding: 25px;
            width: 90%; max-width: 500px; border-radius: 35px;
            max-height: 85vh; overflow-y: auto; position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
        }
        .close-btn { position: absolute; right: 25px; top: 20px; font-size: 24px; cursor: pointer; color: #ccc; }

        .profile-img-view {
            width: 100px; height: 100px; border-radius: 50%;
            object-fit: cover; display: block; margin: 0 auto 15px;
            border: 4px solid #fff; box-shadow: 0 8px 20px rgba(106, 90, 249, 0.15);
        }

        .info-edit-group { margin-bottom: 15px; }
        .info-edit-group label { display: block; font-size: 11px; color: #999; font-weight: bold; margin-bottom: 4px; padding-left: 5px; }
        .address-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Status & Buttons */
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .pending { background: #fff4de; color: #ffa800; }
        .approved { background: #c9f7f5; color: #1bc5bd; }
        .rejected { background: #ffe2e5; color: #f64e60; }

        .btn-action { border: none; padding: 8px 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-reject { background: var(--danger); color: #fff; margin-left: 5px; }
        .btn-unlock { background: var(--warning); color: #fff; width: 100%; margin-bottom: 10px; padding: 12px; border-radius: 15px; }
        .save-all-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; width: 100%; padding: 15px; border-radius: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(106, 90, 249, 0.2); }

    </style>
</head>
<body>

<div class="header">
    <h1 style="font-size: 26px; margin: 0; letter-spacing: 1px;">Admin Dashboard</h1>
    <p style="font-size: 12px; margin-top: 5px; opacity: 0.8;">ระบบจัดการพนักงานและอนุมัติการลา</p>
</div>

<div class="search-container">
    <label style="font-size: 11px; font-weight: bold; color: var(--primary);">🔎 ค้นหารายชื่อพนักงาน</label>
    <input type="text" id="mainSearch" placeholder="ระบุชื่อ, รหัส หรือเลขบัตร..." onkeyup="renderTable()">
</div>

<div class="card">
    <div class="section-title">👥 รายชื่อพนักงานในระบบ</div>
    <table>
        <thead>
            <tr>
                <th style="width: 65%;">ชื่อพนักงาน / รหัส</th>
                <th style="width: 35%;">แผนก</th>
            </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
    </table>
</div>

<div class="card">
    <div class="section-title">🛎️ รายการรออนุมัติการลา</div>
    <div id="leaveRequestList">
        </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 style="text-align: center; color: var(--primary); margin: 0 0 20px 0; font-size: 20px;">จัดการข้อมูลพนักงาน</h3>
        
        <img id="viewPhoto" src="" class="profile-img-view">
        
        <div id="lockStatusArea"></div> <div style="background: #f8f9ff; padding: 15px; border-radius: 20px; margin-bottom: 20px; border: 1px dashed var(--primary);">
            <div class="section-title" style="margin: 0 0 10px 0; font-size: 14px;">📊 สิทธิการลา (วัน)</div>
            <div class="address-grid">
                <div class="info-edit-group"><label>พักร้อนทั้งหมด</label><input type="number" id="editVacTotal"></div>
                <div class="info-edit-group"><label>พักร้อนคงเหลือ</label><input type="number" id="editVacRemain"></div>
            </div>
            <div class="address-grid">
                <div class="info-edit-group"><label>ลาป่วยที่ใช้</label><input type="number" id="editSickUsed"></div>
                <div class="info-edit-group"><label>ลากิจที่ใช้</label><input type="number" id="editPersonalUsed"></div>
            </div>
        </div>

        <div class="info-edit-group"><label>รหัสพนักงาน</label><input type="text" id="editEmpId"></div>
        <div class="info-edit-group"><label>ชื่อ-นามสกุล</label><input type="text" id="editName"></div>
        
        <div class="address-grid">
            <div class="info-edit-group"><label>ตำแหน่ง</label><input type="text" id="editPos"></div>
            <div class="info-edit-group"><label>แผนก</label><input type="text" id="editDept"></div>
        </div>

        <h4 style="border-bottom: 2px solid #f9f9f9; padding-bottom: 5px; color: var(--primary); font-size: 14px; margin: 15px 0 10px 0;">📍 ข้อมูลที่อยู่</h4>
        <div class="address-grid">
            <div class="info-edit-group"><label>บ้านเลขที่</label><input type="text" id="editAddrNo"></div>
            <div class="info-edit-group"><label>หมู่ที่</label><input type="text" id="editAddrMoo"></div>
        </div>
        <div class="address-grid">
            <div class="info-edit-group"><label>ตำบล</label><input type="text" id="editAddrSub"></div>
            <div class="info-edit-group"><label>อำเภอ</label><input type="text" id="editAddrDist"></div>
        </div>
        <div class="address-grid">
            <div class="info-edit-group"><label>จังหวัด</label><input type="text" id="editAddrProv"></div>
            <div class="info-edit-group"><label>รหัสไปรษณีย์</label><input type="text" id="editAddrZip"></div>
        </div>

        <button class="save-all-btn" onclick="updateStaffInfo()">💾 บันทึกข้อมูลทั้งหมด</button>
    </div>
</div>

<script>
    let staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

    function renderTable() {
        const tbody = document.getElementById("adminTableBody");
        const search = document.getElementById("mainSearch").value.toLowerCase();
        tbody.innerHTML = "";

        const matches = 
            (staff.fullName && staff.fullName.toLowerCase().includes(search)) ||
            (staff.employeeId && staff.employeeId.toLowerCase().includes(search));

        if (staff.fullName && matches) {
            tbody.innerHTML = `<tr class="emp-row" style="cursor:pointer" onclick="openModal()">
                <td>
                    <div class="emp-name">${staff.fullName}</div>
                    <div style="font-size:11px; color:#999">ID: ${staff.employeeId || '-'}</div>
                </td>
                <td><span class="dept-badge">${staff.department || 'ทั่วไป'}</span></td>
            </tr>`;
        } else {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding:30px; color:#ccc;">ไม่พบข้อมูล</td></tr>`;
        }
    }

    function openModal() {
        document.getElementById("editModal").style.display = "block";
        document.getElementById("viewPhoto").src = staff.photo || 'https://via.placeholder.com/100';
        
        // ข้อมูลสิทธิการลา
        document.getElementById("editVacTotal").value = staff.vacTotal || 6;
        document.getElementById("editVacRemain").value = staff.vacRemain || 6;
        document.getElementById("editSickUsed").value = staff.sickUsed || 0;
        document.getElementById("editPersonalUsed").value = staff.personalUsed || 0;

        // ข้อมูลทั่วไป
        document.getElementById("editEmpId").value = staff.employeeId || '';
        document.getElementById("editName").value = staff.fullName || '';
        document.getElementById("editPos").value = staff.position || '';
        document.getElementById("editDept").value = staff.department || '';
        document.getElementById("editAddrNo").value = staff.addr_no || '';
        document.getElementById("editAddrMoo").value = staff.addr_moo || '';
        document.getElementById("editAddrSub").value = staff.addr_subdistrict || '';
        document.getElementById("editAddrDist").value = staff.addr_district || '';
        document.getElementById("editAddrProv").value = staff.addr_province || '';
        document.getElementById("editAddrZip").value = staff.addr_zipcode || '';

        // ปุ่มปลดล็อค
        const lockArea = document.getElementById("lockStatusArea");
        if(staff.isLocked) {
            lockArea.innerHTML = `<button class="btn-unlock" onclick="unlockProfile()">🔓 ปลดล็อคให้พนักงานแก้ไขข้อมูลได้</button>`;
        } else {
            lockArea.innerHTML = `<p style="text-align:center; color:var(--success); font-size:12px; font-weight:bold;">🟢 สถานะ: พนักงานสามารถแก้ไขข้อมูลได้</p>`;
        }
    }

    function unlockProfile() {
        staff.isLocked = false;
        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("ปลดล็อคเรียบร้อยแล้ว");
        openModal();
    }

    function updateStaffInfo() {
        staff.vacTotal = document.getElementById("editVacTotal").value;
        staff.vacRemain = document.getElementById("editVacRemain").value;
        staff.sickUsed = document.getElementById("editSickUsed").value;
        staff.personalUsed = document.getElementById("editPersonalUsed").value;
        
        staff.employeeId = document.getElementById("editEmpId").value;
        staff.fullName = document.getElementById("editName").value;
        staff.position = document.getElementById("editPos").value;
        staff.department = document.getElementById("editDept").value;
        staff.addr_no = document.getElementById("editAddrNo").value;
        staff.addr_moo = document.getElementById("editAddrMoo").value;
        staff.addr_subdistrict = document.getElementById("editAddrSub").value;
        staff.addr_district = document.getElementById("editAddrDist").value;
        staff.addr_province = document.getElementById("editAddrProv").value;
        staff.addr_zipcode = document.getElementById("editAddrZip").value;

        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("✅ บันทึกข้อมูลสำเร็จ");
        closeModal();
        renderTable();
    }

    // --- ระบบจัดการการลา ---
    function renderLeaveRequests() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const container = document.getElementById("leaveRequestList");
        
        if (requests.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#ccc; padding:20px; font-size:13px;">ไม่มีรายการรออนุมัติ</p>';
            return;
        }

        container.innerHTML = requests.map((req, index) => `
            <div style="border:1px solid #f0f0f0; padding:15px; border-radius:18px; margin-bottom:10px; background:#fafafa;">
                <div style="display:flex; justify-content:space-between; align-items:start;">
                    <div>
                        <span class="status-pill ${req.status === 'รอการอนุมัติ' ? 'pending' : (req.status === 'อนุมัติ' ? 'approved' : 'rejected')}">${req.status}</span>
                        <div style="font-weight:bold; margin-top:8px; font-size:14px; color:var(--primary);">${req.name}</div>
                        <div style="font-size:12px; color:#777;">ขอแจ้ง: <strong>${req.type}</strong> เมื่อวันที่ ${req.date}</div>
                    </div>
                    ${req.status === 'รอการอนุมัติ' ? `
                        <div style="display:flex;">
                            <button class="btn-action btn-approve" onclick="handleLeave(${index}, 'อนุมัติ')">อนุมัติ</button>
                            <button class="btn-action btn-reject" onclick="handleLeave(${index}, 'ไม่อนุมัติ')">ปฏิเสธ</button>
                        </div>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }

    function handleLeave(index, status) {
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        requests[index].status = status;
        localStorage.setItem("leave_requests", JSON.stringify(requests));
        alert("ดำเนินการ " + status + " เรียบร้อย");
        renderLeaveRequests();
    }

    function closeModal() { document.getElementById("editModal").style.display = "none"; }
    window.onclick = (e) => { if (e.target == document.getElementById("editModal")) closeModal(); }

    window.onload = () => {
        renderTable();
        renderLeaveRequests();
    };
</script>
</body>
</html>
