<script>
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9;
            --secondary: #00c6ff;
            --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.85);
            --success: #2ecc71;
            --warning: #ffa800;
            --danger: #ff7675;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; padding: 40px 20px 50px; text-align: center;
            border-radius: 0 0 40px 40px; box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2);
        }

        .container { max-width: 800px; margin: -30px auto 0; padding: 0 15px; position: relative; z-index: 10; }

        .search-container {
            margin-bottom: 20px; padding: 15px;
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 20px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.4);
        }

        .search-box {
            width: 100%; padding: 14px 20px; border-radius: 15px;
            border: 1px solid rgba(106, 90, 249, 0.2); outline: none; box-sizing: border-box;
            background: rgba(255,255,255,0.9); font-size: 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(106, 90, 249, 0.1); }

        .card {
            background: #fff; border-radius: 25px; padding: 25px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.8);
        }

        .section-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; margin-bottom: 20px; }
        .info-item { background: #f9f9ff; padding: 12px; border-radius: 15px; border: 1px solid #eee; transition: 0.3s; }
        .info-item:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .info-label { font-size: 10px; color: #888; font-weight: bold; display: block; margin-bottom: 3px; }

        .leave-item {
            background: #f9f9ff; border-radius: 18px; padding: 15px;
            margin-bottom: 12px; border: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s;
        }
        .leave-item:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        .stats-box { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 20px; }
        .stat-card { flex: 1; text-align: center; padding: 15px 10px; border-radius: 18px; background: #fff; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .stat-val { display: block; font-size: 22px; font-weight: 800; color: var(--primary); }
        .stat-lab { font-size: 11px; color: #666; line-height: 1.4; }

        .btn { border: none; padding: 12px 20px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); filter: brightness(0.95); }
        .btn-edit { background: #f0edff; color: var(--primary); }
        .btn-save { background: var(--primary); color: #fff; width: 100%; padding: 15px; }
        .btn-delete { background: #ffe2e5; color: var(--danger); }

        /* Modal Style */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .modal-content { 
            background: #fff; margin: 5% auto; padding: 30px; width: 90%; max-width: 500px; 
            border-radius: 30px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; font-weight: bold; }
        input, select, textarea { 
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #ddd; 
            box-sizing: border-box; background: #fcfcfc; transition: 0.3s; font-family: inherit;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(106, 90, 249, 0.1); }
        
        /* สกอร์บาร์สำหรับ Popup */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 26px; letter-spacing: 1px;">Admin Dashboard</h1>
    <p style="font-size: 13px; opacity: 0.85; margin-top: 5px;">จัดการข้อมูลพนักงานและประวัติการลา</p>
</div>

<div class="container">
    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ค้นหาด้วย รหัสพนักงาน หรือ เลขบัตรประชาชน..." onkeyup="renderStaffSection()">
    </div>

    <div id="staffSection"></div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div class="section-title" style="margin:0;">📅 รายการแจ้งลาหยุด</div>
            <input type="date" id="filterDate" onchange="renderDailyLeaves()" style="width: auto; padding: 8px 12px; font-size: 12px; border-radius: 12px; border: 1px solid #ddd; background: #f9f9ff; color: var(--primary); font-weight: bold;">
        </div>
        <div id="dailyLeaves"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px; align-items: center;">
            <h3 style="margin:0; color: var(--primary);">⚙️ จัดการข้อมูลพนักงาน</h3>
            <span onclick="closeModal('editModal')" style="cursor:pointer; font-size: 24px; color: #888; line-height: 1;">&times;</span>
        </div>

        <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="editName"></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>รหัสพนักงาน</label><input type="text" id="editEmpId"></div>
            <div class="form-group"><label>เลขบัตรประชาชน</label><input type="text" id="editIdCard"></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>ตำแหน่ง</label><input type="text" id="editPos"></div>
            <div class="form-group"><label>แผนก</label><input type="text" id="editDept"></div>
        </div>

        <div style="background: #f9f9ff; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #eee;">
            <label style="color: var(--primary); font-size: 13px; margin-bottom: 10px;">📍 ที่อยู่ปัจจุบัน</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group" style="margin:0;"><label>บ้านเลขที่</label><input type="text" id="editAddrNo"></div>
                <div class="form-group" style="margin:0;"><label>หมู่ / หมู่บ้าน</label><input type="text" id="editAddrMoo"></div>
                <div class="form-group" style="margin:0;"><label>ตำบล</label><input type="text" id="editAddrSub"></div>
                <div class="form-group" style="margin:0;"><label>อำเภอ</label><input type="text" id="editAddrDist"></div>
                <div class="form-group" style="margin:0; grid-column: span 2;"><label>จังหวัด</label><input type="text" id="editAddrProv"></div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>โควตาป่วย</label><input type="number" id="q_sick"></div>
            <div class="form-group"><label>โควตากิจ</label><input type="number" id="q_personal"></div>
            <div class="form-group"><label>โควตาพักร้อน</label><input type="number" id="q_vacation"></div>
        </div>

        <hr style="border: 0; border-top: 1px dashed #ddd; margin: 20px 0;">

        <div class="section-title" style="font-size: 15px;">📊 สถิติการลา (อนุมัติแล้ว)</div>
        <div id="modalLeaveStats" class="stats-box"></div>

        <div class="section-title" style="font-size: 15px; margin-top: 15px;">📜 ประวัติการลา (กดเพื่อแก้ไข)</div>
        <div id="modalLeaveHistory" style="max-height: 250px; overflow-y: auto; padding-right: 5px; margin-bottom: 20px;"></div>

        <button class="btn btn-save" onclick="updateStaffInfo()">💾 บันทึกข้อมูลพนักงาน</button>
    </div>
</div>

<div id="leaveEditModal" class="modal" style="z-index: 1001; background: rgba(0,0,0,0.6);">
    <div class="modal-content" style="max-width: 400px; margin: 10% auto;">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px; align-items: center;">
            <h3 style="margin:0; color: var(--primary);">📝 จัดการรายการลา</h3>
            <span onclick="closeModal('leaveEditModal')" style="cursor:pointer; font-size: 24px; color: #888; line-height: 1;">&times;</span>
        </div>
        <input type="hidden" id="editLeaveId">
        <div class="form-group">
            <label>ประเภทการลา</label>
            <select id="editLeaveType">
                <option value="ลาป่วย">ลาป่วย</option>
                <option value="ลากิจ">ลากิจ</option>
                <option value="ลาพักร้อน">ลาพักร้อน</option>
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>เริ่มวันที่</label><input type="date" id="editLeaveStart"></div>
            <div class="form-group"><label>ถึงวันที่</label><input type="date" id="editLeaveEnd"></div>
        </div>
        <div class="form-group"><label>จำนวนวัน</label><input type="number" id="editLeaveDays" step="0.5"></div>
        <div class="form-group">
            <label>สถานะ</label>
            <select id="editLeaveStatus">
                <option value="รอการอนุมัติ">รอการอนุมัติ</option>
                <option value="อนุมัติ">อนุมัติ</option>
                <option value="ไม่อนุมัติ">ไม่อนุมัติ</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-save" style="flex:2;" onclick="saveLeaveEdit()">💾 บันทึกการแก้ไข</button>
            <button class="btn btn-delete" style="flex:1;" onclick="deleteLeaveFromPopup()">🗑️ ลบรายการ</button>
        </div>
    </div>
</div>

<script>
    let staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

    // 1. ระบบค้นหาและแสดงพนักงาน (รหัสพนักงาน หรือ เลขบัตรประชาชน)
    function renderStaffSection() {
        const container = document.getElementById("staffSection");
        const search = document.getElementById("searchInput").value.trim();
        
        if(!staff.fullName) {
            container.innerHTML = `<div class="card" style="text-align:center; color:#999;">ยังไม่มีข้อมูลพนักงานในระบบ</div>`;
            return;
        }

        const empId = staff.employeeId || '';
        const idCard = staff.idCard || '';

        // ถ้าพิมพ์ค้นหา และไม่ตรงกับรหัสพนักงาน หรือ เลขบัตรประชาชน ให้ซ่อนการ์ด
        if(search !== '' && !empId.includes(search) && !idCard.includes(search)) {
            container.innerHTML = `<div class="card" style="text-align:center; color:#999; padding: 30px;">ไม่พบข้อมูลพนักงานที่ค้นหา</div>`;
            return;
        }

        container.innerHTML = `
            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 16px; font-weight: bold; color: var(--primary);">${staff.fullName}</div>
                    <div style="font-size: 12px; color: #666; margin-top: 5px;">รหัส: ${staff.employeeId || '-'} | ตำแหน่ง: ${staff.position || '-'}</div>
                </div>
                <button class="btn btn-edit" onclick="openEditModal()">⚙️ จัดการข้อมูล</button>
            </div>
        `;
    }

    // 2. แสดงรายการลาของพนักงานใน Modal
    function renderModalStatsAndHistory() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const empId = staff.employeeId || document.getElementById("editEmpId").value;
        const myLeaves = requests.filter(r => r.empId === empId);
        
        // คำนวณสถิติเฉพาะที่ "อนุมัติ"
        const approved = myLeaves.filter(r => r.status === 'อนุมัติ');
        const sick = approved.filter(r => r.type === 'ลาป่วย');
        const personal = approved.filter(r => r.type === 'ลากิจ');
        const vacation = approved.filter(r => r.type === 'ลาพักร้อน');

        // รวมจำนวนวัน
        const sickDays = sick.reduce((s, r) => s + parseFloat(r.days||0), 0);
        const personalDays = personal.reduce((s, r) => s + parseFloat(r.days||0), 0);
        const vacationDays = vacation.reduce((s, r) => s + parseFloat(r.days||0), 0);

        // Render สถิติ (แสดงจำนวนวัน และ จำนวนครั้ง)
        document.getElementById("modalLeaveStats").innerHTML = `
            <div class="stat-card"><span class="stat-val">${sickDays}</span><span class="stat-lab">ลาป่วย<br><b>(${sick.length} ครั้ง)</b></span></div>
            <div class="stat-card"><span class="stat-val">${personalDays}</span><span class="stat-lab">ลากิจ<br><b>(${personal.length} ครั้ง)</b></span></div>
            <div class="stat-card"><span class="stat-val">${vacationDays}</span><span class="stat-lab">พักร้อน<br><b>(${vacation.length} ครั้ง)</b></span></div>
        `;

        // Render ประวัติ (กดแล้วเรียก Popup จัดการลา)
        const historyContainer = document.getElementById("modalLeaveHistory");
        if(myLeaves.length > 0) {
            historyContainer.innerHTML = myLeaves.reverse().map(r => `
                <div class="leave-item" onclick="openLeaveEditModal(${r.id})" style="cursor:pointer; padding: 12px; margin-bottom: 8px;">
                    <div>
                        <strong style="font-size: 13px; color: #333;">${r.type}</strong> <span style="font-size: 12px; color: var(--primary);">(${r.days} วัน)</span>
                        <div style="font-size: 11px; color: #888; margin-top: 3px;">${r.startDate} ถึง ${r.endDate}</div>
                    </div>
                    <span class="badge" style="font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 8px; background: ${r.status === 'อนุมัติ' ? '#eef9f2' : (r.status === 'ไม่อนุมัติ' ? '#ffe2e5' : '#fff4de')}; color: ${r.status === 'อนุมัติ' ? 'var(--success)' : (r.status === 'ไม่อนุมัติ' ? 'var(--danger)' : 'var(--warning)')}">${r.status}</span>
                </div>
            `).join('');
        } else {
            historyContainer.innerHTML = `<div style="text-align:center; font-size:12px; color:#999; padding: 10px;">ไม่มีประวัติการลา</div>`;
        }
    }

    // 3. แสดงรายการแจ้งลาในหน้ารวม (กรองด้วยวันเดือนปี)
    function renderDailyLeaves() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const filterDateInput = document.getElementById("filterDate").value; 
        const container = document.getElementById("dailyLeaves");
        
        // แปลงวันที่จาก DatePicker เป็นรูปแบบ Date String ภาษาไทย เพื่อเปรียบเทียบกับระบบ
        const filterDateObj = new Date(filterDateInput);
        const filterDateStr = filterDateObj.toLocaleDateString('th-TH');

        // กรองรายการลาที่ Date ตรงกับ DatePicker
        const filtered = requests.filter(r => r.date === filterDateStr);

        if(filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px 10px; color:#999; font-size:13px; background: #f9f9ff; border-radius: 15px;">ไม่มีรายการส่งคำขอลาในวันที่เลือก</div>`;
            return;
        }

        container.innerHTML = filtered.slice().reverse().map(req => `
            <div class="leave-item" onclick="openLeaveEditModal(${req.id})" style="cursor:pointer; flex-direction: column; align-items: flex-start;">
                <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:8px;">
                    <span style="font-weight:bold; color:var(--primary); font-size: 14px;">${req.name}</span>
                    <span style="font-size: 11px; font-weight:bold; padding: 4px 10px; border-radius: 10px; background: ${req.status === 'อนุมัติ' ? '#eef9f2' : (req.status === 'ไม่อนุมัติ' ? '#ffe2e5' : '#fff4de')}; color: ${req.status === 'อนุมัติ' ? 'var(--success)' : (req.status === 'ไม่อนุมัติ' ? 'var(--danger)' : 'var(--warning)')}">${req.status}</span>
                </div>
                <div style="font-size:12px; color: #555;"><strong>${req.type}</strong> (${req.days} วัน)</div>
                <div style="font-size:11px; color:#888; margin-top:5px;">วันที่ลา: ${req.startDate} ถึง ${req.endDate}</div>
            </div>
        `).join('');
    }

    // 4. การจัดการ Popup แก้ไขพนักงาน
    function openEditModal() {
        document.getElementById("editEmpId").value = staff.employeeId || '';
        document.getElementById("editName").value = staff.fullName || '';
        document.getElementById("editIdCard").value = staff.idCard || '';
        document.getElementById("editPos").value = staff.position || '';
        document.getElementById("editDept").value = staff.department || '';
        
        // ที่อยู่แยกฟิลด์
        document.getElementById("editAddrNo").value = staff.addr_no || '';
        document.getElementById("editAddrMoo").value = staff.addr_moo || '';
        document.getElementById("editAddrSub").value = staff.addr_subdistrict || '';
        document.getElementById("editAddrDist").value = staff.addr_district || '';
        document.getElementById("editAddrProv").value = staff.addr_province || '';

        document.getElementById("q_sick").value = staff.q_sick || 30;
        document.getElementById("q_personal").value = staff.q_personal || 6;
        document.getElementById("q_vacation").value = staff.q_vacation || 10;
        
        renderModalStatsAndHistory(); // โหลดสถิติและประวัติมาแสดง
        document.getElementById("editModal").style.display = "block";
    }

    function updateStaffInfo() {
        staff.employeeId = document.getElementById("editEmpId").value;
        staff.fullName = document.getElementById("editName").value;
        staff.idCard = document.getElementById("editIdCard").value;
        staff.position = document.getElementById("editPos").value;
        staff.department = document.getElementById("editDept").value;
        
        staff.addr_no = document.getElementById("editAddrNo").value;
        staff.addr_moo = document.getElementById("editAddrMoo").value;
        staff.addr_subdistrict = document.getElementById("editAddrSub").value;
        staff.addr_district = document.getElementById("editAddrDist").value;
        staff.addr_province = document.getElementById("editAddrProv").value;
        
        staff.q_sick = document.getElementById("q_sick").value;
        staff.q_personal = document.getElementById("q_personal").value;
        staff.q_vacation = document.getElementById("q_vacation").value;

        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("✅ อัปเดตข้อมูลพนักงานเรียบร้อยแล้ว");
        closeModal('editModal');
        renderStaffSection();
    }

    // 5. การจัดการ Popup จัดการรายการลา
    function openLeaveEditModal(id) {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const req = requests.find(r => r.id === id);
        if(req) {
            document.getElementById("editLeaveId").value = req.id;
            document.getElementById("editLeaveType").value = req.type;
            document.getElementById("editLeaveStart").value = req.startDate;
            document.getElementById("editLeaveEnd").value = req.endDate;
            document.getElementById("editLeaveDays").value = req.days;
            document.getElementById("editLeaveStatus").value = req.status;
            document.getElementById("leaveEditModal").style.display = "block";
        }
    }

    function saveLeaveEdit() {
        const id = parseInt(document.getElementById("editLeaveId").value);
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const idx = requests.findIndex(r => r.id === id);
        if(idx !== -1) {
            requests[idx].type = document.getElementById("editLeaveType").value;
            requests[idx].startDate = document.getElementById("editLeaveStart").value;
            requests[idx].endDate = document.getElementById("editLeaveEnd").value;
            requests[idx].days = document.getElementById("editLeaveDays").value;
            requests[idx].status = document.getElementById("editLeaveStatus").value;
            
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            alert("✅ บันทึกการแก้ไขรายการลาเรียบร้อย");
            closeModal('leaveEditModal');
            
            // อัปเดตหน้าจอทั้งหมดที่เกี่ยวข้องแบบ Real-time
            renderModalStatsAndHistory(); 
            renderDailyLeaves();
        }
    }

    function deleteLeaveFromPopup() {
        if(confirm("⚠️ ยืนยันการลบรายการลานี้ออกจากระบบ?")) {
            const id = parseInt(document.getElementById("editLeaveId").value);
            let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
            requests = requests.filter(r => r.id !== id);
            
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            closeModal('leaveEditModal');
            
            renderModalStatsAndHistory();
            renderDailyLeaves();
        }
    }

    function closeModal(mId) { document.getElementById(mId).style.display = "none"; }

    // ปิด Popup เมื่อคลิกพื้นที่ว่าง
    window.onclick = function(event) {
        if (event.target == document.getElementById("editModal")) closeModal('editModal');
        if (event.target == document.getElementById("leaveEditModal")) closeModal('leaveEditModal');
    }

    // ทำงานเมื่อโหลดหน้าเว็บ
    window.onload = () => {
        // ตั้งค่าตัวกรองเป็นวันปัจจุบัน
        document.getElementById('filterDate').value = new Date().toLocaleDateString('en-CA'); 
        
        renderStaffSection();
        renderDailyLeaves();
    };
</script>
</body>
</html>
