<script>
    // ตรวจสอบสิทธิ์ก่อนแสดงผลหน้าเว็บ
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9;
            --secondary: #00c6ff;
            --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.9);
            --success: #2ecc71;
            --warning: #ffa800;
            --danger: #ff7675;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
        }

        * { box-sizing: border-box; } 

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: #333; 
            padding-bottom: 50px; 
            overflow-x: hidden;
        }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; 
            padding: 30px 20px 50px; 
            text-align: center;
            border-radius: 0 0 40px 40px; 
            box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2);
        }

        .container { 
            max-width: 1000px; 
            margin: -30px auto 0; 
            padding: 0 15px; 
        }

        /* ปรับส่วน Filter ให้พอดีจอ ไม่ซ้อนทับกัน */
        .filter-container {
            background: #fff; 
            padding: 15px; 
            border-radius: 20px; 
            box-shadow: var(--shadow); 
            margin-bottom: 20px; 
            display: flex;
            flex-direction: column; /* ปรับเป็นแนวตั้งในมือถือเพื่อไม่ให้ทับกัน */
            align-items: center;
            gap: 12px;
        }

        @media (min-width: 600px) {
            .filter-container { flex-direction: row; justify-content: center; }
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            margin: 25px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            gap: 15px;
        }

        @media (min-width: 768px) {
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(106, 90, 249, 0.1);
            width: 100%;
        }

        .btn-action {
            border: none; padding: 10px 15px; border-radius: 12px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            transition: 0.3s; color: #fff; text-align: center;
        }
        .btn-edit { background: var(--primary); }
        .btn-manage { background: #f39c12; }

        .status-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #fff; margin: 5% auto; padding: 25px;
            border-radius: 25px; width: 90%; max-width: 450px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            max-height: 85vh; overflow-y: auto;
        }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }

        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary); font-size: 13px; }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px;
            box-sizing: border-box; margin-bottom: 12px; font-size: 14px; background: #fafafa;
        }
        
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex-row > div { flex: 1; min-width: 140px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0; font-size: 24px;">ระบบจัดการ (Admin)</h1>
        <p style="margin:5px 0 0; opacity: 0.9; font-size: 14px;">✓Record Income - จัดการข้อมูล</p>
    </div>

    <div class="container">
        <div class="filter-container">
            <span style="font-weight:bold; color:var(--primary); font-size:15px;">เลือกวันที่ดูรายการลา:</span>
            <input type="date" id="filterDate" onchange="renderDailyLeaves()" style="padding: 10px; border-radius: 12px; border: 1px solid #ddd; outline: none;">
            <button onclick="document.getElementById('filterDate').value = ''; renderDailyLeaves();" style="padding: 10px 20px; border-radius: 12px; border: none; background: #f0f0f0; color: #555; font-weight:bold; cursor:pointer;">ดูทั้งหมด</button>
        </div>

        <div class="section-title">📅 รายการแจ้งลาหยุด</div>
        <div id="leaveDailySection" class="grid-container"></div>

        <div class="section-title">👥 ข้อมูลพนักงาน</div>
        <div id="staffSection" class="grid-container"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('editModal')">&times;</span>
            <h2 style="color: var(--primary); text-align: center; margin: 0 0 20px 0; font-size: 20px;">จัดการข้อมูลพนักงาน</h2>
            
            <div class="input-group">
                <div class="flex-row">
                    <div><label>รหัสพนักงาน</label><input type="text" id="editEmpId"></div>
                    <div style="flex: 1.5;"><label>ชื่อ-นามสกุล</label><input type="text" id="editName"></div>
                </div>
                
                <label>เลขประจำตัวประชาชน</label>
                <input type="text" id="editIdCard">
                
                <div class="flex-row">
                    <div><label>เบอร์โทรศัพท์</label><input type="tel" id="editPhone"></div>
                    <div><label>ตำแหน่ง</label><input type="text" id="editPos"></div>
                </div>
                <label>แผนก</label>
                <input type="text" id="editDept">

                <h4 style="color:var(--primary); margin: 10px 0;">📍 ที่อยู่</h4>
                <div class="flex-row">
                    <div><label>บ้านเลขที่</label><input type="text" id="editAddrNo"></div>
                    <div><label>หมู่ที่</label><input type="text" id="editAddrMoo"></div>
                </div>
                <div class="flex-row">
                    <div><label>ตำบล</label><input type="text" id="editAddrSubdistrict"></div>
                    <div><label>อำเภอ</label><input type="text" id="editAddrDistrict"></div>
                </div>
                <label>จังหวัด</label>
                <input type="text" id="editAddrProvince">
                
                <h4 style="color:var(--primary); margin: 10px 0;">📊 โควตาการลา (วัน/ปี)</h4>
                <div class="flex-row">
                    <div><label>ป่วย</label><input type="number" id="q_sick"></div>
                    <div><label>กิจ</label><input type="number" id="q_personal"></div>
                    <div><label>พักร้อน</label><input type="number" id="q_vacation"></div>
                </div>
            </div>

            <button onclick="updateStaffInfo()" style="width: 100%; padding: 15px; background: var(--success); color: #fff; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer;">💾 บันทึกข้อมูล</button>
        </div>
    </div>

    <div id="leaveEditModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('leaveEditModal')">&times;</span>
            <h2 style="color: var(--primary); text-align: center; margin-bottom: 20px; font-size: 20px;">จัดการรายการลา</h2>
            <div id="modalLeaveStats" style="display:flex; gap:8px; margin-bottom: 15px;"></div>
            
            <div style="background: #fdfbf7; padding: 15px; border-radius: 15px; border: 1px solid #eee;">
                <input type="hidden" id="editLeaveId">
                <div class="input-group">
                    <label>สถานะ</label>
                    <select id="editLeaveStatus">
                        <option value="รอการอนุมัติ">⏳ รอการอนุมัติ</option>
                        <option value="อนุมัติ">✅ อนุมัติ</option>
                        <option value="ไม่อนุมัติ">❌ ไม่อนุมัติ</option>
                        <option value="ยกเลิก">🗑️ ยกเลิกรายการ</option>
                    </select>
                    <label>เหตุผล</label>
                    <textarea id="editLeaveReason" rows="2" readonly style="background:#f0f0f0; color:#777;"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="saveLeaveEdit()" class="btn-action btn-edit" style="flex:2;">💾 บันทึก</button>
                    <button onclick="deleteLeaveFromPopup()" class="btn-action" style="background:var(--danger); flex:1;">🗑️ ลบ</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- Logic เดิมทั้งหมด ---
    function renderStaffSection() {
        const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};
        const container = document.getElementById("staffSection");
        if (!staff.employeeId) {
            container.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">ไม่พบข้อมูล</div>`;
            return;
        }
        container.innerHTML = `
            <div class="card">
                <div style="display:flex; align-items:center; gap: 15px;">
                    <img src="${staff.photo || 'https://via.placeholder.com/60'}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid var(--primary);">
                    <div>
                        <div style="font-weight:bold; color:var(--primary);">${staff.fullName}</div>
                        <div style="font-size:12px; color:#666;">รหัส: ${staff.employeeId} | ${staff.department}</div>
                    </div>
                </div>
                <hr style="margin:15px 0; border:0.5px solid #eee;">
                <div style="font-size:13px; margin-bottom:15px;">
                    📍 ตำแหน่ง: ${staff.position}<br>
                    📊 โควตา: ป่วย ${staff.q_sick||30} | กิจ ${staff.q_personal||6} | พักร้อน ${staff.q_vacation||10}
                </div>
                <button class="btn-action btn-edit" style="width:100%;" onclick="openEditModal()">✏️ แก้ไขข้อมูล & โควตา</button>
            </div>
        `;
    }

    function renderDailyLeaves() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const container = document.getElementById("leaveDailySection");
        const filterDate = document.getElementById("filterDate").value;
        let filtered = requests;
        if (filterDate) {
            const [y, m, d] = filterDate.split('-');
            const thaiDate = `${parseInt(d)}/${parseInt(m)}/${parseInt(y)+543}`;
            filtered = requests.filter(r => r.date === thaiDate);
        }
        filtered.sort((a, b) => b.id - a.id);
        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">ไม่มีข้อมูล</div>`;
            return;
        }
        container.innerHTML = filtered.map(req => `
            <div class="card" style="border-left: 5px solid ${req.status === 'อนุมัติ' ? 'var(--success)' : (req.status==='ไม่อนุมัติ'?'var(--danger)':'var(--warning)')}">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <span style="font-weight:bold; color:var(--primary);">${req.name}</span>
                    <span class="status-badge ${req.status==='อนุมัติ'?'status-approved':(req.status==='ไม่อนุมัติ'?'status-rejected':'status-pending')}">${req.status}</span>
                </div>
                <div style="font-size:13px; color:#555; margin-bottom:12px;">
                    <strong>${req.type}</strong> (${req.days} วัน)<br>
                    📅 ${req.startDate} ถึง ${req.endDate}
                </div>
                <button class="btn-action btn-manage" style="width:100%;" onclick="openLeaveEditPopup(${req.id}, '${req.empId}')">⚙️ จัดการรายการ</button>
            </div>
        `).join('');
    }

    function openLeaveEditPopup(reqId, empId) {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const req = requests.find(r => r.id === reqId);
        if(req) {
            document.getElementById("editLeaveId").value = req.id;
            document.getElementById("editLeaveReason").value = req.reason || '-';
            document.getElementById("editLeaveStatus").value = req.status;
            
            const profile = JSON.parse(localStorage.getItem("employee_profile")) || {};
            const myLeaves = requests.filter(r => r.empId === empId && r.status === 'อนุมัติ');
            const used = (type) => myLeaves.filter(r => r.type === type).reduce((s, r) => s + parseFloat(r.days||0), 0);
            
            document.getElementById("modalLeaveStats").innerHTML = `
                <div style="flex:1; background:#eef; padding:5px; border-radius:10px; text-align:center; font-size:10px;">ป่วย ${used('ลาป่วย')}/${profile.q_sick||30}</div>
                <div style="flex:1; background:#fff3cd; padding:5px; border-radius:10px; text-align:center; font-size:10px;">กิจ ${used('ลากิจ')}/${profile.q_personal||6}</div>
                <div style="flex:1; background:#d4edda; padding:5px; border-radius:10px; text-align:center; font-size:10px;">พักร้อน ${used('ลาพักร้อน')}/${profile.q_vacation||10}</div>
            `;
            document.getElementById("leaveEditModal").style.display = "block";
        }
    }

    function saveLeaveEdit() {
        const id = parseInt(document.getElementById("editLeaveId").value);
        let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const idx = requests.findIndex(r => r.id === id);
        if(idx !== -1) {
            requests[idx].status = document.getElementById("editLeaveStatus").value;
            localStorage.setItem("leave_requests", JSON.stringify(requests));
            alert("บันทึกแล้ว");
            closeModal('leaveEditModal');
            renderDailyLeaves();
        }
    }

    function deleteLeaveFromPopup() {
        if(confirm("ลบรายการนี้?")) {
            const id = parseInt(document.getElementById("editLeaveId").value);
            let requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
            localStorage.setItem("leave_requests", JSON.stringify(requests.filter(r => r.id !== id)));
            closeModal('leaveEditModal');
            renderDailyLeaves();
        }
    }

    function openEditModal() {
        const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};
        document.getElementById("editEmpId").value = staff.employeeId || '';
        document.getElementById("editName").value = staff.fullName || '';
        document.getElementById("editIdCard").value = staff.idCard || '';
        document.getElementById("editPhone").value = staff.phone || '';
        document.getElementById("editPos").value = staff.position || '';
        document.getElementById("editDept").value = staff.department || '';
        document.getElementById("editAddrNo").value = staff.addr_no || '';
        document.getElementById("editAddrMoo").value = staff.addr_moo || '';
        document.getElementById("editAddrSubdistrict").value = staff.addr_subdistrict || '';
        document.getElementById("editAddrDistrict").value = staff.addr_district || '';
        document.getElementById("editAddrProvince").value = staff.addr_province || '';
        document.getElementById("q_sick").value = staff.q_sick || 30;
        document.getElementById("q_personal").value = staff.q_personal || 6;
        document.getElementById("q_vacation").value = staff.q_vacation || 10;
        document.getElementById("editModal").style.display = "block";
    }

    function updateStaffInfo() {
        const staff = JSON.parse(localStorage.getItem("employee_profile")) || {};
        staff.employeeId = document.getElementById("editEmpId").value;
        staff.fullName = document.getElementById("editName").value;
        staff.idCard = document.getElementById("editIdCard").value;
        staff.phone = document.getElementById("editPhone").value;
        staff.position = document.getElementById("editPos").value;
        staff.department = document.getElementById("editDept").value;
        staff.addr_no = document.getElementById("editAddrNo").value;
        staff.addr_moo = document.getElementById("editAddrMoo").value;
        staff.addr_subdistrict = document.getElementById("editAddrSubdistrict").value;
        staff.addr_district = document.getElementById("editAddrDistrict").value;
        staff.addr_province = document.getElementById("editAddrProvince").value;
        staff.q_sick = document.getElementById("q_sick").value;
        staff.q_personal = document.getElementById("q_personal").value;
        staff.q_vacation = document.getElementById("q_vacation").value;
        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("อัปเดตแล้ว");
        closeModal('editModal');
        renderStaffSection();
    }

    function closeModal(mId) { document.getElementById(mId).style.display = "none"; }
    window.onload = () => { renderStaffSection(); renderDailyLeaves(); };
</script>
</body>
</html>
