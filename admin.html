<script>
    if (sessionStorage.getItem("isAdmin") !== "true") {
        alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้า Admin");
        location.href = "login.html";
    }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ✓Record Income</title>
    <style>
        :root {
            --primary: #6a5af9;
            --secondary: #00c6ff;
            --bg: #FDFBF7;
            --glass: rgba(255, 255, 255, 0.85);
            --success: #2ecc71;
            --danger: #ff7675;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; padding: 40px 20px; text-align: center;
            border-radius: 0 0 35px 35px; box-shadow: 0 10px 30px rgba(106, 90, 249, 0.2);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }

        .search-container {
            margin: -25px 0 20px; padding: 15px;
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 20px; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }

        .search-box {
            width: 100%; padding: 12px 15px; border-radius: 15px;
            border: 1px solid rgba(106, 90, 249, 0.2); outline: none; box-sizing: border-box;
        }

        .card {
            background: #fff; border-radius: 25px; padding: 20px;
            margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.03);
        }

        .section-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; margin-bottom: 15px; }
        .info-item { background: #f9f9ff; padding: 10px; border-radius: 12px; border: 1px solid #eee; }
        .info-label { font-size: 10px; color: #888; font-weight: bold; display: block; }

        .leave-item {
            background: #f9f9ff; border-radius: 18px; padding: 15px;
            margin-bottom: 12px; border: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }

        .stats-box { display: flex; gap: 10px; margin-top: 10px; }
        .stat-card { flex: 1; text-align: center; padding: 10px; border-radius: 15px; background: #fff; border: 1px solid #eee; }
        .stat-val { display: block; font-size: 18px; font-weight: 800; color: var(--primary); }
        .stat-lab { font-size: 10px; color: #666; }

        .btn { border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .btn-edit { background: #f0edff; color: var(--primary); }
        .btn-save { background: var(--primary); color: #fff; width: 100%; padding: 15px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .modal-content { background: #fff; margin: 5% auto; padding: 25px; width: 90%; max-width: 500px; border-radius: 30px; max-height: 80vh; overflow-y: auto; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; background: #fcfcfc; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 24px; letter-spacing: 1px;">Admin Dashboard</h1>
    <p style="font-size: 12px; opacity: 0.8;">จัดการข้อมูลพนักงานและประวัติการลา</p>
</div>

<div class="container">
    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ค้นหาชื่อพนักงาน..." onkeyup="renderStaffSection()">
    </div>

    <div id="staffSection"></div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div class="section-title" style="margin:0;">📅 รายการแจ้งลา (วันนี้)</div>
            <input type="date" id="filterDate" onchange="renderDailyLeaves()" style="width: auto; padding: 5px 10px; font-size: 12px; border-radius: 10px; border: 1px solid #ddd;">
        </div>
        <div id="dailyLeaves"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
            <h3 style="margin:0; color: var(--primary);">⚙️ แก้ไขข้อมูลพนักงาน</h3>
            <span onclick="closeModal('editModal')" style="cursor:pointer; font-size: 20px;">&times;</span>
        </div>
        <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="editName"></div>
        <div class="form-group"><label>ตำแหน่ง</label><input type="text" id="editPos"></div>
        <div class="form-group"><label>แผนก</label><input type="text" id="editDept"></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>ป่วย</label><input type="number" id="q_sick"></div>
            <div class="form-group"><label>กิจ</label><input type="number" id="q_personal"></div>
            <div class="form-group"><label>พักร้อน</label><input type="number" id="q_vacation"></div>
        </div>
        <button class="btn btn-save" onclick="updateStaffInfo()">💾 บันทึกข้อมูล</button>
    </div>
</div>

<div id="leaveDetailModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
            <h3 style="margin:0; color: var(--primary);">📋 รายละเอียดการลา</h3>
            <span onclick="closeModal('leaveDetailModal')" style="cursor:pointer; font-size: 20px;">&times;</span>
        </div>
        <div id="leaveDetailBody"></div>
    </div>
</div>

<script>
    let staff = JSON.parse(localStorage.getItem("employee_profile")) || {};

    function renderStaffSection() {
        const container = document.getElementById("staffSection");
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const search = document.getElementById("searchInput").value.toLowerCase();
        
        if(!staff.fullName || !staff.fullName.toLowerCase().includes(search)) {
            container.innerHTML = '';
            return;
        }

        // คำนวณสถิติการลา (เฉพาะที่อนุมัติแล้ว)
        const approvedLeaves = requests.filter(r => r.empId === staff.employeeId && r.status === 'อนุมัติ');
        const countSick = approvedLeaves.filter(r => r.type === 'ลาป่วย').reduce((sum, r) => sum + parseFloat(r.days), 0);
        const countPersonal = approvedLeaves.filter(r => r.type === 'ลากิจ').reduce((sum, r) => sum + parseFloat(r.days), 0);
        const countVacation = approvedLeaves.filter(r => r.type === 'ลาพักร้อน').reduce((sum, r) => sum + parseFloat(r.days), 0);

        container.innerHTML = `
            <div class="card">
                <div class="section-title">👤 ข้อมูลส่วนตัว & ที่อยู่</div>
                <div class="info-grid">
                    <div class="info-item"><span class="info-label">ชื่อ-นามสกุล</span>${staff.fullName}</div>
                    <div class="info-item"><span class="info-label">รหัสพนักงาน</span>${staff.employeeId || '-'}</div>
                    <div class="info-item"><span class="info-label">ตำแหน่ง</span>${staff.position}</div>
                    <div class="info-item"><span class="info-label">แผนก</span>${staff.department || '-'}</div>
                    <div class="info-item"><span class="info-label">เบอร์โทรศัพท์</span>${staff.phone || '-'}</div>
                    <div class="info-item" style="grid-column: span 2;">
                        <span class="info-label">ที่อยู่ปัจจุบัน</span>
                        ${staff.addr_no || ''} ม.${staff.addr_moo || ''} ต.${staff.addr_subdistrict || ''} อ.${staff.addr_district || ''} จ.${staff.addr_province || ''} ${staff.addr_zipcode || ''}
                    </div>
                </div>

                <div class="section-title">📊 สถิติการลา (ที่อนุมัติแล้ว)</div>
                <div class="stats-box">
                    <div class="stat-card"><span class="stat-val">${countSick}</span><span class="stat-lab">ลาป่วย</span></div>
                    <div class="stat-card"><span class="stat-val">${countPersonal}</span><span class="stat-lab">ลากิจ</span></div>
                    <div class="stat-card"><span class="stat-val">${countVacation}</span><span class="stat-lab">พักร้อน</span></div>
                </div>

                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <button class="btn btn-edit" style="flex:1" onclick="openEditModal()">⚙️ ตั้งค่าพนักงาน</button>
                    <button class="btn btn-edit" style="flex:1; background: #eef9f2; color: #2ecc71;" onclick="viewLeaveHistory()">📜 ดูประวัติการลาทั้งหมด</button>
                </div>
            </div>
        `;
    }

    // ฟังก์ชันดูประวัติทั้งหมดแบบ Popup
    function viewLeaveHistory() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const myLeaves = requests.filter(r => r.empId === staff.employeeId).reverse();
        
        let html = myLeaves.map(r => `
            <div class="leave-item" onclick="showLeaveDetail(${r.id})" style="cursor:pointer; margin-bottom: 8px; padding: 10px;">
                <div style="font-size: 13px;">
                    <strong>${r.type}</strong><br>
                    <small style="color:#888;">${r.startDate} (${r.days} วัน)</small>
                </div>
                <span style="font-size:11px; color: ${r.status === 'อนุมัติ' ? '#2ecc71' : (r.status === 'ไม่อนุมัติ' ? '#ff7675' : '#ffa800')}">${r.status}</span>
            </div>
        `).join('') || '<p style="text-align:center; color:#999;">ไม่พบประวัติการลา</p>';

        document.getElementById("leaveDetailBody").innerHTML = html;
        document.getElementById("leaveDetailModal").style.display = "block";
    }

    // ฟังก์ชันแสดงรายละเอียดการลาแบบ Popup (เมื่อกดที่รายการ)
    function showLeaveDetail(id) {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const r = requests.find(item => item.id === id);
        if(!r) return;

        const html = `
            <div style="background:#f9f9ff; padding:20px; border-radius:20px; border: 1px solid #eee;">
                <div style="margin-bottom:10px;"><span class="info-label">ประเภทการลา</span><strong>${r.type}</strong></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                    <div><span class="info-label">เริ่มวันที่</span>${r.startDate}</div>
                    <div><span class="info-label">ถึงวันที่</span>${r.endDate}</div>
                </div>
                <div style="margin-bottom:10px;"><span class="info-label">จำนวนวัน</span>${r.days} วัน</div>
                <div style="margin-bottom:10px;"><span class="info-label">เหตุผลการลา</span>${r.reason || 'ไม่ได้ระบุ'}</div>
                <div style="margin-bottom:10px;"><span class="info-label">วันที่ส่งรายการ</span>${r.date}</div>
                <div style="padding-top:10px; border-top:1px dashed #ddd; margin-top:10px;">
                    <span class="info-label">สถานะปัจจุบัน</span>
                    <strong style="color:var(--primary)">${r.status}</strong>
                </div>
            </div>
            <button class="btn btn-save" style="margin-top:15px; background:#666;" onclick="viewLeaveHistory()">⬅️ กลับไปที่รายการ</button>
        `;
        document.getElementById("leaveDetailBody").innerHTML = html;
    }

    function renderDailyLeaves() {
        const requests = JSON.parse(localStorage.getItem("leave_requests")) || [];
        const filterDate = document.getElementById("filterDate").value; 
        const container = document.getElementById("dailyLeaves");
        
        const filtered = requests.filter(r => r.date === new Date(filterDate).toLocaleDateString('th-TH'));

        if(filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:#999; font-size:12px;">ไม่มีรายการส่งเข้ามาในวันที่เลือก</div>`;
            return;
        }

        container.innerHTML = filtered.slice().reverse().map(req => `
            <div class="leave-item" onclick="showLeaveDetail(${req.id})" style="cursor:pointer;">
                <div>
                    <div style="font-weight:bold; color:var(--primary);">${req.name}</div>
                    <div style="font-size:12px;">${req.type} (${req.days} วัน)</div>
                </div>
                <span style="font-size: 11px; font-weight:bold; color: ${req.status === 'อนุมัติ' ? '#2ecc71' : '#ffa800'}">${req.status}</span>
            </div>
        `).join('');
    }

    function openEditModal() {
        document.getElementById("editName").value = staff.fullName || '';
        document.getElementById("editPos").value = staff.position || '';
        document.getElementById("editDept").value = staff.department || '';
        document.getElementById("q_sick").value = staff.q_sick || 30;
        document.getElementById("q_personal").value = staff.q_personal || 6;
        document.getElementById("q_vacation").value = staff.q_vacation || 10;
        document.getElementById("editModal").style.display = "block";
    }

    function updateStaffInfo() {
        staff.fullName = document.getElementById("editName").value;
        staff.position = document.getElementById("editPos").value;
        staff.department = document.getElementById("editDept").value;
        staff.q_sick = document.getElementById("q_sick").value;
        staff.q_personal = document.getElementById("q_personal").value;
        staff.q_vacation = document.getElementById("q_vacation").value;
        localStorage.setItem("employee_profile", JSON.stringify(staff));
        alert("อัปเดตข้อมูลสำเร็จ");
        closeModal('editModal');
        renderStaffSection();
    }

    function closeModal(mId) { document.getElementById(mId).style.display = "none"; }

    window.onload = () => {
        document.getElementById('filterDate').value = new Date().toLocaleDateString('en-CA');
        renderStaffSection();
        renderDailyLeaves();
    };
</script>
</body>
</html>
