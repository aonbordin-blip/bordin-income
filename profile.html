<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - ✓Record Income</title>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
:root {
    --primary: #6366f1;
    --secondary: #06b6d4;
    --bg: #f8fafc;
    --white: #ffffff;
    --text-main: #1e293b;
    --text-sub: #64748b;
    --border-color: #f1f5f9;
    --shadow-soft: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    --shadow-card: 0 10px 15px -3px rgb(0 0 0 / 0.05);
}

body { 
    margin: 0; 
    font-family: 'Inter', 'Segoe UI', sans-serif; 
    background: var(--bg); 
    color: var(--text-main); 
    padding-bottom: 50px; 
}

/* --- Modern Banner Header --- */
.header { 
    position: relative;
    background: linear-gradient(135deg, #4f46e5 0%, #0891b2 100%);
    height: 160px; 
    border-radius: 0 0 0 0; 
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.header::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 80%);
    top: -50%;
    left: -50%;
    animation: rotate 20s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.profile-section {
    position: relative;
    text-align: center;
    margin-top: -60px; 
    z-index: 10;
}

.profile-pic-container { 
    display: inline-flex; 
    flex-direction: column; 
    align-items: center; 
    position: relative; 
    cursor: pointer; 
}

#profilePreview { 
    width: 110px; 
    height: 110px; 
    border-radius: 50%; 
    object-fit: cover; 
    border: 5px solid var(--white); 
    background: #fff; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
}
.profile-pic-container:hover #profilePreview { transform: scale(1.05); }

.change-pic-hint { 
    position: absolute;
    bottom: 12px;
    right: -5px;
    background: var(--primary); 
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff; 
    border: 3px solid #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    font-size: 14px;
}

#displayName { 
    margin: 12px 0 4px; 
    font-size: 22px; 
    font-weight: 800;
    color: var(--text-main);
}

#displayId { 
    margin: 0; 
    font-size: 12px; 
    font-weight: 600;
    color: var(--primary);
    background: #eef2ff;
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-block;
    letter-spacing: 0.5px;
}

.container { padding: 0 16px; margin-top: 20px; position: relative; z-index: 2; }

.info-card { 
    background: var(--white); 
    border-radius: 24px; 
    padding: 20px; 
    box-shadow: var(--shadow-card); 
    margin-bottom: 16px; 
    border: 1px solid var(--border-color); 
}

.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
.input-group input, .input-group textarea, .input-group select { 
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); 
    border-radius: 14px; font-size: 15px; box-sizing: border-box; 
    background: #fcfdfe;
}
.input-group input:read-only { background: #f8fafc; color: #94a3b8; cursor: not-allowed; border-color: #f1f5f9; }

.section-toggle-btn { 
    background: #f8fafc; padding: 12px 16px; border-radius: 14px; 
    display: flex; justify-content: space-between; align-items: center; 
    cursor: pointer; font-weight: 700; color: var(--primary); 
    margin-bottom: 8px; border: 1px solid var(--border-color); 
}

.collapsible-content { display: none; padding: 8px 4px 12px; }

.btn-primary { 
    background: linear-gradient(135deg, var(--primary), var(--secondary)); 
    color: #fff; border: none; padding: 15px; border-radius: 16px; 
    width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; 
    box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
}

.btn-leave { 
    background: #f59e0b; color: #fff; border: none; padding: 14px; 
    border-radius: 16px; width: 100%; font-weight: 700; font-size: 15px;
    margin-bottom: 16px; display: flex; align-items: center; 
    justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
}

.leave-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat-box { padding: 12px 5px; border-radius: 14px; text-align: center; border: 1px solid rgba(0,0,0,0.03); }
.stat-box b { font-size: 16px; }

.leave-row { border-bottom: 1px solid #f1f5f9; }
.leave-row:last-child { border-bottom: none; }
.leave-info-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
.leave-info-date { font-size: 12px; color: var(--text-sub); }
.leave-info-request { font-size: 10px; color: var(--primary); font-weight: 600; margin-top: 4px; display: block; }

.status-badge { padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; display: inline-block; }
.status-pending { background: #fffbeb; color: #b45309; }
.status-approved { background: #ecfdf5; color: #047857; }
.status-rejected { background: #fef2f2; color: #b91c1c; }

/* ปุ่มแก้ไขและยกเลิกคำขอลา */
.action-btn-group { display: flex; gap: 6px; margin-top: 6px; }
.btn-edit-leave {
    background: #e0f2fe; color: #0369a1; border: none; 
    padding: 4px 10px; border-radius: 8px; font-size: 11px; 
    font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.btn-edit-leave:hover { background: #bae6fd; }

.btn-cancel-leave {
    background: #fee2e2; color: #ef4444; border: none; 
    padding: 4px 10px; border-radius: 8px; font-size: 11px; 
    font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.btn-cancel-leave:hover { background: #fca5a5; }

.modal { 
    display: none; position: fixed; z-index: 1000; left: 0; top: 0; 
    width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); 
    backdrop-filter: blur(8px); 
}
.modal-content { 
    background: #fff; margin: 15% auto; padding: 24px; 
    border-radius: 28px; width: 85%; max-width: 380px; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<div class="header"></div>

<div class="profile-section">
    <div class="profile-pic-container" onclick="document.getElementById('fileInput').click()">
        <img id="profilePreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
        <div class="change-pic-hint">📷</div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
    </div>
    <h2 id="displayName">ชื่อพนักงาน</h2>
    <p id="displayId">ID: -</p>
</div>

<div class="container">
    <div class="info-card">
        <div class="section-toggle-btn" onclick="toggleSection('personalContent', 'personalArrow')">
            <span>👤 ข้อมูลส่วนตัว</span>
            <span id="personalArrow">▼</span>
        </div>
        <div id="personalContent" class="collapsible-content">
            <div class="input-group"><label>รหัสพนักงาน</label><input type="text" id="employeeId" class="profile-input"></div>
            <div class="input-group"><label>เลขประจำตัวประชาชน</label><input type="text" id="idCard" class="profile-input"></div>
            <div class="input-group"><label>ชื่อ-นามสกุล</label><input type="text" id="fullName" class="profile-input"></div>
            <div style="display: flex; gap: 8px;">
                <div class="input-group" style="flex:1;"><label>ตำแหน่ง</label><input type="text" id="position" class="profile-input"></div>
                <div class="input-group" style="flex:1;"><label>แผนก</label><input type="text" id="department" class="profile-input"></div>
            </div>
            <div class="input-group"><label>วันเริ่มทำงาน</label><input type="date" id="startDateWork" class="profile-input"></div>
            <div class="input-group"><label>เบอร์โทรศัพท์</label><input type="tel" id="phone" class="profile-input"></div>
        </div>

        <div class="section-toggle-btn" onclick="toggleSection('addressContent', 'addressArrow')">
            <span>📍 ที่อยู่ปัจจุบัน</span>
            <span id="addressArrow">▼</span>
        </div>
        <div id="addressContent" class="collapsible-content">
            <div style="display: flex; gap: 8px;">
                <div class="input-group" style="flex:1;"><label>บ้านเลขที่</label><input type="text" id="addr_no" class="profile-input"></div>
                <div class="input-group" style="flex:1;"><label>หมู่ที่</label><input type="text" id="addr_moo" class="profile-input"></div>
            </div>
            <div class="input-group"><label>ตำบล/แขวง</label><input type="text" id="addr_subdistrict" class="profile-input"></div>
            <div class="input-group"><label>อำเภอ/เขต</label><input type="text" id="addr_district" class="profile-input"></div>
            <div class="input-group"><label>จังหวัด</label><input type="text" id="addr_province" class="profile-input"></div>
        </div>
        <button id="saveBtn" class="btn-primary" onclick="saveProfile()">💾 บันทึกและซิงค์ข้อมูลกลาง</button>
    </div>

    <button class="btn-leave" onclick="openModal()">📅 แจ้งลาหยุดงาน / ลาพักร้อน</button>

    <div class="info-card">
        <h3 style="margin: 0 0 15px; color: var(--primary); font-size: 16px; font-weight: 800;">📊 สถิติการลาปีนี้</h3>
        <div id="leaveStatsGrid" class="leave-stats"></div>
        <h3 style="margin: 15px 0 10px; color: var(--primary); font-size: 16px; font-weight: 800; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px;">📋 ประวัติล่าสุด</h3>
        <table style="width:100%; border-collapse: collapse;"><tbody id="leaveHistoryBody"></tbody></table>
    </div>
</div>

<div id="leaveModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">📝 แจ้งขอลาหยุด</h3>
        <div class="input-group"><label>ประเภทการลา</label><select id="leaveType"><option value="ลาป่วย">🤒 ลาป่วย</option><option value="ลากิจ">💼 ลากิจ</option><option value="ลาพักร้อน">🏖️ ลาพักร้อน</option></select></div>
        <div style="display: flex; gap: 8px;">
            <div class="input-group" style="flex:1;"><label>เริ่ม</label><input type="date" id="leaveStart"></div>
            <div class="input-group" style="flex:1;"><label>ถึง</label><input type="date" id="leaveEnd"></div>
        </div>
        <div class="input-group"><label>จำนวนวันลา</label><input type="number" id="leaveDays" step="0.5"></div>
        <div class="input-group"><label>เหตุผล</label><textarea id="leaveReason" rows="2"></textarea></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="btnSubmitLeave" class="btn-primary" onclick="submitLeave()" style="flex:2; margin:0;">ส่งคำขอลา</button>
            <button onclick="closeModal()" style="border:none; background:#f1f5f9; padding:14px; border-radius:14px; flex:1; font-weight:bold; color:#64748b; cursor:pointer;">ยกเลิก</button>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDEzU0P1EWgJgABEw3sJL54N5dq4dlVHJQ",
  authDomain: "hr-system-f9acc.firebaseapp.com",
  databaseURL: "https://hr-system-f9acc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hr-system-f9acc",
  storageBucket: "hr-system-f9acc.firebasestorage.app",
  messagingSenderId: "793271973867",
  appId: "1:793271973867:web:38bd510257d9d2bf500bae"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentQuota = { sick: 30, personal: 6, vacation: 10 };
let editTargetKey = null; 
let currentSlipId = null;  

function sendTelegramNotification(leaveData, isEditMode = false) {
    const telegramToken = "8427153199:AAH7QQ_WgqjPPd1RoHv9BRq2fHyVEnK_vcI"; 
    const chatId = "-1003946357713"; 
    const dept = document.getElementById('department').value || '-';
    
    const headerTitle = isEditMode ? `⚠️ [แก้ไขข้อมูลคำขอลา]\n🧾 *E-SLIP: ใบแจ้งขออนุมัติลาหยุด*` : `🧾 *E-SLIP: ใบแจ้งขออนุมัติลาหยุด*`;
    const slipId = isEditMode ? leaveData.slipId : Math.floor(100000 + Math.random() * 900000);

    const message = `${headerTitle}
═════════════════════
*รหัสอ้างอิง:* \`#REQ-${slipId}\`
*เวลาทำรายการ:* ${leaveData.requestTime || '-'}

👤 *ข้อมูลพนักงาน*
• *ชื่อ-สกุล:* ${leaveData.name}
• *รหัสพนักงาน:* \`${leaveData.empId}\`
• *แผนก:* ${dept}

📝 *รายละเอียดการลา*
• *ประเภท:* ${leaveData.type}
• *วันที่:* ${leaveData.startDate} ➔ ${leaveData.endDate}
• *จำนวน:* ${leaveData.days} วัน
• *เหตุผล:* ${leaveData.reason || '-'}

═════════════════════
*สถานะ:* ⏳ รอการอนุมัติจากผู้ดูแล`;

    fetch(`https://api.telegram.org/bot${telegramToken}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            chat_id: chatId,
            text: message,
            parse_mode: 'Markdown'
        })
    })
    .then(response => response.json())
    .catch(error => console.error('Fetch Error:', error));
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) { document.getElementById('profilePreview').src = e.target.result; };
        reader.readAsDataURL(file);
    }
}

function toggleSection(contentId, arrowId) {
    const content = document.getElementById(contentId);
    const arrow = document.getElementById(arrowId);
    content.style.display = (content.style.display === "block") ? "none" : "block";
    arrow.innerText = (content.style.display === "block") ? "▲" : "▼";
}

function lockInputs(isLocked) {
    const inputs = document.querySelectorAll('.profile-input');
    const saveBtn = document.getElementById('saveBtn');
    if (isLocked) {
        inputs.forEach(input => input.readOnly = true);
        if(saveBtn) saveBtn.style.display = 'none';
    }
}

function saveProfile() {
    const profile = {
        employeeId: document.getElementById('employeeId').value,
        idCard: document.getElementById('idCard').value,
        fullName: document.getElementById('fullName').value,
        position: document.getElementById('position').value,
        department: document.getElementById('department').value,
        startDateWork: document.getElementById('startDateWork').value,
        phone: document.getElementById('phone').value,
        addr_no: document.getElementById('addr_no').value,
        addr_moo: document.getElementById('addr_moo').value,
        addr_subdistrict: document.getElementById('addr_subdistrict').value,
        addr_district: document.getElementById('addr_district').value,
        addr_province: document.getElementById('addr_province').value,
        photo: document.getElementById('profilePreview').src
    };
    
    if(!profile.fullName || !profile.employeeId) return alert('กรุณากรอกรหัสและชื่อพนักงาน');
    
    db.ref('users/' + profile.employeeId).update(profile).then(() => {
        localStorage.setItem('employee_profile', JSON.stringify(profile));
        alert('✅ บันทึกและเชื่อมโยงข้อมูลสำเร็จ');
        location.reload();
    });
}

function submitLeave() {
    const empId = document.getElementById('employeeId').value;
    if(!empId) return alert('กรุณาระบุรหัสพนักงานก่อน');
    
    const now = new Date();
    const timestamp = now.toLocaleString('th-TH');
    const slipId = editTargetKey ? currentSlipId : Math.floor(100000 + Math.random() * 900000);

    const leaveRequestData = {
        id: Date.now(),
        empId: empId,
        name: document.getElementById('fullName').value,
        type: document.getElementById('leaveType').value,
        startDate: document.getElementById('leaveStart').value,
        endDate: document.getElementById('leaveEnd').value,
        days: document.getElementById('leaveDays').value,
        reason: document.getElementById('leaveReason').value,
        requestTime: timestamp,
        status: 'รอการอนุมัติ',
        slipId: slipId
    };

    if (editTargetKey) {
        db.ref('leaves/' + editTargetKey).update(leaveRequestData).then(() => {
            sendTelegramNotification(leaveRequestData, true);
            alert('✅ อัปเดตข้อมูลคำขอลาสำเร็จ!');
            closeModal();
        });
    } else {
        db.ref('leaves').push(leaveRequestData).then(() => {
            sendTelegramNotification(leaveRequestData, false);
            alert('ส่งใบลาสำเร็จ!');
            closeModal();
        });
    }
}

// 🟢 แก้ไขใหม่: ปลอดภัย 100% วิ่งไปคุยกับฐานข้อมูลผ่าน Key ป้องกันข้อความยาวทำหน้าจอค้าง
function openEditLeaveModal(key) {
    editTargetKey = key;
    
    db.ref('leaves/' + key).once('value').then(snap => {
        const r = snap.val();
        if(r) {
            currentSlipId = r.slipId || Math.floor(100000 + Math.random() * 900000);
            
            document.getElementById('modalTitle').innerText = "✏️ แก้ไขคำขอลาหยุด";
            document.getElementById('btnSubmitLeave').innerText = "อัปเดตคำขอลา";
            
            document.getElementById('leaveType').value = r.type;
            document.getElementById('leaveStart').value = r.startDate;
            document.getElementById('leaveEnd').value = r.endDate;
            document.getElementById('leaveDays').value = r.days;
            document.getElementById('leaveReason').value = r.reason || '';
            
            document.getElementById('leaveModal').style.display = 'block';
        }
    }).catch(err => {
        alert("ไม่สามารถดึงข้อมูลรายการลาได้: " + err.message);
    });
}

function cancelLeaveRequest(leaveFirebaseKey) {
    if(confirm("⚠️ คุณแน่ใจใช่ไหมว่าต้องการยกเลิกคำขอลาหยุดรายการนี้?")) {
        db.ref('leaves/' + leaveFirebaseKey).remove().then(() => {
            alert("✅ ยกเลิกคำขอลาสำเร็จ รายการถูกถอนออกจากระบบแล้ว");
        }).catch(err => {
            alert("เกิดข้อผิดพลาด: " + err.message);
        });
    }
}

function loadProfile() {
    const saved = JSON.parse(localStorage.getItem('employee_profile'));
    if(saved && saved.employeeId) {
        const empId = saved.employeeId;
        db.ref('users/' + empId).on('value', snap => {
            const val = snap.val();
            if(val) {
                document.getElementById('employeeId').value = val.employeeId || '';
                document.getElementById('fullName').value = val.fullName || '';
                document.getElementById('idCard').value = val.idCard || '';
                document.getElementById('position').value = val.position || '';
                document.getElementById('department').value = val.department || '';
                document.getElementById('startDateWork').value = val.startDateWork || ''; 
                document.getElementById('phone').value = val.phone || '';
                document.getElementById('addr_no').value = val.addr_no || '';
                document.getElementById('addr_moo').value = val.addr_moo || '';
                document.getElementById('addr_subdistrict').value = val.addr_subdistrict || '';
                document.getElementById('addr_district').value = val.addr_district || '';
                document.getElementById('addr_province').value = val.addr_province || '';
                if(val.photo) document.getElementById('profilePreview').src = val.photo;
                document.getElementById('displayName').innerText = val.fullName || 'ชื่อพนักงาน';
                document.getElementById('displayId').innerText = 'ID: ' + empId;
                
                currentQuota.sick = val.q_sick || 30;
                currentQuota.personal = val.q_personal || 6;
                currentQuota.vacation = val.q_vacation || 10;

                lockInputs(true);
            }
        });

        db.ref('leaves').orderByChild('empId').equalTo(empId).on('value', snap => {
            renderLeaveHistory(snap.val());
        });
    }
}

function renderLeaveHistory(data) {
    const body = document.getElementById('leaveHistoryBody');
    body.innerHTML = "";
    
    const stats = { sick: 0, personal: 0, vacation: 0 };
    if(data) {
        const keys = Object.keys(data).reverse();
        
        keys.forEach(key => {
            const r = data[key];
            if(r.status === 'อนุมัติ') {
                if(r.type === 'ลาป่วย') stats.sick += parseFloat(r.days || 0);
                if(r.type === 'ลากิจ') stats.personal += parseFloat(r.days || 0);
                if(r.type === 'ลาพักร้อน') stats.vacation += parseFloat(r.days || 0);
            }
            
            // 🟢 แก้ไขใหม่: ส่งไปแค่ key ตัวเดียว ปลอดภัย ไม่มีค้างแน่นอน
            let actionButtonsHtml = "";
            if(r.status === 'รอการอนุมัติ') {
                actionButtonsHtml = `
                <div class="action-btn-group">
                    <button class="btn-edit-leave" onclick="openEditLeaveModal('${key}')">✏️ แก้ไข</button>
                    <button class="btn-cancel-leave" onclick="cancelLeaveRequest('${key}')">❌ ยกเลิก</button>
                </div>`;
            }
            
            body.innerHTML += `<tr class="leave-row">
                <td style="padding:15px 5px;">
                    <span class="leave-info-title">${r.type} (${r.days} วัน)</span><br>
                    <span class="leave-info-date">🗓️ ${r.startDate} ถึง ${r.endDate}</span><br>
                    <span class="leave-info-request">🕒 ทำรายการเมื่อ: ${r.requestTime || '-'}</span>
                    ${actionButtonsHtml}
                </td>
                <td style="text-align:right; vertical-align:top; padding-top:15px;"><span class="status-badge ${r.status==='อนุมัติ'?'status-approved':(r.status==='ไม่อนุมัติ'?'status-rejected':'status-pending')}">${r.status}</span></td>
            </tr>`;
        });
    }
    updateStatsView(stats);
}

function updateStatsView(stats) {
    document.getElementById('leaveStatsGrid').innerHTML = `
        <div style="background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 12px; text-align: center;">
            <div style="color: #0284c7; font-size: 11px; font-weight: bold;">🤒 ลาป่วย</div>
            <div style="font-size: 18px; font-weight: 800; color: #0284c7; margin: 5px 0;">
                <span style="font-size:24px;">${stats.sick}</span><span style="font-size:12px; color:#aaa;"> / ใช้</span>
            </div>
            <div style="background: #e0f2fe; color: #0284c7; font-size: 10px; padding: 3px; border-radius: 20px; font-weight: bold;">
                เหลือ ${currentQuota.sick - stats.sick}
            </div>
        </div>
        <div style="background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 12px; text-align: center;">
            <div style="color: #b45309; font-size: 11px; font-weight: bold;">💼 ลากิจ</div>
            <div style="font-size: 18px; font-weight: 800; color: #b45309; margin: 5px 0;">
                <span style="font-size:24px;">${stats.personal}</span><span style="font-size:12px; color:#aaa;"> / ใช้</span>
            </div>
            <div style="background: #fef3c7; color: #b45309; font-size: 10px; padding: 3px; border-radius: 20px; font-weight: bold;">
                เหลือ ${currentQuota.personal - stats.personal}
            </div>
        </div>
        <div style="background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 12px; text-align: center;">
            <div style="color: #166534; font-size: 11px; font-weight: bold;">🏖️ พักร้อน</div>
            <div style="font-size: 18px; font-weight: 800; color: #166534; margin: 5px 0;">
                <span style="font-size:24px;">${stats.vacation}</span><span style="font-size:12px; color:#aaa;"> / ใช้</span>
            </div>
            <div style="background: #dcfce3; color: #166534; font-size: 10px; padding: 3px; border-radius: 20px; font-weight: bold;">
                เหลือ ${currentQuota.vacation - stats.vacation}
            </div>
        </div>
    `;
}

function openModal() { 
    editTargetKey = null; 
    currentSlipId = null;
    document.getElementById('modalTitle').innerText = "📝 แจ้งขอลาหยุด";
    document.getElementById('btnSubmitLeave').innerText = "ส่งคำขอลา";
    
    document.getElementById('leaveStart').value = "";
    document.getElementById('leaveEnd').value = "";
    document.getElementById('leaveDays').value = "";
    document.getElementById('leaveReason').value = "";
    
    document.getElementById('leaveModal').style.display = 'block'; 
}

function closeModal() { document.getElementById('leaveModal').style.display = 'none'; }
window.onload = loadProfile;
</script>
