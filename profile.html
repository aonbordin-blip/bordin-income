<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile -Employee Profile</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================
           ✨ ดีไซน์ Dark Glassmorphic สไตล์ดึงดูดสายตา (โค้ดฐานเดิมของเตง)
           ========================================== */
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #0ea5e9;
            --accent: #f43f5e;
            --success: #10b981;
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --input-bg: rgba(15, 23, 42, 0.6);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; position: relative; }

        /* 🪐 พื้นหลังแอนิเมชันวงกลม */
        .background-decor { position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: 1; pointer-events: none; }
        .circle { position: absolute; border-radius: 50%; background: linear-gradient(135deg, rgba(79, 70, 229, 0.15) 0%, rgba(14, 165, 233, 0.15) 100%); backdrop-filter: blur(80px); animation: floatAnimation 8s infinite ease-in-out; }
        .circle-1 { width: 400px; height: 400px; top: -10%; left: -10%; animation-delay: 0s; }
        .circle-2 { width: 500px; height: 500px; bottom: -15%; right: -5%; animation-delay: 2s; background: linear-gradient(135deg, rgba(14, 165, 233, 0.15) 0%, rgba(244, 63, 94, 0.12) 100%); }
        @keyframes floatAnimation { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.03); } }

        /* 📱💻 Layout */
        .wrapper { position: relative; z-index: 10; width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 16px 24px; border-radius: 20px; margin-bottom: 24px; backdrop-filter: blur(10px); box-shadow: var(--shadow); }
        .navbar-brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
        .navbar-brand i { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); padding: 10px; border-radius: 12px; color: white; font-size: 18px; }
        
        .btn-logout { background: rgba(244, 63, 94, 0.2); border: 1px solid rgba(244, 63, 94, 0.3); color: #fca5a5; padding: 8px 16px; border-radius: 12px; cursor: pointer; font-weight: 500; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-logout:hover { background: var(--accent); color: white; transform: translateY(-2px); }

        .main-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media (min-width: 992px) { .main-grid { grid-template-columns: 450px 1fr; } }

        .glass-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px 24px; backdrop-filter: blur(15px); box-shadow: var(--shadow); }

        /* ฝั่งซ้าย: โปรไฟล์ */
        .profile-widget { text-align: center; }
        .avatar-container { position: relative; width: 120px; height: 120px; margin: 0 auto 15px; cursor: pointer; }
        .avatar-preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--glass-border); background: var(--input-bg); transition: 0.3s; }
        .avatar-container:hover .avatar-preview { transform: scale(1.05); }
        .avatar-hint { position: absolute; bottom: 0; right: 0; background: var(--primary); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 3px solid #0f172a; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .section-header { font-size: 16px; font-weight: 600; color: var(--secondary); margin: 25px 0 15px; text-align: left; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; }
        
        .form-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .form-row > div { flex: 1; text-align: left; }
        
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; padding-left: 4px; }
        
        .input-wrapper input, .input-wrapper textarea { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); font-size: 14.5px; outline: none; transition: 0.3s; }
        .input-wrapper input:focus, .input-wrapper textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25); }
        .input-wrapper input:read-only, .input-wrapper textarea:read-only { background: rgba(255, 255, 255, 0.02); color: #94a3b8; cursor: not-allowed; border-color: transparent; }

        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; border-radius: 14px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45); }

        /* ฝั่งขวา: โควต้า & ประวัติ */
        .right-layout { display: flex; flex-direction: column; gap: 24px; }
        .section-title { margin: 0 0 16px 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }

        .quota-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 576px) { .quota-grid { grid-template-columns: repeat(3, 1fr); } }
        .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; text-align: center; position: relative; overflow: hidden; transition: 0.3s; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .stat-card.stat-sick::before { background: var(--primary); }
        .stat-card.stat-personal::before { background: var(--warning); }
        .stat-card.stat-vacation::before { background: var(--success); }
        .stat-label { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; font-weight: 500; }
        .stat-count { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .stat-count small { font-size: 12px; font-weight: 400; color: var(--text-sub); margin-left: 2px; }
        .stat-remaining { font-size: 11.5px; padding: 4px 10px; border-radius: 20px; display: inline-block; background: rgba(255,255,255,0.05); }

        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .btn-leave-trigger { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3); }
        .btn-leave-trigger:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(217, 119, 6, 0.45); }

        .history-list { display: flex; flex-direction: column; gap: 12px; max-height: 450px; overflow-y: auto; padding-right: 4px; }
        .history-list::-webkit-scrollbar { width: 6px; } .history-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        
        .history-item { background: rgba(15, 23, 42, 0.4); border: 1px solid var(--glass-border); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: flex-start; transition: 0.2s; gap: 10px; }
        .history-info-main { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .history-info-sub { font-size: 12.5px; color: var(--text-sub); margin-bottom: 4px; }
        
        .status-badge { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; display: inline-block; text-align: center; white-space: nowrap; }
        .status-pending { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
        .status-approved { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .status-rejected { background: rgba(244, 63, 94, 0.15); color: #f87171; }

        .action-btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn-edit-leave, .btn-cancel-leave { border: 1px solid transparent; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.05); color: var(--text-main); }
        .btn-edit-leave:hover { border-color: var(--secondary); color: var(--secondary); }
        .btn-cancel-leave:hover { border-color: var(--accent); color: var(--accent); }

        /* Modal แจ้งลา */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-content { background: #1e293b; border: 1px solid var(--glass-border); width: 100%; max-width: 420px; border-radius: 24px; padding: 25px; box-shadow: var(--shadow); animation: modalFade 0.3s ease; }
        @keyframes modalFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-content h3 { margin: 0 0 20px 0; font-size: 18px; font-weight: 600; text-align: center; }
        .btn-secondary { flex: 1; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); cursor: pointer; font-weight: 500; }

        /* =========================================
           ✨ จัด Layout ฟอร์มข้อมูลส่วนตัว (2 คอลัมน์ ล็อคตายตัวแม้บนมือถือ)
           ========================================= */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .form-grid .form-group {
            margin-bottom: 0; 
        }
        .form-grid-full {
            grid-column: span 2;
        }

        /* ==========================================
           📱 ศัลยกรรมดีไซน์บนอุปกรณ์พกพา (Mobile Responsive)
           ========================================== */
        @media (max-width: 768px) {
            .wrapper { padding: 16px 12px; }
            .main-grid { gap: 16px; }
            .glass-card { padding: 20px 16px; border-radius: 20px; }
            
            /* 📊 โควตาเรียง 3 คอลัมน์บนมือถือ */
            .quota-grid { 
                grid-template-columns: repeat(3, 1fr) !important; 
                gap: 8px !important; 
            }
            .stat-card { 
                padding: 12px 6px !important; 
                border-radius: 14px !important;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .stat-label { 
                font-size: 11px !important; 
                white-space: nowrap; 
                text-align: center;
                margin-bottom: 2px !important;
            }
            .stat-count { 
                font-size: 20px !important; 
                text-align: center;
                margin: 2px 0 !important;
            }
            .stat-count small { 
                font-size: 10px !important; 
            }
            .stat-remaining { 
                font-size: 10px !important; 
                text-align: center;
                padding: 2px 8px !important;
                border-radius: 12px !important;
                margin-top: 4px !important;
            }
            .history-item { flex-direction: column; }
            .status-badge { align-self: flex-start; }
        }
    </style>
</head>
<body>

<div class="background-decor">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
</div>

<div class="wrapper">
    <header class="navbar">
        <div class="navbar-brand"><i class="fa-solid fa-fingerprint"></i> <span>Employee Profile</span></div>
        <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> ออกจากระบบ</button>
    </header>

    <main class="main-grid">
        <section class="glass-card profile-widget">
            <div class="avatar-container" onclick="if(!isLockedProfile) document.getElementById('fileInput').click()">
                <img id="profilePreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" class="avatar-preview">
                <div class="avatar-hint" id="picHint"><i class="fa-solid fa-camera"></i></div>
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
            </div>
            
            <h3 style="margin: 0 0 4px 0; font-size: 22px;" id="displayName">ยังไม่ได้ตั้งชื่อ</h3>
            <p style="margin: 0 0 10px 0; font-size: 13px; color: var(--primary);" id="displayId">รอการกรอกประวัติ</p>

            <div class="section-header"><i class="fa-solid fa-user-pen"></i> ข้อมูลส่วนตัว (กรอกก่อนใช้งาน)</div>
            
            <div class="form-grid">
                <div class="form-group form-grid-full"><label>รหัสพนักงาน (ID ของจริง)</label><div class="input-wrapper"><input type="text" id="employeeId" class="profile-input"></div></div>
                <div class="form-group form-grid-full"><label>เลขประจำตัวประชาชน</label><div class="input-wrapper"><input type="text" id="idCard" class="profile-input" maxlength="13"></div></div>
                <div class="form-group form-grid-full"><label>ชื่อ-นามสกุล</label><div class="input-wrapper"><input type="text" id="fullName" class="profile-input"></div></div>
                <div class="form-group"><label>ตำแหน่ง</label><div class="input-wrapper"><input type="text" id="position" class="profile-input"></div></div>
                <div class="form-group"><label>แผนก</label><div class="input-wrapper"><input type="text" id="department" class="profile-input"></div></div>
                <div class="form-group"><label>วันเริ่มทำงาน</label><div class="input-wrapper"><input type="date" id="startDateWork" class="profile-input"></div></div>
                <div class="form-group"><label>เบอร์โทรศัพท์</label><div class="input-wrapper"><input type="tel" id="phone" class="profile-input"></div></div>
            </div>

            <div class="section-header"><i class="fa-solid fa-map-location-dot"></i> ที่อยู่ปัจจุบัน</div>
            <div class="form-grid">
                <div class="form-group"><label>บ้านเลขที่</label><div class="input-wrapper"><input type="text" id="addr_no" class="profile-input"></div></div>
                <div class="form-group"><label>หมู่ที่</label><div class="input-wrapper"><input type="text" id="addr_moo" class="profile-input"></div></div>
                <div class="form-group form-grid-full"><label>ตำบล/แขวง</label><div class="input-wrapper"><input type="text" id="addr_subdistrict" class="profile-input"></div></div>
                <div class="form-group"><label>อำเภอ/เขต</label><div class="input-wrapper"><input type="text" id="addr_district" class="profile-input"></div></div>
                <div class="form-group"><label>จังหวัด</label><div class="input-wrapper"><input type="text" id="addr_province" class="profile-input"></div></div>
            </div>

            <button id="saveBtn" class="btn-primary" onclick="saveProfile()" style="margin-top: 20px;">
                <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูลและยืนยัน (ล็อคข้อมูล)
            </button>
        </section>

        <section class="right-layout">
            
            <div class="glass-card">
                <h3 class="section-title"><i class="fa-solid fa-chart-pie" style="color:var(--primary)"></i> สถิติการลาปีนี้</h3>
                <div class="quota-grid" id="leaveStatsGrid">
                </div>
            </div>

            <div class="glass-card">
                <div class="history-header">
                    <h3 class="section-title" style="margin:0;"><i class="fa-solid fa-clock-rotate-left" style="color:var(--secondary)"></i> ประวัติการลาล่าสุด</h3>
                    <button class="btn-leave-trigger" onclick="openModal()">
                        <i class="fa-regular fa-calendar-plus"></i> แจ้งลาหยุดงาน
                    </button>
                </div>
                <div class="history-list" id="leaveHistoryBody">
                </div>
            </div>

        </section>
    </main>
</div>

<div class="modal" id="leaveModal">
    <div class="modal-content">
        <h3 id="modalTitle">📝 แจ้งขอลาหยุด</h3>
        
        <div class="form-group"><label>ประเภทการลา</label>
            <div class="input-wrapper">
                <select id="leaveType" style="width:100%; padding:12px; border-radius:12px; background:var(--input-bg); color:#fff; border:1px solid var(--glass-border);">
                    <option value="ลาป่วย">🤒 ลาป่วย</option>
                    <option value="ลากิจ">💼 ลากิจ</option>
                    <option value="ลาพักร้อน">🏖️ ลาพักร้อน</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div><label>เริ่ม</label><div class="input-wrapper"><input type="date" id="leaveStart"></div></div>
            <div><label>ถึง</label><div class="input-wrapper"><input type="date" id="leaveEnd"></div></div>
        </div>
        <div class="form-group"><label>จำนวนวันลา</label><div class="input-wrapper"><input type="number" id="leaveDays" step="0.5" placeholder="เช่น 1 หรือ 0.5"></div></div>
        <div class="form-group"><label>เหตุผลการลา</label><div class="input-wrapper"><textarea id="leaveReason" rows="2" placeholder="ระบุเหตุผลความจำเป็น..."></textarea></div></div>
        
        <div style="display: flex; gap: 10px; margin-top: 24px;">
            <button class="btn-secondary" onclick="closeModal()">ยกเลิก</button>
            <button class="btn-primary" id="btnSubmitLeave" onclick="submitLeave()" style="margin:0; flex:2;">ส่งคำขอลา</button>
        </div>
    </div>
</div>

<script>
    const loggedInUserId = localStorage.getItem("loggedInUserId");
    if (!loggedInUserId) { window.location.href = "login_profile.html"; }

    const firebaseConfig = {
        apiKey: "AIzaSyDEzU0P1EWgJgABEw3sJL54N5dq4dlVHJQ",
        authDomain: "hr-system-f9acc.firebaseapp.com",
        databaseURL: "https://hr-system-f9acc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "hr-system-f9acc",
        storageBucket: "hr-system-f9acc.firebasestorage.app",
        messagingSenderId: "793271973867",
        appId: "1:793271973867:web:38bd510257d9d2bf500bae"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentQuota = { sick: 30, personal: 6, vacation: 10 };
    let editTargetKey = null; 
    let currentSlipId = null;  
    let isLockedProfile = false; 

    function sendTelegramNotification(leaveData) {
        const token = "8427153199:AAH7QQ_WgqjPPd1RoHv9BRq2fHyVEnK_vcI"; 
        let chatId = "-1003972124668"; 
        const userTeam = (leaveData.team || "").trim().toUpperCase();
        if (userTeam.includes("TEAM C") || userTeam.includes("ทีม C")) { chatId = "-1003946357713"; }

        const slipMessage = `📄 *E-SLIP : ใบแจ้งขออนุมัติลาหยุด*\n────────────────────────\n` +
                            `🔹 *รหัสอ้างอิง:* #REQ-${leaveData.slipId}\n🕒 *เวลาทำรายการ:* ${leaveData.requestTime}\n\n` +
                            `👤 *ข้อมูลพนักงานผู้ยื่นเรื่อง*\n▫️ *ชื่อ-นามสกุล:* ${leaveData.name}\n` +
                            `▫️ *รหัสพนักงาน:* ${leaveData.empId}\n▫️ *แผนก/ทีม:* ${leaveData.team}\n\n` +
                            `📝 *รายละเอียดการลาหยุดงาน*\n▫️ *ประเภทการลา:* ${leaveData.type}\n` +
                            `▫️ *วันที่ระบุ:* ${leaveData.startDate} ➔ ${leaveData.endDate}\n` +
                            `▫️ *จำนวนวันลา:* ${leaveData.days} วันทำการ\n` +
                            `▫️ *เหตุผลความจำเป็น:* "${leaveData.reason || "ไม่ได้ระบุสาเหตุ"}"\n` +
                            `────────────────────────\n⏳ *สถานะ:* รอการอนุมัติจากผู้ดูแลระบบ`;

        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: slipMessage, parse_mode: 'Markdown' })
        }).catch(err => console.error('Telegram Fetch Error:', err));
    }

    function sendLineNotification(leaveData) {
        const gasAppUrl = "https://script.google.com/macros/s/AKfycby0kL00jnepsZfujU93PHLtAwU9_1vLr0PdLqUjU5dP81G-tSeetBA93iVtc4_xLkn6ag/exec"; 
        const payload = {
            action: "send_line_update",
            leaveData: {
                slipId: leaveData.slipId, name: leaveData.name, empId: leaveData.empId,
                type: leaveData.type, days: leaveData.days, startDate: leaveData.startDate,
                endDate: leaveData.endDate, reason: leaveData.reason || "ไม่ได้ระบุสาเหตุ",
                team: leaveData.team || "ทั่วไป" 
            },
            newStatus: "รอการอนุมัติ"
        };
        fetch(gasAppUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
        .catch(err => console.error('LINE Error:', err));
    }

    function handleImageUpload(event) {
        if(isLockedProfile) return;
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) { document.getElementById('profilePreview').src = e.target.result; };
            reader.readAsDataURL(file);
        }
    }

    function lockInputs(isLocked) {
        isLockedProfile = isLocked;
        const inputs = document.querySelectorAll('.profile-input');
        const saveBtn = document.getElementById('saveBtn');
        const picHint = document.getElementById('picHint');
        
        if (isLocked) {
            inputs.forEach(input => input.readOnly = true);
            if(saveBtn) saveBtn.style.display = 'none'; 
            if(picHint) picHint.style.display = 'none'; 
        } else {
            inputs.forEach(input => input.readOnly = false);
            if(saveBtn) saveBtn.style.display = 'flex';
            if(picHint) picHint.style.display = 'flex';
        }
    }

    function saveProfile() {
        const profile = {
            employeeId: document.getElementById('employeeId').value,
            idCard: document.getElementById('idCard').value,
            fullName: document.getElementById('fullName').value,
            position: document.getElementById('position').value,
            department: document.getElementById('department').value,
            startDateWork: document.getElementById('startDateWork').value,
            phone: document.getElementById('phone').value,
            addr_no: document.getElementById('addr_no').value,
            addr_moo: document.getElementById('addr_moo').value,
            addr_subdistrict: document.getElementById('addr_subdistrict').value,
            addr_district: document.getElementById('addr_district').value,
            addr_province: document.getElementById('addr_province').value,
            photo: document.getElementById('profilePreview').src,
            isProfileLocked: true
        };
        
        if(!profile.employeeId || !profile.fullName || !profile.idCard) {
            return alert('กรุณากรอก รหัสพนักงาน, ชื่อ-สกุล และ เลขบัตรปชช. ให้ครบถ้วน!');
        }
        
        if(confirm("ตรวจสอบความถูกต้องให้ดี หากบันทึกแล้วจะไม่สามารถแก้ไขประวัติได้อีก ยืนยันการบันทึกหรือไม่?")) {
            db.ref('users/' + loggedInUserId).update(profile).then(() => {
                alert('✅ บันทึกข้อมูลและเชื่อมโยงระบบสำเร็จ');
                location.reload();
            });
        }
    }

    function loadProfile() {
        if(loggedInUserId) {
            db.ref('users/' + loggedInUserId).on('value', snap => {
                const val = snap.val();
                if(val) {
                    document.getElementById('employeeId').value = val.employeeId || '';
                    document.getElementById('fullName').value = val.fullName || '';
                    document.getElementById('idCard').value = val.idCard || '';
                    document.getElementById('position').value = val.position || '';
                    document.getElementById('department').value = val.department || '';
                    document.getElementById('startDateWork').value = val.startDateWork || ''; 
                    document.getElementById('phone').value = val.phone || '';
                    document.getElementById('addr_no').value = val.addr_no || '';
                    document.getElementById('addr_moo').value = val.addr_moo || '';
                    document.getElementById('addr_subdistrict').value = val.addr_subdistrict || '';
                    document.getElementById('addr_district').value = val.addr_district || '';
                    document.getElementById('addr_province').value = val.addr_province || '';
                    if(val.photo) document.getElementById('profilePreview').src = val.photo;
                    
                    document.getElementById('displayName').innerText = val.fullName || 'กรุณากรอกชื่อของคุณ';
                    document.getElementById('displayId').innerText = (val.employeeId) ? 'ID: ' + val.employeeId : 'ยังไม่มี ID';
                    
                    currentQuota.sick = val.q_sick || 30;
                    currentQuota.personal = val.q_personal || 6;
                    currentQuota.vacation = val.q_vacation || 10;
                    
                    if (val.isProfileLocked === true) lockInputs(true);
                    else lockInputs(false);
                }
            });
            db.ref('leaves').orderByChild('userId').equalTo(loggedInUserId).on('value', snap => renderLeaveHistory(snap.val()));
        }
    }

    function renderLeaveHistory(data) {
        const body = document.getElementById('leaveHistoryBody');
        body.innerHTML = "";
        const stats = { sick: 0, personal: 0, vacation: 0 };
        
        if(data) {
            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const r = data[key];
                if(r.status === 'อนุมัติ') {
                    if(r.type === 'ลาป่วย') stats.sick += parseFloat(r.days || 0);
                    if(r.type === 'ลากิจ') stats.personal += parseFloat(r.days || 0);
                    if(r.type === 'ลาพักร้อน') stats.vacation += parseFloat(r.days || 0);
                }
                
                let actionButtonsHtml = "";
                if(r.status === 'รอการอนุมัติ') {
                    actionButtonsHtml = `
                    <div class="action-btn-group">
                        <button class="btn-edit-leave" onclick="openEditLeaveModal('${key}')"><i class="fa-solid fa-pen"></i> แก้ไข</button>
                        <button class="btn-cancel-leave" onclick="cancelLeaveRequest('${key}')"><i class="fa-solid fa-trash"></i> ยกเลิก</button>
                    </div>`;
                }
                
                const statusClass = r.status === 'อนุมัติ' ? 'status-approved' : (r.status === 'ไม่อนุมัติ' ? 'status-rejected' : 'status-pending');
                const typeIcon = r.type === 'ลาป่วย' ? '🤒' : (r.type === 'ลากิจ' ? '💼' : '🏖️');

                body.innerHTML += `
                <div class="history-item">
                    <div style="flex: 1;">
                        <div class="history-info-main">${typeIcon} ${r.type} <span>(${r.days} วัน)</span></div>
                        <div class="history-info-sub"><i class="fa-regular fa-calendar"></i> ${r.startDate} ถึง ${r.endDate}</div>
                        <div class="history-info-sub" style="font-size:11px; opacity:0.7;">🕒 ร้องขอ: ${r.requestTime || '-'}</div>
                        ${actionButtonsHtml}
                    </div>
                    <div><span class="status-badge ${statusClass}">${r.status}</span></div>
                </div>`;
            });
        } else {
            body.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 30px;">ไม่มีข้อมูลประวัติการทำรายการลาค่ะ</div>`;
        }
        updateStatsView(stats);
    }

    function updateStatsView(stats) {
        document.getElementById('leaveStatsGrid').innerHTML = `
            <div class="stat-card stat-sick">
                <div class="stat-label">🤒 ลาป่วย</div>
                <div class="stat-count">${stats.sick}<small>/ใช้</small></div>
                <div class="stat-remaining">เหลือ ${currentQuota.sick - stats.sick} วัน</div>
            </div>
            <div class="stat-card stat-personal">
                <div class="stat-label">💼 ลากิจ</div>
                <div class="stat-count">${stats.personal}<small>/ใช้</small></div>
                <div class="stat-remaining">เหลือ ${currentQuota.personal - stats.personal} วัน</div>
            </div>
            <div class="stat-card stat-vacation">
                <div class="stat-label">🏖️ พักร้อน</div>
                <div class="stat-count">${stats.vacation}<small>/ใช้</small></div>
                <div class="stat-remaining">เหลือ ${currentQuota.vacation - stats.vacation} วัน</div>
            </div>
        `;
    }

    function submitLeave() {
        const empId = document.getElementById('employeeId').value;
        if(!empId || !isLockedProfile) return alert('กรุณาระบุข้อมูลส่วนตัวและกดบันทึกให้เรียบร้อยก่อน');
        
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const yearTh = now.getFullYear() + 543;
        const timeStr = now.toTimeString().split(' ')[0];
        const timestamp = `${day}/${month}/${yearTh} ${timeStr}`;

        const slipId = editTargetKey ? currentSlipId : Math.floor(100000 + Math.random() * 900000);
        const dept = document.getElementById('department').value || "ทั่วไป"; 

        const leaveRequestData = {
            id: Date.now(),
            userId: loggedInUserId, 
            empId: empId,
            name: document.getElementById('fullName').value,
            type: document.getElementById('leaveType').value,
            startDate: document.getElementById('leaveStart').value,
            endDate: document.getElementById('leaveEnd').value,
            days: document.getElementById('leaveDays').value,
            reason: document.getElementById('leaveReason').value,
            requestTime: timestamp,
            status: 'รอการอนุมัติ',
            slipId: slipId,
            team: dept 
        };

        if (editTargetKey) {
            db.ref('leaves/' + editTargetKey).update(leaveRequestData).then(() => {
                sendLineNotification(leaveRequestData); 
                sendTelegramNotification(leaveRequestData); 
                alert('✅ อัปเดตข้อมูลคำขอลาสำเร็จ!');
                closeModal();
            });
        } else {
            db.ref('leaves').push(leaveRequestData).then(() => {
                sendLineNotification(leaveRequestData); 
                sendTelegramNotification(leaveRequestData); 
                alert('🚀 ส่งใบลาสำเร็จ! รอการตรวจสอบนะคะ');
                closeModal();
            });
        }
    }

    function openEditLeaveModal(key) {
        editTargetKey = key;
        db.ref('leaves/' + key).once('value').then(snap => {
            const r = snap.val();
            if(r) {
                currentSlipId = r.slipId || Math.floor(100000 + Math.random() * 900000);
                document.getElementById('modalTitle').innerText = "✏️ แก้ไขคำขอลาหยุด";
                document.getElementById('btnSubmitLeave').innerText = "อัปเดตคำขอลา";
                document.getElementById('leaveType').value = r.type;
                document.getElementById('leaveStart').value = r.startDate;
                document.getElementById('leaveEnd').value = r.endDate;
                document.getElementById('leaveDays').value = r.days;
                document.getElementById('leaveReason').value = r.reason || '';
                document.getElementById('leaveModal').style.display = 'flex';
            }
        });
    }

    function cancelLeaveRequest(leaveFirebaseKey) {
        if(confirm("⚠️ คุณแน่ใจใช่ไหมว่าต้องการยกเลิกคำขอลาหยุดรายการนี้?")) {
            db.ref('leaves/' + leaveFirebaseKey).remove().then(() => {
                alert("✅ ยกเลิกคำขอลาสำเร็จ รายการถูกถอนออกจากระบบแล้ว");
            });
        }
    }

    function openModal() { 
        if(!isLockedProfile) return alert("⚠️ กรุณากรอกข้อมูลส่วนตัวและกดบันทึกให้เรียบร้อยก่อนทำการแจ้งลานะคะ");
        editTargetKey = null; 
        currentSlipId = null;
        document.getElementById('modalTitle').innerText = "📝 แจ้งขอลาหยุดงาน";
        document.getElementById('btnSubmitLeave').innerText = "ส่งคำขอลา";
        document.getElementById('leaveType').selectedIndex = 0;
        document.getElementById('leaveStart').value = "";
        document.getElementById('leaveEnd').value = "";
        document.getElementById('leaveDays').value = "";
        document.getElementById('leaveReason').value = "";
        document.getElementById('leaveModal').style.display = 'flex'; 
    }
    function closeModal() { document.getElementById('leaveModal').style.display = 'none'; }
    window.onclick = function(e) { if(e.target == document.getElementById('leaveModal')) closeModal(); }

    function logout() {
        if (confirm("🚪 ต้องการออกจากระบบใช่หรือไม่?")) {
            localStorage.removeItem("loggedInUserId");
            window.location.href = "login_profile.html";
        }
    }

    window.onload = loadProfile;
</script>

</body>
</html>
