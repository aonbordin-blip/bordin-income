<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - ✓Record Income</title>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
:root {
    --primary: #6366f1;
    --secondary: #06b6d4;
    --bg: #f8fafc;
    --white: #ffffff;
    --text-main: #1e293b;
    --text-sub: #64748b;
    --border-color: #f1f5f9;
    --shadow-soft: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    --shadow-card: 0 10px 15px -3px rgb(0 0 0 / 0.05);
}

body { 
    margin: 0; 
    font-family: 'Inter', 'Segoe UI', sans-serif; 
    background: var(--bg); 
    color: var(--text-main); 
    padding-bottom: 50px; 
}

.header { 
    background: linear-gradient(135deg, var(--primary), var(--secondary)); 
    color: #fff; 
    padding: 30px 20px 60px; 
    text-align: center;
    border-radius: 0 0 40px 40px;
    position: relative;
}

.profile-pic-wrapper {
    position: relative;
    width: 110px;
    height: 110px;
    margin: 0 auto -55px;
    z-index: 10;
}

#profilePreview {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    border: 4px solid var(--white); background: #f1f5f9;
    box-shadow: var(--shadow-card);
}

.container { padding: 70px 20px 20px; max-width: 500px; margin: auto; }

.card {
    background: var(--white); padding: 24px; border-radius: 24px;
    box-shadow: var(--shadow-card); margin-bottom: 20px;
    border: 1px solid var(--border-color);
}

.input-group { margin-bottom: 18px; }
.input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
.input-group input, .input-group select, .input-group textarea {
    width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 12px;
    box-sizing: border-box; font-size: 15px; background: #fcfdfe; transition: all 0.2s;
}
.input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }

.btn-primary {
    background: var(--primary); color: white; border: none; padding: 16px; width: 100%;
    border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transition: transform 0.2s;
}
.btn-primary:active { transform: scale(0.98); }

.leave-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
.stat-box { text-align: center; padding: 12px; border-radius: 16px; font-size: 12px; }

.status-badge { padding: 4px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; }
.status-pending { background: #fffbeb; color: #92400e; }
.status-approved { background: #f0fdf4; color: #166534; }
.status-rejected { background: #fef2f2; color: #991b1b; }

.modal {
    display: none; position: fixed; z-index: 100; left: 0; top: 0;
    width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
}
.modal-content {
    background: #fff; margin: 15% auto; padding: 28px;
    width: 85%; max-width: 400px; border-radius: 28px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
}
</style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; font-weight: 800; letter-spacing: -0.5px;">My Profile</h2>
    <p style="margin:5px 0 0; font-size: 13px; opacity: 0.9;">จัดการข้อมูลพนักงานและการลา</p>
</div>

<div class="profile-pic-wrapper">
    <img id="profilePreview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    <input type="file" id="photoInput" style="display:none" accept="image/*" onchange="previewImage(event)">
    <div onclick="document.getElementById('photoInput').click()" style="position:absolute; bottom:0; right:0; background:var(--primary); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid #fff; cursor:pointer; color:white; font-size:14px;">📷</div>
</div>

<div class="container">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0; font-size:18px; color:var(--text-main);">👤 ข้อมูลส่วนตัว</h3>
            <span id="saveStatus" style="font-size:11px; color:var(--primary); font-weight:bold;"></span>
        </div>
        
        <div class="input-group">
            <label>รหัสพนักงาน</label>
            <input type="text" id="employeeId" placeholder="ระบุรหัสพนักงาน เช่น EMP001">
        </div>
        <div class="input-group">
            <label>ชื่อ-นามสกุล</label>
            <input type="text" id="fullName">
        </div>
        <div class="input-group">
            <label>ตำแหน่ง</label>
            <input type="text" id="position">
        </div>
        <div class="input-group">
            <label>แผนก</label>
            <input type="text" id="department">
        </div>
        <div class="input-group">
            <label>วันเริ่มทำงาน</label>
            <input type="date" id="startDateWork">
        </div>
        <button class="btn-primary" onclick="updateProfile()">บันทึกโปรไฟล์</button>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:0 4px;">
        <h3 style="margin:0; font-size:18px; color:var(--text-main);">📅 สถิติการลา</h3>
        <button onclick="openModal()" style="border:none; background:var(--white); color:var(--primary); padding:8px 16px; border-radius:12px; font-weight:700; font-size:13px; box-shadow:var(--shadow-soft); cursor:pointer; border:1px solid var(--border-color);">+ แจ้งลา</button>
    </div>

    <div class="card" style="padding:16px;">
        <div id="leaveStatsGrid" class="leave-stats">
            </div>
        
        <div style="border-top: 1px solid var(--border-color); margin-top:15px; padding-top:15px;">
            <h4 style="margin:0 0 12px 0; font-size:14px; color:var(--text-sub);">ประวัติการลาล่าสุด</h4>
            <table style="width:100%; border-collapse: collapse; font-size:14px;">
                <tbody id="leaveHistoryBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div id="leaveModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--text-main); font-size:20px;">แจ้งลาหยุด</h3>
        <div class="input-group">
            <label>ประเภท</label>
            <select id="leaveType">
                <option>ลาป่วย</option>
                <option>ลากิจ</option>
                <option>ลาพักร้อน</option>
            </select>
        </div>
        <div style="display:flex; gap:10px;">
            <div class="input-group" style="flex:1">
                <label>จากวันที่</label>
                <input type="date" id="leaveStart">
            </div>
            <div class="input-group" style="flex:1">
                <label>ถึงวันที่</label>
                <input type="date" id="leaveEnd">
            </div>
        </div>
        <div class="input-group">
            <label>จำนวนวัน</label>
            <input type="number" id="leaveDays" step="0.5">
        </div>
        <div class="input-group">
            <label>เหตุผล</label>
            <textarea id="leaveReason" rows="2" style="resize:none;"></textarea>
        </div>
        <div style="display:flex; gap:12px;">
            <button class="btn-primary" onclick="confirmLeave()" style="flex:2">ส่งใบลา</button>
            <button onclick="closeModal()" style="flex:1; border:none; background:#f1f5f9; color:var(--text-sub); border-radius:16px; font-weight:700; cursor:pointer;">ยกเลิก</button>
        </div>
    </div>
</div>

<script>
// --- Config Firebase ---
const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "your-app.firebaseapp.com",
    databaseURL: "https://your-app-default-rtdb.firebaseio.com",
    projectId: "your-app",
    storageBucket: "your-app.appspot.com",
    messagingSenderId: "...",
    appId: "..."
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentQuota = { sick: 30, personal: 6, vacation: 10 };

function previewImage(event) {
    const reader = new FileReader();
    reader.onload = () => { document.getElementById('profilePreview').src = reader.result; };
    reader.readAsDataURL(event.target.files[0]);
}

function updateProfile() {
    const empId = document.getElementById('employeeId').value;
    if(!empId) return alert("กรุณาระบุรหัสพนักงาน");

    const data = {
        employeeId: empId,
        fullName: document.getElementById('fullName').value,
        position: document.getElementById('position').value,
        department: document.getElementById('department').value,
        startDateWork: document.getElementById('startDateWork').value, // เพิ่มวันเริ่มทำงาน
        photo: document.getElementById('profilePreview').src,
        q_sick: 30, q_personal: 6, q_vacation: 10
    };

    localStorage.setItem('employee_profile', JSON.stringify(data));
    db.ref('users/' + empId).set(data).then(() => {
        document.getElementById('saveStatus').innerText = "✓ บันทึกสำเร็จ";
        setTimeout(() => document.getElementById('saveStatus').innerText = "", 3000);
    });
}

function confirmLeave() {
    const empId = document.getElementById('employeeId').value;
    if(!empId) return alert("กรุณาระบุรหัสพนักงานก่อนแจ้งลา");

    const now = new Date();
    // สร้างวันที่ทำรายการในรูปแบบ ว/ด/ป
    const requestDateStr = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()+543}`;

    const newLeave = {
        id: Date.now(),
        empId: empId,
        name: document.getElementById('fullName').value,
        type: document.getElementById('leaveType').value,
        startDate: document.getElementById('leaveStart').value,
        endDate: document.getElementById('leaveEnd').value,
        days: document.getElementById('leaveDays').value,
        reason: document.getElementById('leaveReason').value,
        requestDate: requestDateStr, // เพิ่มวันที่ทำรายการ
        status: 'รอการอนุมัติ'
    };

    db.ref('leave_requests').push(newLeave).then(() => {
        alert('ส่งคำขอลาสำเร็จ');
        closeModal();
    });
}

function renderLeaveHistory() {
    const empId = document.getElementById('employeeId').value;
    if(!empId) return;

    db.ref('leave_requests').on('value', (snapshot) => {
        const data = snapshot.val();
        const body = document.getElementById('leaveHistoryBody');
        body.innerHTML = "";
        
        let stats = { sick: 0, personal: 0, vacation: 0 };

        if(data) {
            const list = Object.values(data).filter(r => r.empId === empId).reverse();
            list.forEach(r => {
                if(r.status === 'อนุมัติ') {
                    if(r.type === 'ลาป่วย') stats.sick += parseFloat(r.days || 0);
                    if(r.type === 'ลากิจ') stats.personal += parseFloat(r.days || 0);
                    if(r.type === 'ลาพักร้อน') stats.vacation += parseFloat(r.days || 0);
                }
                
                body.innerHTML += `<tr>
                    <td style="padding:12px 4px;">
                        <strong>${r.type}</strong> (${r.days} วัน)<br>
                        <span style="font-size:11px; color:var(--text-sub);">${r.startDate} - ${r.endDate}</span><br>
                        <span style="font-size:10px; color:var(--primary);">ยื่นคำขอเมื่อ: ${r.requestDate || '-'}</span>
                    </td>
                    <td style="text-align:right;"><span class="status-badge ${r.status==='อนุมัติ'?'status-approved':(r.status==='ไม่อนุมัติ'?'status-rejected':'status-pending')}">${r.status}</span></td>
                </tr>`;
            });
        }
        updateStatsView(stats);
    });
}

function updateStatsView(stats) {
    document.getElementById('leaveStatsGrid').innerHTML = `
        <div class="stat-box" style="background:#f0f9ff; color:#0369a1;">ลาป่วย<br><b>${stats.sick}/${currentQuota.sick}</b></div>
        <div class="stat-box" style="background:#fffbeb; color:#92400e;">ลากิจ<br><b>${stats.personal}/${currentQuota.personal}</b></div>
        <div class="stat-box" style="background:#f0fdf4; color:#166534;">ลาพักร้อน<br><b>${stats.vacation}/${currentQuota.vacation}</b></div>
    `;
}

window.onload = function() {
    const saved = JSON.parse(localStorage.getItem('employee_profile'));
    if(saved) {
        document.getElementById('employeeId').value = saved.employeeId || '';
        document.getElementById('fullName').value = saved.fullName || '';
        document.getElementById('position').value = saved.position || '';
        document.getElementById('department').value = saved.department || '';
        document.getElementById('startDateWork').value = saved.startDateWork || ''; // โหลดวันเริ่มทำงาน
        document.getElementById('profilePreview').src = saved.photo || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
        renderLeaveHistory();
    }
};

function openModal() { document.getElementById('leaveModal').style.display = 'block'; }
function closeModal() { document.getElementById('leaveModal').style.display = 'none'; }
</script>
</body>
</html>
