<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - ✓Record Income</title>
<style>
:root {
    --primary: #6a5af9;
    --secondary: #00c6ff;
    --bg: #FDFBF7;
    --white: #ffffff;
}

body {
    margin: 0; font-family: 'Segoe UI', sans-serif;
    background: var(--bg); color: #333; padding-bottom: 100px;
}

/* จัดวาง Header และรูปโปรไฟล์รวมกันให้สวยงาม */
.header {
    background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff;
    padding: 30px 20px; text-align: center;
    border-radius: 0 0 35px 35px;
    box-shadow: 0 10px 25px rgba(106, 90, 249, 0.2);
    display: flex; flex-direction: column; align-items: center;
}

.profile-pic-container {
    display: flex; flex-direction: column; align-items: center; 
    margin-bottom: 15px;
}
#profilePreview {
    width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
    border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
    background: #eee; 
}
.upload-label { font-size: 11px; color: #fff; margin-top: 8px; cursor: pointer; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 10px; font-weight: bold; backdrop-filter: blur(5px); }

.acc-card {
    background: var(--white); margin: 15px; border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.04); overflow: hidden; border: 1px solid rgba(106, 90, 249, 0.1);
}
.acc-header {
    padding: 15px 20px; background: #fff; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: bold; color: var(--primary);
}
.acc-content { padding: 0 20px 20px; display: block; }
.acc-content.collapsed { display: none; }

.info-group { margin-bottom: 12px; }
.info-group label { display: block; font-size: 11px; color: #888; font-weight: bold; margin-bottom: 4px; }
input, textarea, select {
    width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #eee;
    box-sizing: border-box; font-size: 14px; background: #fafafa; font-family: inherit;
}
input:disabled, textarea:disabled, select:disabled { background: #f0f0f0; color: #666; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn {
    border: none; padding: 14px; border-radius: 15px; font-weight: bold;
    cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.save-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }
.status-badge { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
.pending { background: #fff4de; color: #ffa800; }
.approved { background: #c9f7f5; color: #1bc5bd; }
.rejected { background: #ffe2e5; color: #f64e60; }

/* Modal */
.modal {
    display: none; position: fixed; z-index: 2000; left: 0; top: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
}
.modal-content {
    background: #fff; margin: 10% auto; padding: 25px; width: 85%;
    max-width: 350px; border-radius: 30px; max-height: 80vh; overflow-y: auto;
}
</style>
</head>
<body>

<div class="header">
    <div class="profile-pic-container">
        <img id="profilePreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23cccccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
        <input type="file" id="photoInput" style="display:none" accept="image/*" onchange="previewImage(event)">
        <label id="uploadLabel" class="upload-label" for="photoInput">[ เปลี่ยนรูปถ่าย ]</label>
    </div>
    <div style="font-size: 22px; font-weight: 800;">My Profile.</div>
    <div style="font-size: 12px; opacity: 0.9;">ระบบพนักงานอัจฉริยะ</div>
</div>

<div class="acc-card">
    <div class="acc-header" onclick="toggleAcc('personalAcc')">
        <span>👤 ข้อมูลพนักงาน</span> <span id="personalIcon">▼</span>
    </div>
    <div id="personalAcc" class="acc-content">
        <div class="info-group"><label>รหัสพนักงาน</label><input type="text" id="employeeId"></div>
        <div class="info-group"><label>ชื่อ-นามสกุล</label><input type="text" id="fullName"></div>
        <div class="grid-2">
            <div class="info-group"><label>ตำแหน่ง</label><input type="text" id="position"></div>
            <div class="info-group"><label>แผนก</label><input type="text" id="department"></div>
        </div>
        <div class="info-group"><label>เลขประจำตัวประชาชน</label><input type="text" id="idCard"></div>
        <div class="info-group"><label>เบอร์โทรศัพท์</label><input type="tel" id="phone"></div>
    </div>
</div>

<div class="acc-card">
    <div class="acc-header" onclick="toggleAcc('addressAcc')">
        <span>📍 ที่อยู่ปัจจุบัน</span> <span id="addressIcon">▼</span>
    </div>
    <div id="addressAcc" class="acc-content">
        <div class="grid-2">
            <div class="info-group"><label>บ้านเลขที่</label><input type="text" id="addr_no"></div>
            <div class="info-group"><label>หมู่ที่</label><input type="text" id="addr_moo"></div>
        </div>
        <div class="info-group"><label>ตำบล</label><input type="text" id="addr_subdistrict"></div>
        <div class="info-group"><label>อำเภอ</label><input type="text" id="addr_district"></div>
        <div class="info-group"><label>จังหวัด</label><input type="text" id="addr_province"></div>
    </div>
</div>

<div style="padding: 0 15px;">
    <button id="saveBtn" class="btn save-btn" onclick="saveProfile()">💾 บันทึกและยืนยันข้อมูล</button>
    <div id="leaveActions" style="display:none; margin-top: 10px;">
        <div class="grid-2">
            <button class="btn" style="background:#fff; border:1px solid var(--primary); color:var(--primary);" onclick="showLeaveModal()">📅 แจ้งลา</button>
            <button class="btn" style="background:#f0edff; color:var(--primary);" onclick="toggleAcc('historyAcc')">📜 ประวัติการลา</button>
        </div>
    </div>
</div>

<div id="historyAcc" class="acc-card acc-content collapsed" style="margin-top: 15px;">
    <h4 style="color: var(--primary); margin-bottom: 10px;">📊 สิทธิการลาคงเหลือ</h4>
    <div id="leaveQuotaInfo" style="font-size: 11px; background: #f9f8ff; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; color: #555;">
        </div>
    <table style="width: 100%; font-size: 12px; border-collapse: collapse;">
        <tbody id="leaveHistoryBody"></tbody>
    </table>
</div>

<div id="leaveModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color: var(--primary); text-align:center;">ฟอร์มแจ้งลาหยุด</h3>
        
        <div class="info-group">
            <label>ประเภทการลา</label>
            <select id="leaveType">
                <option value="ลาป่วย">🤒 ลาป่วย</option>
                <option value="ลากิจ">💼 ลากิจ</option>
                <option value="ลาพักร้อน">🏖️ ลาพักร้อน</option>
            </select>
        </div>
        
        <div class="grid-2">
            <div class="info-group"><label>ตั้งแต่วันที่</label><input type="date" id="leaveStart"></div>
            <div class="info-group"><label>ถึงวันที่</label><input type="date" id="leaveEnd"></div>
        </div>
        
        <div class="info-group"><label>จำนวนวัน (วัน)</label><input type="number" id="leaveDays" placeholder="เช่น 1, 2, 0.5" step="0.5"></div>
        <div class="info-group"><label>สาเหตุการลา</label><textarea id="leaveReason" rows="3" placeholder="ระบุเหตุผล..."></textarea></div>
        
        <button class="btn save-btn" style="margin-top:10px;" onclick="submitLeave()">🚀 ส่งคำขอลา</button>
        <div onclick="closeModal()" style="margin-top:15px; font-size:12px; color:#999; cursor:pointer; text-align:center; font-weight:bold;">ยกเลิก</div>
    </div>
</div>

<script>
let isLocked = false;

window.onload = function() {
    const saved = JSON.parse(localStorage.getItem('employee_profile'));
    if(saved) {
        Object.keys(saved).forEach(key => {
            const el = document.getElementById(key);
            if(el) el.value = saved[key];
        });
        if(saved.photo) document.getElementById('profilePreview').src = saved.photo;
        if(saved.isLocked) applyLock();
    }
    renderLeaveHistory();
};

function toggleAcc(id) { document.getElementById(id).classList.toggle('collapsed'); }

function applyLock() {
    isLocked = true;
    document.querySelectorAll('#personalAcc input, #addressAcc input').forEach(i => i.disabled = true);
    document.getElementById('uploadLabel').style.display = 'none';
    document.getElementById('saveBtn').style.display = 'none';
    document.getElementById('leaveActions').style.display = 'block';
    document.getElementById('personalAcc').classList.add('collapsed');
}

function saveProfile() {
    const data = {
        employeeId: document.getElementById('employeeId').value,
        fullName: document.getElementById('fullName').value,
        position: document.getElementById('position').value,
        department: document.getElementById('department').value,
        idCard: document.getElementById('idCard').value,
        phone: document.getElementById('phone').value,
        addr_no: document.getElementById('addr_no').value,
        addr_moo: document.getElementById('addr_moo').value,
        addr_subdistrict: document.getElementById('addr_subdistrict').value,
        addr_district: document.getElementById('addr_district').value,
        addr_province: document.getElementById('addr_province').value,
        photo: document.getElementById('profilePreview').src,
        isLocked: true
    };
    
    // ดึงโควตาเดิมมาเพื่อไม่ให้โดนทับหายไป
    const existing = JSON.parse(localStorage.getItem('employee_profile')) || {};
    data.q_sick = existing.q_sick || 30;
    data.q_personal = existing.q_personal || 6;
    data.q_vacation = existing.q_vacation || 10;

    localStorage.setItem('employee_profile', JSON.stringify(data));
    alert('✅ บันทึกสำเร็จ!');
    location.reload();
}

function previewImage(event) {
    const reader = new FileReader();
    reader.onload = () => document.getElementById('profilePreview').src = reader.result;
    reader.readAsDataURL(event.target.files[0]);
}

function showLeaveModal() { document.getElementById('leaveModal').style.display = 'block'; }
function closeModal() { document.getElementById('leaveModal').style.display = 'none'; }

function submitLeave() {
    const lStart = document.getElementById('leaveStart').value;
    const lEnd = document.getElementById('leaveEnd').value;
    const lDays = document.getElementById('leaveDays').value;
    const lReason = document.getElementById('leaveReason').value;

    if(!lStart || !lDays || !lReason) {
        alert("กรุณากรอกข้อมูลให้ครบถ้วน"); return;
    }

    let requests = JSON.parse(localStorage.getItem('leave_requests')) || [];
    requests.push({
        id: Date.now(),
        empId: document.getElementById('employeeId').value,
        name: document.getElementById('fullName').value,
        type: document.getElementById('leaveType').value,
        startDate: lStart,
        endDate: lEnd,
        days: lDays,
        reason: lReason,
        date: new Date().toLocaleDateString('th-TH'),
        status: 'รอการอนุมัติ'
    });
    localStorage.setItem('leave_requests', JSON.stringify(requests));
    
    // รีเซ็ตฟอร์ม
    document.getElementById('leaveStart').value = '';
    document.getElementById('leaveEnd').value = '';
    document.getElementById('leaveDays').value = '';
    document.getElementById('leaveReason').value = '';
    
    alert('ส่งคำขอลาเรียบร้อยแล้ว');
    closeModal();
    renderLeaveHistory();
}

function renderLeaveHistory() {
    const savedProfile = JSON.parse(localStorage.getItem('employee_profile')) || {};
    const sick = savedProfile.q_sick || 30;
    const personal = savedProfile.q_personal || 6;
    const vacation = savedProfile.q_vacation || 10;

    document.getElementById('leaveQuotaInfo').innerHTML = 
        `พักร้อน: เหลือ ${vacation} วัน | ลาป่วย: ${sick} วัน | ลากิจ: ${personal} วัน`;

    const requests = JSON.parse(localStorage.getItem('leave_requests')) || [];
    const empId = document.getElementById('employeeId').value;
    const myLeaves = requests.filter(r => r.empId === empId);
    
    document.getElementById('leaveHistoryBody').innerHTML = myLeaves.map(r => `
        <tr style="border-bottom: 1px solid #f9f9f9;">
            <td style="padding:10px 5px;">
                <strong>${r.type}</strong> (${r.days} วัน)<br>
                <span style="font-size:10px; color:#888;">${r.startDate} ถึง ${r.endDate}</span>
            </td>
            <td style="padding:10px 5px; text-align:right;">
                <span class="status-badge ${r.status === 'อนุมัติ' ? 'approved' : (r.status === 'ไม่อนุมัติ' ? 'rejected' : 'pending')}">${r.status}</span>
            </td>
        </tr>
    `).join('');
}
</script>
</body>
</html>
