<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - ✓Record Income</title>
<style>
:root {
    --primary: #6a5af9;
    --secondary: #00c6ff;
    --bg: #FDFBF7;
    --white: #ffffff;
}

body {
    margin: 0; font-family: 'Segoe UI', sans-serif;
    background: var(--bg); color: #333; padding-bottom: 100px;
}

.header {
    background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff;
    padding: 30px 20px; text-align: center;
    border-radius: 0 0 35px 35px;
    box-shadow: 0 10px 25px rgba(106, 90, 249, 0.2);
    display: flex; flex-direction: column; align-items: center;
}

.profile-pic-container {
    display: flex; flex-direction: column; align-items: center; 
    margin-bottom: 15px; position: relative; cursor: pointer;
}
#profilePreview {
    width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
    border: 4px solid rgba(255,255,255,0.3); background: #eee;
}
.change-pic-hint {
    font-size: 11px; margin-top: 5px; opacity: 0.8; background: rgba(0,0,0,0.2);
    padding: 2px 8px; border-radius: 10px;
}

.container { padding: 20px; margin-top: -20px; }

.info-card {
    background: var(--white); border-radius: 20px; padding: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px;
}

.input-group { margin-bottom: 15px; }
.input-group label { display: block; font-size: 13px; color: #888; margin-bottom: 5px; }
.input-group input, .input-group textarea, .input-group select {
    width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px;
    font-size: 15px; box-sizing: border-box; background: #fafafa;
}

/* สไตล์ปุ่ม Toggle */
.section-toggle-btn {
    background: #f0f2f5; padding: 15px; border-radius: 15px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-weight: bold; color: var(--primary); margin-bottom: 10px;
}
.collapsible-content { display: none; padding: 10px 5px; }

.btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff; border: none; padding: 15px; border-radius: 15px;
    width: 100%; font-size: 16px; font-weight: bold; cursor: pointer;
    box-shadow: 0 5px 15px rgba(106, 90, 249, 0.3);
    margin-top: 10px;
}

.btn-leave {
    background: #ffa800; color: #fff; border: none; padding: 12px;
    border-radius: 12px; width: 100%; font-weight: bold; margin-bottom: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}

.modal {
    display: none; position: fixed; z-index: 1000; left: 0; top: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
}
.modal-content {
    background: #fff; margin: 10% auto; padding: 25px; border-radius: 25px;
    width: 90%; max-width: 400px;
}

.leave-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px;
}

.status-badge { padding: 4px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
.status-pending { background: #fff3cd; color: #856404; }
.status-approved { background: #d4edda; color: #155724; }
.status-rejected { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<div class="header">
    <div class="profile-pic-container" id="picUploadArea" onclick="document.getElementById('fileInput').click()">
        <img id="profilePreview" src="https://via.placeholder.com/100" alt="Profile">
        <div class="change-pic-hint" id="picHint">📷 แตะเพื่อเปลี่ยนรูป</div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
    </div>
    <h2 id="displayName" style="margin:0; font-size: 20px;">ชื่อพนักงาน</h2>
    <p id="displayId" style="margin:5px 0 0; opacity:0.8; font-size: 14px;">ID: -</p>
</div>

<div class="container">
    <div class="info-card">
        <!-- ส่วนข้อมูลส่วนตัว -->
        <div class="section-toggle-btn" onclick="toggleSection('personalContent', 'personalArrow')">
            <span>👤 ข้อมูลส่วนตัว</span>
            <span id="personalArrow">▼</span>
        </div>
        <div id="personalContent" class="collapsible-content">
            <div class="input-group">
                <label>รหัสพนักงาน</label>
                <input type="text" id="employeeId" class="profile-input" placeholder="เช่น 66001">
            </div>
            <div class="input-group">
                <label>เลขประจำตัวประชาชน</label>
                <input type="text" id="idCard" class="profile-input" placeholder="ระบุเลขบัตรประชาชน">
            </div>
            <div class="input-group">
                <label>ชื่อ-นามสกุล</label>
                <input type="text" id="fullName" class="profile-input" placeholder="ชื่อ และ นามสกุล">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex:1;">
                    <label>ตำแหน่ง</label>
                    <input type="text" id="position" class="profile-input">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>แผนก</label>
                    <input type="text" id="department" class="profile-input">
                </div>
            </div>
            <div class="input-group">
                <label>เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" class="profile-input">
            </div>
        </div>

        <!-- ส่วนที่อยู่ -->
        <div class="section-toggle-btn" onclick="toggleSection('addressContent', 'addressArrow')">
            <span>📍 ข้อมูลที่อยู่ปัจจุบัน</span>
            <span id="addressArrow">▼</span>
        </div>
        <div id="addressContent" class="collapsible-content">
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex:1;">
                    <label>บ้านเลขที่</label>
                    <input type="text" id="addr_no" class="profile-input">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>หมู่ที่</label>
                    <input type="text" id="addr_moo" class="profile-input">
                </div>
            </div>
            <div class="input-group">
                <label>ตำบล/แขวง</label>
                <input type="text" id="addr_subdistrict" class="profile-input">
            </div>
            <div class="input-group">
                <label>อำเภอ/เขต</label>
                <input type="text" id="addr_district" class="profile-input">
            </div>
            <div class="input-group">
                <label>จังหวัด</label>
                <input type="text" id="addr_province" class="profile-input">
            </div>
        </div>

        <button id="saveBtn" class="btn-primary" onclick="saveProfile()">💾 บันทึกข้อมูลทั้งหมด</button>
    </div>

    <button class="btn-leave" onclick="openModal()">📅 แจ้งลาหยุดงาน / ลาพักร้อน</button>

    <div class="info-card">
        <h3 style="margin-top:0; color: var(--primary); font-size: 16px;">📊 สถิติการลาปีนี้</h3>
        <div id="leaveStatsGrid" class="leave-stats"></div>
        
        <h3 style="margin-top:20px; color: var(--primary); font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px;">📋 ประวัติการลาล่าสุด</h3>
        <table style="width:100%; border-collapse: collapse; font-size: 13px;">
            <tbody id="leaveHistoryBody"></tbody>
        </table>
    </div>
</div>

<div id="leaveModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color: var(--primary);">📝 แจ้งขอลาหยุด</h3>
        <div class="input-group">
            <label>ประเภทการลา</label>
            <select id="leaveType">
                <option value="ลาป่วย">🤒 ลาป่วย</option>
                <option value="ลากิจ">💼 ลากิจ</option>
                <option value="ลาพักร้อน">🏖️ ลาพักร้อน</option>
            </select>
        </div>
        <div class="input-group">
            <label>วันที่เริ่ม</label>
            <input type="date" id="leaveStart">
        </div>
        <div class="input-group">
            <label>ถึงวันที่</label>
            <input type="date" id="leaveEnd">
        </div>
        <div class="input-group">
            <label>จำนวนวันลา</label>
            <input type="number" id="leaveDays" placeholder="เช่น 1 หรือ 0.5">
        </div>
        <div class="input-group">
            <label>เหตุผลการลา</label>
            <textarea id="leaveReason" rows="2" placeholder="ระบุเหตุผลสั้นๆ"></textarea>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-primary" onclick="submitLeave()">ส่งคำขอลา</button>
            <button onclick="closeModal()" style="border:none; background:#eee; padding:15px; border-radius:15px; flex:1; font-weight:bold;">ยกเลิก</button>
        </div>
    </div>
</div>

<script>
// ฟังก์ชันสลับการเปิด-ปิด ส่วนต่างๆ
function toggleSection(contentId, arrowId) {
    const content = document.getElementById(contentId);
    const arrow = document.getElementById(arrowId);
    if (content.style.display === "block") {
        content.style.display = "none";
        arrow.innerText = "▼";
    } else {
        content.style.display = "block";
        arrow.innerText = "▲";
    }
}

// ฟังก์ชันอัปโหลดและเปลี่ยนรูป
function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('profilePreview').src = e.target.result;
            const profile = JSON.parse(localStorage.getItem('employee_profile')) || {};
            profile.photo = e.target.result;
            localStorage.setItem('employee_profile', JSON.stringify(profile));
        };
        reader.readAsDataURL(file);
    }
}

// ฟังก์ชันสำหรับล็อคช่องกรอกข้อมูล
function lockInputs(isLocked) {
    const inputs = document.querySelectorAll('.profile-input');
    const saveBtn = document.getElementById('saveBtn');
    const picHint = document.getElementById('picHint');
    const picUploadArea = document.getElementById('picUploadArea');

    if (isLocked) {
        inputs.forEach(input => input.readOnly = true);
        if(saveBtn) saveBtn.style.display = 'none';
        if(picHint) picHint.style.display = 'none';
        if(picUploadArea) picUploadArea.onclick = null; // ปิดการเปลี่ยนรูป
    }
}

function saveProfile() {
    const profile = {
        employeeId: document.getElementById('employeeId').value,
        idCard: document.getElementById('idCard').value,
        fullName: document.getElementById('fullName').value,
        position: document.getElementById('position').value,
        department: document.getElementById('department').value,
        phone: document.getElementById('phone').value,
        addr_no: document.getElementById('addr_no').value,
        addr_moo: document.getElementById('addr_moo').value,
        addr_subdistrict: document.getElementById('addr_subdistrict').value,
        addr_district: document.getElementById('addr_district').value,
        addr_province: document.getElementById('addr_province').value,
        photo: document.getElementById('profilePreview').src,
        q_sick: (JSON.parse(localStorage.getItem('employee_profile')) || {}).q_sick || 30,
        q_personal: (JSON.parse(localStorage.getItem('employee_profile')) || {}).q_personal || 6,
        q_vacation: (JSON.parse(localStorage.getItem('employee_profile')) || {}).q_vacation || 10
    };
    
    if(!profile.fullName || !profile.employeeId) {
        alert('กรุณากรอกชื่อและรหัสพนักงานให้ครบถ้วน');
        return;
    }

    localStorage.setItem('employee_profile', JSON.stringify(profile));
    alert('✅ บันทึกข้อมูลสำเร็จ ข้อมูลถูกล็อคแล้ว');
    loadProfile();
}

function loadProfile() {
    const saved = JSON.parse(localStorage.getItem('employee_profile'));
    if(saved) {
        document.getElementById('employeeId').value = saved.employeeId || '';
        document.getElementById('idCard').value = saved.idCard || '';
        document.getElementById('fullName').value = saved.fullName || '';
        document.getElementById('position').value = saved.position || '';
        document.getElementById('department').value = saved.department || '';
        document.getElementById('phone').value = saved.phone || '';
        document.getElementById('addr_no').value = saved.addr_no || '';
        document.getElementById('addr_moo').value = saved.addr_moo || '';
        document.getElementById('addr_subdistrict').value = saved.addr_subdistrict || '';
        document.getElementById('addr_district').value = saved.addr_district || '';
        document.getElementById('addr_province').value = saved.addr_province || '';
        
        if(saved.photo) document.getElementById('profilePreview').src = saved.photo;
        document.getElementById('displayName').innerText = saved.fullName || 'ชื่อพนักงาน';
        document.getElementById('displayId').innerText = 'ID: ' + (saved.employeeId || '-');

        // ตรวจสอบว่าถ้ามีข้อมูลแล้ว ให้ล็อคทันที
        if(saved.fullName && saved.employeeId) {
            lockInputs(true);
        }
    }
    renderLeaveHistory();
}

function openModal() { document.getElementById('leaveModal').style.display = 'block'; }
function closeModal() { document.getElementById('leaveModal').style.display = 'none'; }

function submitLeave() {
    const empId = document.getElementById('employeeId').value;
    if(!empId) { alert('กรุณาระบุรหัสพนักงานในโปรไฟล์ก่อน'); return; }

    const newRequest = {
        id: Date.now(),
        empId: empId,
        name: document.getElementById('fullName').value,
        type: document.getElementById('leaveType').value,
        startDate: new Date(document.getElementById('leaveStart').value).toLocaleDateString('th-TH'),
        endDate: new Date(document.getElementById('leaveEnd').value).toLocaleDateString('th-TH'),
        date: new Date().toLocaleDateString('th-TH'),
        days: document.getElementById('leaveDays').value,
        reason: document.getElementById('leaveReason').value,
        status: 'รอการอนุมัติ'
    };

    let requests = JSON.parse(localStorage.getItem('leave_requests')) || [];
    requests.push(newRequest);
    localStorage.setItem('leave_requests', JSON.stringify(requests));
    
    alert('ส่งคำขอลาเรียบร้อยแล้ว');
    closeModal();
    renderLeaveHistory();
}

function renderLeaveHistory() {
    const profile = JSON.parse(localStorage.getItem('employee_profile')) || {};
    const requests = JSON.parse(localStorage.getItem('leave_requests')) || [];
    const empId = document.getElementById('employeeId').value;
    const myLeaves = requests.filter(r => r.empId === empId);

    const sickQuota = profile.q_sick || 30;
    const perQuota = profile.q_personal || 6;
    const vacQuota = profile.q_vacation || 10;

    const sickUsed = myLeaves.filter(r => r.type === 'ลาป่วย' && r.status === 'อนุมัติ').reduce((sum, r) => sum + parseFloat(r.days||0), 0);
    const perUsed = myLeaves.filter(r => r.type === 'ลากิจ' && r.status === 'อนุมัติ').reduce((sum, r) => sum + parseFloat(r.days||0), 0);
    const vacUsed = myLeaves.filter(r => r.type === 'ลาพักร้อน' && r.status === 'อนุมัติ').reduce((sum, r) => sum + parseFloat(r.days||0), 0);

    document.getElementById('leaveStatsGrid').innerHTML = `
        <div style="background:#e8f4f8; padding:10px; border-radius:15px; text-align:center; font-size:13px; color:#333; font-weight:bold;">
            ลาป่วย<br><span style="color:#666; font-size:12px; font-weight:normal;">ใช้ ${sickUsed}/${sickQuota}</span>
        </div>
        <div style="background:#fff3cd; padding:10px; border-radius:15px; text-align:center; font-size:13px; color:#333; font-weight:bold;">
            ลากิจ<br><span style="color:#666; font-size:12px; font-weight:normal;">ใช้ ${perUsed}/${perQuota}</span>
        </div>
        <div style="background:#d4edda; padding:10px; border-radius:15px; text-align:center; font-size:13px; color:#333; font-weight:bold;">
            พักร้อน<br><span style="color:#666; font-size:12px; font-weight:normal;">ใช้ ${vacUsed}/${vacQuota}</span>
        </div>
    `;

    myLeaves.sort((a,b) => b.id - a.id);
    document.getElementById('leaveHistoryBody').innerHTML = myLeaves.map(r => {
        let transDate = '-';
        if(r.id) {
            const d = new Date(parseInt(r.id));
            transDate = d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        return `
        <tr style="border-bottom: 1px dashed #f0f0f0;">
            <td style="padding:15px 5px;">
                <strong style="color: var(--primary); font-size: 14px;">${r.type}</strong> <span style="color:#555;">(${r.days} วัน)</span><br>
                <span style="font-size:11px; color:#777;">${r.startDate} ถึง ${r.endDate}</span><br>
                <span style="font-size:10px; color:#aaa;">🕒 ทำรายการ: ${transDate}</span>
            </td>
            <td style="padding:15px 5px; text-align:right;">
                <span class="status-badge ${r.status === 'อนุมัติ' ? 'status-approved' : (r.status === 'ไม่อนุมัติ' ? 'status-rejected' : 'status-pending')}">${r.status}</span>
            </td>
        </tr>
    `}).join('');
}

window.onload = loadProfile;
</script>

</body>
</html>
