<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ✓Record Income</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* นำดีไซน์จาก login_profile.html มาใช้ทั้งหมด */
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #0ea5e9;
            --accent: #f43f5e;
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --input-bg: rgba(15, 23, 42, 0.6);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* ของตกแต่งพื้นหลัง */
        .background-decor {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2) 0%, rgba(14, 165, 233, 0.2) 100%);
            backdrop-filter: blur(80px);
            animation: floatAnimation 8s infinite ease-in-out;
        }

        .circle-1 { width: 300px; height: 300px; top: -5%; left: -5%; animation-delay: 0s; }
        .circle-2 { width: 400px; height: 400px; bottom: -10%; right: -5%; animation-delay: 2s; background: linear-gradient(135deg, rgba(14, 165, 233, 0.2) 0%, rgba(244, 63, 94, 0.15) 100%); }
        .circle-3 { width: 150px; height: 150px; top: 40%; left: 80%; animation-delay: 4s; }

        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* โครงสร้างการ์ด */
        .card-container {
            width: 100%;
            max-width: 400px;
            z-index: 10;
            padding: 16px;
            margin: 0;
        }

        .card-face {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 25px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* สไตล์เนื้อหาภายใน */
        .brand-section { text-align: center; }
        .logo-icon {
            width: 60px; height: 60px; 
            background: linear-gradient(135deg, var(--accent) 0%, #be123c 100%);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; color: white; font-size: 24px; box-shadow: 0 8px 16px rgba(244, 63, 94, 0.3);
        }
        .brand-section h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .brand-section p { margin: 5px 0 0; font-size: 13px; color: var(--text-sub); }

        .form-body { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
        
        .input-group { position: relative; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-sub); transition: 0.3s; }
        .input-group input {
            width: 100%; padding: 12px 16px 12px 45px; background: var(--input-bg);
            border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main);
            font-size: 14.5px; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .input-group input::placeholder { color: #64748b; }
        .input-group input:focus { border-color: var(--primary); background: rgba(15, 23, 42, 0.8); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3); }
        .input-group input:focus + i { color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4); }
        .btn-submit:active { transform: translateY(0); }

        /* มือถือ */
        @media (max-width: 480px) {
            .card-face { padding: 30px 20px; }
            .logo-icon { width: 50px; height: 50px; font-size: 20px; }
            .brand-section h2 { font-size: 20px; }
            .input-group input { padding: 11px 16px 11px 42px; font-size: 13.5px; }
        }
    </style>
</head>
<body>

<div class="background-decor">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
</div>

<div class="card-container">
    <div class="card-face">
        
        <div class="brand-section">
            <div class="logo-icon"><i class="fa-solid fa-user-shield"></i></div>
            <h2>Admin Login</h2>
            <p>เข้าสู่ระบบจัดการแอดมิน ✓Record Income</p>
        </div>

        <div class="form-body">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="user" placeholder="Username">
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="pass" placeholder="Password">
            </div>

            <button class="btn-submit" onclick="checkLogin()">
                เข้าสู่ระบบจัดการ <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>

            <p id="msg" style="color: #fb7185; font-size: 13.5px; text-align: center; margin: 0; min-height: 20px; font-weight: 500;"></p>
        </div>

    </div>
</div>

<script>
    // --- โค้ดส่วนนี้ของเตงยังคงเดิม 100% ไม่มีการเปลี่ยนแปลงจ้า ---
    function checkLogin() {
        const u = document.getElementById("user").value;
        const p = document.getElementById("pass").value;
        
        // --- คุณสามารถเปลี่ยน Username และ Password ตรงนี้ได้ ---
        if(u === "admin" && p === "Emp6901004") {
            // สร้าง Session จำลองว่า Login แล้ว (หมดอายุเมื่อปิด Browser)
            sessionStorage.setItem("isAdmin", "true");
            location.href = "admin.html";
        } else {
            document.getElementById("msg").innerHTML = "<i class='fa-solid fa-circle-exclamation'></i> ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
        }
    }
</script>

</body>
</html>
